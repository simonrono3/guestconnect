<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Dashboard</title>
<style>body{background:#0a0a0a;color:white;font-family:monospace;padding:20px}.card{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin:10px 0}input{padding:10px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:8px;margin:4px}button{background:#00ff88;color:#000;padding:10px 16px;border:none;border-radius:20px;font-weight:700}</style></head><body>
<h2 style="color:#00ff88">Vendor Dashboard</h2><div class="card"><b>Add Listing</b><br><br>
<input id="name" placeholder="Name: Wasini Dolphin Tour"><input id="price" type="number" placeholder="Price KES"><input id="duration" placeholder="3 Hours"><br>
<select id="dept" style="padding:10px;background:#1a1a1a;color:white;border:1px solid #333;border-radius:8px"><option>TOURS</option><option>SAFARI</option><option>SPA</option><option>TAXI</option><option>DINE</option></select>
<input id="hotel_id" placeholder="Hotel ID (1 for demo)" value="1" style="width:80px"><br><br>
<button onclick="add()">+ Add Listing</button></div>
<div class="card"><b>My Bookings</b><div id="books">Loading...</div></div>
<script>
const VENDOR_ID = 1; // Later from login
async function add(){
  await fetch('/api/gsh/vendor/listing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hotel_id: parseInt(hotel_id.value), vendor_id: VENDOR_ID, department: dept.value, name: name.value, price: parseFloat(price.value), duration: duration.value, is_available: true})});
  alert('Listing Added! Guests can now book.'); loadBooks();
}
async function loadBooks(){
  const r=await fetch('/api/gsh/vendor/bookings/'+VENDOR_ID); const d=await r.json();
  books.innerHTML = d.length? d.map(b=>`<div style="border-bottom:1px solid #222;padding:8px 0">${b.created_at?.split('T')[0]} - ${b.guest_phone} - ${b.status}</div>`).join('') : 'No bookings yet';
}
loadBooks();
</script></body></html>
