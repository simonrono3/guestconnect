<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Dashboard</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0} .card{background:#111827}</style></head><body class="p-4"><div class="max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-[#38bdf8] mb-4">Vendor Dashboard</h1><div id="stats" class="grid grid-cols-2 gap-4 mb-4"></div><div id="list" class="space-y-2"></div></div><script>const vendorId=new URLSearchParams(window.location.search).get('vendorId')||'taxi@test.com';fetch('/api/data').then(r=>r.json()).then(data=>{const myServices=data.services.filter(s=>s.vendorId===vendorId);const myBookings=data.bookings.filter(b=>myServices.some(s=>s.id==b.serviceId));const total=myBookings.reduce((a,b)=>a+(parseFloat(b.price)-b.commission),0);document.getElementById('stats').innerHTML=`<div class="card p-4 rounded-3xl"><div>Bookings</div><div class="text-2xl font-bold">${myBookings.length}</div></div><div class="card p-4 rounded-3xl"><div>Earnings</div><div class="text-2xl font-bold text-[#22c55e]">KES ${total.toLocaleString()}</div></div>`;document.getElementById('list').innerHTML=myBookings.map(b=>`<div class="card p-3 rounded-2xl">${b.serviceName} - Room ${b.room} - KES ${b.price}</div>`).join('')||'No bookings';});</script></body></html>
