<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor OS 9.2 - Integrated</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--lime:#c6ff00;--gold:#fbbf24;--bg:#070707;--card:#131313;--border:#222;--ok:#22c55e;--muted:#888}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:50;background:rgba(7,7,7,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.wallet{margin:14px;background:linear-gradient(135deg,#c6ff00,#fbbf24);color:#000;border-radius:20px;padding:18px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:8px;padding:14px;overflow:auto;position:sticky;top:62px;z-index:40;background:var(--bg)}
.tab{white-space:nowrap;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:#fff;font-weight:800;font-size:13px;cursor:pointer}.tab.active{background:var(--lime);color:#000}
.btn{padding:12px;border:none;border-radius:12px;font-weight:900;cursor:pointer}.btn-a{background:var(--lime);color:#000}.btn-d{background:#1f1f1f;color:#fff;border:1px solid #333}.btn-c{background:#fbbf24;color:#000}
.badge{font-size:10px;font-weight:900;padding:4px 8px;border-radius:999px;background:var(--lime);color:#000}
.toggle{width:46px;height:26px;background:#333;border-radius:999px;position:relative;cursor:pointer}.toggle.on{background:var(--ok)}.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.toggle.on::after{left:23px}
</style>
</head>
<body>
<header><div style="font-family:Space Grotesk;font-weight:800">GuestHub <span style="color:var(--lime)">Vendor OS 9.2</span></div><div id="vendorName" style="font-size:11px;color:#888">Loading...</div></header>

<div class="wallet"><div><small style="font-weight:800;opacity:.7">WALLET • <span id="status">PENDING</span></small><h2 id="bal" style="margin:4px 0 0;font-family:Space Grotesk;font-size:32px">Ksh 0</h2><small id="city">-</small></div><button class="btn" style="background:#000;color:#fff;border-radius:999px" onclick="alert('M-Pesa withdrawal: Supabase integration coming - funds after OTP')">Withdraw</button></div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px">
<div class="card" style="text-align:center"><b id="svcCount">0</b><br><small style="color:#888">SERVICES</small></div>
<div class="card" style="text-align:center"><b>5.0⭐</b><br><small style="color:#888">NEW VENDOR</small></div>
<div class="card" style="text-align:center"><b id="orderCount">0</b><br><small style="color:#888">ORDERS</small></div>
</div>

<div style="margin:10px 14px;background:#131313;border:1px solid #222;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center">
<div><b>🟢 Available for jobs</b><br><small style="color:#888">Hotels see you when ON</small></div><div class="toggle on" id="avail" onclick="this.classList.toggle('on')"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('new',this)">🔔 New Jobs</button>
<button class="tab" onclick="showTab('active',this)">📅 Active</button>
<button class="tab" onclick="showTab('services',this)">🛠️ My Services</button>
<button class="tab" onclick="showTab('profile',this)">👤 Profile</button>
</div>

<div id="view-new" style="padding:0 14px"><div id="jobsList"></div></div>
<div id="view-active" style="padding:0 14px;display:none"><div class="card" style="text-align:center;color:#888">No active jobs yet. Accept one from New Jobs.</div></div>
<div id="view-services" style="padding:0 14px;display:none"></div>
<div id="view-profile" style="padding:0 14px;display:none"></div>

<script src="config.js"></script>
<script>
const supa = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentVendor=null;

async function init(){
 // 1. Get vendor from localStorage or last login email
 const email = localStorage.getItem('vendor_email');
 if(!email){ document.getElementById('vendorName').innerText='Not logged in - go /vendor-signup.html'; return; }
 const {data,error} = await supa.from('vendors').select('*').eq('email',email).single();
 if(error ||!data){ document.getElementById('vendorName').innerText='Vendor not found'; return; }
 currentVendor=data;
 document.getElementById('vendorName').innerText=data.full_name+' • '+data.city;
 document.getElementById('bal').innerText='Ksh '+(data.wallet||0);
 document.getElementById('city').innerText=data.city+' • '+ (data.vehicle||'');
 document.getElementById('status').innerText=data.status.toUpperCase();
 document.getElementById('svcCount').innerText=(data.services||[]).length;
 renderServices(data);
 renderProfile(data);
 loadJobs(data);
}

function renderServices(v){
 const cont=document.getElementById('view-services');
 let html=`<div class=card><b>🛠️ Your Active Services (${v.services.length})</b><br><small style=color:#888>Hotels filter by these</small><div style=margin-top:12px;display:flex;flex-direction:column;gap:8px>`;
 const priceMap={airport_taxi:2500,sgr_taxi:2000,town_taxi:500,car_hire:8000,luxury_transfer:12000,boda_tuktuk:200,nairobi_tour:3500,park_day:8000,mara_safari:25000,amboseli_safari:20000,hike_guide:3000,beach_safari:7000,massage:3500,spa_nails:2000,laundry:500,gym_trainer:1500,babysitter:1000,chef:5000,photography:5000,drone:8000,shopping:1000,translator:2000,event_decor:4000,concierge:800};
 (v.services||[]).forEach(s=>{
  const label=s.replace(/_/g,' ').toUpperCase();
  html+=`<div style=display:flex;justify-content:space-between;background:#0a0a0a;padding:10px;border-radius:12px;border:1px solid #222><span>✅ ${label}</span><b>Ksh ${priceMap[s]||v.price||2500}</b></div>`;
 });
 html+=`</div><button class=btn style=width:100%;margin-top:12px;background:#1f1f1f;color:#fff onclick="location.href='/vendor-signup.html'">+ Edit Services</button></div>`;
 cont.innerHTML=html;
}

function renderProfile(v){
 const cont=document.getElementById('view-profile');
 cont.innerHTML=`<div class=card><b>👤 ${v.full_name}</b><br><small style=color:#888>ID: ${v.id_number} • ${v.phone}<br>Vehicle: ${v.vehicle} - ${v.plate}<br>M-Pesa: ${v.mpesa} (${v.mpesa_name})<br>Bio: ${v.bio}</small><br><br><span style=background:${v.status=='approved'?'#22c55e':'#fbbf24'};color:#000;padding:4px 10px;border-radius:999px;font-weight:900;font-size:11px>${v.status.toUpperCase()}</span><br><br><button class=btn btn-d style=width:100% onclick="localStorage.clear();location.href='/vendor-login.html'">Logout</button></div>`;
}

async function loadJobs(v){
 // Fetch orders matching vendor services
 const {data:orders} = await supa.from('orders').select('*').eq('status','new').limit(10);
 const list=document.getElementById('jobsList');
 if(!orders || orders.length==0){
  list.innerHTML=`<div class=card style=text-align:center;color:#888>🔔 No new jobs for <b>${v.services[0]||'you'}</b> yet.<br><small>Hotels in ${v.city} will send when guest orders.<br>Keep AVAILABLE ON.</small><br><br><div style=background:#0a0a0a;border-radius:12px;padding:12px;text-align:left><b>Demo Job (test accept):</b><br>Room 305 • Airport Pickup • Ksh 2,500<br><button class=btn btn-a style=width:100%;margin-top:8px onclick="acceptDemo(this)">Accept Demo Ksh 2500</button></div></div>`;
  document.getElementById('orderCount').innerText='0';
  return;
 }
 document.getElementById('orderCount').innerText=orders.length;
 list.innerHTML=orders.map(o=>`
  <div class=card style=border-left:4px solid var(--lime)>
   <div style=display:flex;justify-content:space-between><b>Room ${o.room} • ${o.hotel_name||'Hotel'}</b><span class=badge>NEW</span></div>
   <div style=color:#888;font-size:12px;margin-top:6px>Service: <b style=color:#fff>${o.service}</b><br>Pay: <b style=color:var(--lime)>Ksh ${o.amount}</b> • Guest: ${o.guest_name||'Guest'}</div>
   <div style=display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px><button class=btn btn-a onclick="acceptOrder('${o.id}')">✅ Accept</button><button class=btn btn-d>Decline</button></div>
  </div>`).join('');
}

function showTab(name,el){ document.querySelectorAll('[id^=view-]').forEach(d=>d.style.display='none'); document.getElementById('view-'+name).style.display='block'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
function acceptDemo(btn){ btn.innerText='✅ Accepted! Check Active'; btn.style.background='#22c55e'; setTimeout(()=>showTab('active',document.querySelectorAll('.tab')[1]),600); }
async function acceptOrder(id){ alert('✅ Order '+id+' accepted! Guest notified on WhatsApp. OTP required to complete.'); }

init();
// Save email from signup redirect hack
if(!localStorage.getItem('vendor_email')){ const e=prompt('Enter your vendor email to load dashboard (once):'); if(e){ localStorage.setItem('vendor_email',e); location.reload(); } }
</script>
</body>
</html>
