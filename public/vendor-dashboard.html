<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuestHub Vendor OS 12.0 — Live Jobs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>
:root{--lime:#c6ff00;--gold:#fbbf24;--bg:#070707;--card:#121212;--card2:#0b0b0b;--border:#242424;--muted:#888;--ok:#22c55e;--danger:#ef4444;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:100;background:rgba(7,7,7,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Space Grotesk;font-weight:800;font-size:17px}.brand span{color:var(--lime)}.vendor-mini{text-align:right;font-size:10px;color:var(--muted)}
.wallet{margin:14px;background:linear-gradient(135deg,#c6ff00,#fbbf24);color:#000;border-radius:22px;padding:20px}
.btn{padding:11px 14px;border:0;border-radius:11px;font-weight:800;font-size:12px;cursor:pointer}.btn-a{background:var(--lime);color:#000}.btn-g{background:var(--gold);color:#000}.btn-d{background:#202020;color:#fff;border:1px solid #333}.btn-red{background:#3a1111;color:#ff7777;border:1px solid #572020}.btn-blue{background:#082c3d;color:#38bdf8;border:1px solid #10465c}.btn-full{width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 14px}.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px 8px;text-align:center}.stat b{display:block;font-family:Space Grotesk;font-size:20px}.stat small{color:var(--muted);font-size:8px;font-weight:800}
.tabs{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;position:sticky;top:62px;z-index:80;background:var(--bg)}.tab{white-space:nowrap;padding:10px 15px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:#fff;font-weight:800;font-size:11px;cursor:pointer}.tab.active{background:var(--lime);color:#000}
.view{padding:0 14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:11px}
.job{border-left:4px solid var(--lime)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900;background:#242424}.badge-new{background:#263500;color:var(--lime)}.badge-active{background:#082c3d;color:var(--blue)}
.input{width:100%;background:#080808;color:#fff;border:1px solid #303030;border-radius:11px;padding:12px;outline:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);background:#fff;color:#000;padding:12px 18px;border-radius:999px;font-weight:800;font-size:11px;z-index:999;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:500;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modal-box{width:100%;max-width:600px;background:#111;border:1px solid #333;border-radius:22px 22px 0 0;padding:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="brand">GuestHub <span>Vendor OS 12.0</span></div><div class="vendor-mini"><div id="vendorName">Loading...</div><div id="vendorCity">—</div></div></header>
<main style="max-width:900px;margin:auto">
<section class="wallet"><div style="display:flex;justify-content:space-between"><div><small>WALLET • <span id="walletStatus">LIVE</span></small><h1 id="walletBalance" style="margin:5px 0 3px;font-family:Space Grotesk;font-size:34px">Ksh 0</h1><div style="font-size:11px;opacity:.75">Earnings from GM hotels</div></div><div style="font-size:30px">💳</div></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="background:#000;color:#fff" onclick="toast('M-Pesa auto soon')">Withdraw</button><button class="btn btn-d" onclick="refreshDashboard()">🔄 Refresh</button></div></section>
<section class="stats"><div class="stat"><b id="statHotels">0</b><small>HOTELS</small></div><div class="stat"><b id="statNew">0</b><small>NEW</small></div><div class="stat"><b id="statActive">0</b><small>ACTIVE</small></div><div class="stat"><b id="statCompleted">0</b><small>DONE</small></div></section>
<nav class="tabs">
<button class="tab active" onclick="showTab('new',this)">🔔 New Jobs</button>
<button class="tab" onclick="showTab('active',this)">📅 Active</button>
<button class="tab" onclick="showTab('hotels',this)">🏨 My Hotels</button>
<button class="tab" onclick="showTab('profile',this)">👤 Profile</button>
</nav>
<section id="view-new" class="view"><div id="newJobs">Loading...</div></section>
<section id="view-active" class="view" style="display:none"><div id="activeJobs"></div></section>
<section id="view-hotels" class="view" style="display:none"><div id="hotelsContent"></div></section>
<section id="view-profile" class="view" style="display:none"><div id="profileContent"></div></section>
</main>
<div id="toast" class="toast">Done</div>
<script>
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentVendor=null, allOrders=[];
function money(v){return 'Ksh '+Number(v||0).toLocaleString()}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toastM(m){const el=document.getElementById('toast');el.innerText=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function getToken(){return localStorage.getItem('vendor_token')||''}

async function init(){
 const token=getToken();
 if(!token){ location.href='/vendor-login.html'; return; }
 try{
  const r=await fetch('/api/vendor/me',{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(!j.ok || !j.vendor) throw new Error('Auth fail');
  currentVendor=j.vendor;
 }catch{
  // fallback email
  const email=localStorage.getItem('vendor_email');
  if(!email){ location.href='/vendor-login.html'; return; }
  const {data}=await supa.schema('guesthub_os').from('vendors').select('*').eq('email',email.toLowerCase()).maybeSingle();
  if(!data) return location.href='/vendor-login.html';
  currentVendor=data;
 }
 document.getElementById('vendorName').innerText=currentVendor.vendor_name;
 document.getElementById('vendorCity').innerText=(currentVendor.city||'')+' • '+currentVendor.status;
 document.getElementById('walletBalance').innerText=money(currentVendor.wallet||0);
 document.getElementById('walletStatus').innerText=currentVendor.status?.toUpperCase();
 loadOrders(); loadMyHotels(); renderProfile();
}

async function loadOrders(){
 // Vendor sees orders where vendor_id = his id OR hotel_id where his service is active
 try{
  const token=getToken();
  const r=await fetch('/api/vendor/orders',{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  allOrders=j.orders||[];
 }catch{
  const {data}=await supa.schema('guesthub_os').from('orders').select('*').order('created_at',{ascending:false}).limit(100);
  allOrders=data||[];
 }
 // Filter: orders that match my vendor_id OR my hotels
 const myVendorId=currentVendor.id;
 const filtered=allOrders.filter(o=> String(o.vendor_id||'')===String(myVendorId) || (o.department==='services' && String(o.hotel_id).toUpperCase()!=='') );
 const newJobs=filtered.filter(o=>['pending','new'].includes(String(o.status).toLowerCase()));
 const active=filtered.filter(o=>['accepted','in_progress','ready'].includes(String(o.status).toLowerCase()));
 const done=filtered.filter(o=>['completed','done'].includes(String(o.status).toLowerCase()));
 document.getElementById('statNew').innerText=newJobs.length;
 document.getElementById('statActive').innerText=active.length;
 document.getElementById('statCompleted').innerText=done.length;
 renderNew(newJobs); renderActive(active);
}

function renderNew(orders){
 const box=document.getElementById('newJobs');
 if(!orders.length) { box.innerHTML=`<div class="card" style="text-align:center;padding:30px;color:#888">No new jobs — GM anapo-add hotel yako, orders za guest zitaingia hapa live<br><small>Keep checking guest.html</small></div>`; return; }
 box.innerHTML=orders.map(o=>`
  <div class="card job">
   <div style="display:flex;justify-content:space-between"><b>${esc(o.guest_name||'Guest')} — Room ${esc(o.room_number||o.room)}</b><span class="badge badge-new">${esc(o.status)}</span></div>
   <div style="font-size:11px;color:#888;margin-top:6px">🏨 ${esc(o.hotel_id)} • ${(o.items||[]).map(i=>i.name).join(', ')} • ${money(o.total)}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn btn-a" onclick="updateOrder('${o.id}','accepted')">✅ Accept</button><button class="btn btn-blue" onclick="updateOrder('${o.id}','completed')">✓ Complete</button></div>
  </div>
 `).join('');
}
function renderActive(orders){
 const box=document.getElementById('activeJobs');
 if(!orders.length) { box.innerHTML=`<div class="card" style="text-align:center;padding:30px;color:#888">No active</div>`; return; }
 box.innerHTML=orders.map(o=>`<div class="card job"><div style="display:flex;justify-content:space-between"><b>${esc(o.guest_name)} — ${esc(o.room_number)}</b><span class="badge badge-active">${esc(o.status)}</span></div><div style="font-size:11px;color:#888">${money(o.total)} • ${(o.items||[]).map(i=>i.name).join(', ')}</div><button class="btn btn-a" style="width:100%;margin-top:10px" onclick="updateOrder('${o.id}','completed')">✓ Mark Completed</button></div>`).join('');
}

async function loadMyHotels(){
 const {data}=await supa.schema('guesthub_os').from('hotel_services').select('hotel_id').eq('vendor_id',currentVendor.id).eq('is_active',true);
 const hotels=[...new Set((data||[]).map(d=>d.hotel_id))];
 document.getElementById('statHotels').innerText=hotels.length;
 document.getElementById('hotelsContent').innerHTML=`<div class="card"><b>🏨 My Hotels — ${hotels.length} active</b><br><small style="color:#888">GM ali-ku-add kwa hizi hotels, guests wanaona services zako</small></div>`+hotels.map(h=>`<div class="card">${esc(h)} <span class="badge badge-new">LIVE</span></div>`).join('')||'<div class="card">No hotels yet — GM needs to add you in hotel-dashboard → Vendors Pool</div>';
}

async function updateOrder(id,status){
 await supa.schema('guesthub_os').from('orders').update({status}).eq('id',id);
 toastM('Status → '+status); loadOrders();
}
function renderProfile(){
 document.getElementById('profileContent').innerHTML=`<div class="card"><b>${esc(currentVendor.vendor_name)}</b><br><small>${esc(currentVendor.email)} • ${esc(currentVendor.phone)}</small><br><br>Price: ${money(currentVendor.price)}<br>Location: ${esc(currentVendor.location)}<br>Status: ${esc(currentVendor.status)}</div><div class="card"><button class="btn btn-red btn-full" onclick="localStorage.clear(); location.href='/vendor-login.html'">Logout</button></div>`;
}
function showTab(name,el){ document.querySelectorAll('[id^="view-"]').forEach(s=>s.style.display='none'); document.getElementById('view-'+name).style.display='block'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
function refreshDashboard(){ loadOrders(); loadMyHotels(); toastM('Refreshed'); }
init();
</script>
</body>
</html>
