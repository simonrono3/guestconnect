<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003580">
<meta name="description" content="Sign in to your GuestHub hotel dashboard.">
<title>Sign in — GuestHub</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23003580'/%3E%3Crect x='13' y='13' width='17' height='17' rx='3' fill='%23fff'/%3E%3Crect x='34' y='13' width='17' height='17' rx='3' fill='%23fff'/%3E%3Crect x='13' y='34' width='17' height='17' rx='3' fill='%23fff'/%3E%3Cpath d='M36.5 48.5 L48.5 36.5 M42 36.5 L48.5 36.5 L48.5 43' stroke='%23febb02' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* =====================================================================
   Tokens
   ===================================================================== */
:root{
  --brand:#003580; --brand-2:#0071c2; --brand-3:#005999;
  --brand-soft:#ebf3ff; --brand-line:#d4e4f5;
  --yellow:#febb02; --yellow-soft:#fff6e0; --yellow-line:#f0dfa0; --yellow-ink:#7a5c00;
  --green:#008009; --green-soft:#e8f5e9; --green-line:#c3e6c4;
  --red:#d32f2f; --red-soft:#fdeaea; --red-line:#f4c5c5;
  --bg:#fff; --bg-subtle:#f5f5f5; --bg-muted:#f7f7f7;
  --border:#e7e7e7; --border-2:#d9d9d9; --border-3:#c5c5c5;
  --text:#1a1a1a; --text-2:#595959; --text-3:#8a8a8a; --text-4:#a9a9a9;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --shadow-xs:0 1px 2px rgb(0 0 0/4%);
  --shadow-sm:0 1px 3px rgb(0 0 0/6%),0 1px 2px rgb(0 0 0/4%);
  --shadow-md:0 4px 12px rgb(0 0 0/8%),0 2px 4px rgb(0 0 0/4%);
  color-scheme: light;
}

*,*::before,*::after{ box-sizing: border-box; }
*{ margin: 0; padding: 0; }
html{ scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body{
  font-family: var(--font);
  font-size: 16px; line-height: 1.6;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'cv02','cv03','cv04','cv11';
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
ul { list-style: none; }

::selection { background: var(--yellow); color: var(--text); }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }

.container { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: 24px; }
@media (max-width: 640px) { .container { padding-inline: 20px; } }

/* =====================================================================
   Buttons
   ===================================================================== */
.btn{
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; height: 40px; padding: 0 16px;
  font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
  border-radius: var(--r-sm); border: 1px solid transparent;
  white-space: nowrap; cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease,
              color .15s ease, box-shadow .15s ease;
}
.btn-primary { background: var(--brand-2); color: #fff; box-shadow: var(--shadow-xs); }
.btn-primary:hover:not(:disabled) { background: var(--brand-3); }
.btn-primary:disabled { opacity: .65; cursor: wait; }
.btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border-2); box-shadow: var(--shadow-xs); }
.btn-secondary:hover { background: var(--bg-subtle); border-color: var(--border-3); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn-lg { height: 48px; padding: 0 20px; font-size: 15px; border-radius: var(--r); }
.btn .arrow { transition: transform .15s ease; }
.btn:hover:not(:disabled) .arrow { transform: translateX(2px); }

.btn-spinner{
  display: none;
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btn-spin .7s linear infinite;
  flex-shrink: 0;
}
.btn.is-loading .btn-spinner { display: block; }
.btn.is-loading .arrow { display: none; }
@keyframes btn-spin { to { transform: rotate(360deg); } }

/* =====================================================================
   Header
   ===================================================================== */
.header{
  position: sticky; top: 0; z-index: 100;
  background: var(--brand); color: #fff;
  border-bottom: 1px solid rgb(255 255 255 / 10%);
}
.header-inner{
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; height: 60px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { display: block; width: 32px; height: 32px; flex-shrink: 0; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; color: #fff; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.header .btn-secondary {
  background: transparent; color: #fff;
  border-color: rgb(255 255 255 / 35%);
}
.header .btn-secondary:hover {
  background: rgb(255 255 255 / 10%);
  border-color: rgb(255 255 255 / 50%);
}

/* =====================================================================
   Login page
   ===================================================================== */
.login-page{
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 0 96px;
  background: var(--bg);
  overflow: hidden;
}
.login-page::before{
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgb(0 53 128 / 4%) 1px, transparent 1px),
    linear-gradient(90deg, rgb(0 53 128 / 4%) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 900px 500px at 50% 20%, #000 0%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse 900px 500px at 50% 20%, #000 0%, transparent 78%);
  pointer-events: none;
}
.login-page > .container { position: relative; z-index: 1; }

@media (max-width: 640px){ .login-page{ padding: 32px 0 64px; } }

.login-box{ max-width: 440px; margin-inline: auto; }

/* Head */
.login-head{ text-align: center; margin-bottom: 32px; }
.section-label{
  font-size: 13px; font-weight: 500;
  color: var(--brand-2);
}
.login-title{
  margin-top: 8px;
  font-size: clamp(26px, 3.6vw, 34px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--text);
}
.login-lead{
  margin-top: 12px;
  font-size: 15px;
  line-height: 1.55;
  color: var(--text-2);
  max-width: 360px;
  margin-inline: auto;
}
@media (max-width: 640px){
  .login-head{ margin-bottom: 24px; }
  .login-lead{ font-size: 14.5px; }
}

/* =====================================================================
   Card
   ===================================================================== */
.card{
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px;
  box-shadow: var(--shadow-xs);
}
@media (max-width: 640px){ .card{ padding: 22px; } }

/* =====================================================================
   Form fields
   ===================================================================== */
.field{ margin-top: 16px; }
.field:first-of-type{ margin-top: 0; }

label{
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
}
label .req{ color: var(--red); font-weight: 700; }
label .opt{ color: var(--text-4); font-weight: 500; font-size: 12px; margin-left: auto; }

.input-wrap{ position: relative; }

input{
  width: 100%;
  padding: 12px 14px;
  background: #fff;
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input::placeholder{ color: var(--text-4); font-weight: 400; }
input:focus{
  border-color: var(--brand-2);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
input[type="password"]{ padding-right: 44px; }

/* Password reveal */
.toggle-pw{
  position: absolute;
  top: 50%; right: 10px;
  transform: translateY(-50%);
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--text-3);
  transition: color .15s ease, background .15s ease;
}
.toggle-pw:hover{ color: var(--text); background: var(--bg-subtle); }
.toggle-pw svg{ width: 16px; height: 16px; }

/* Hotel ID hint */
.field-hint{
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 5px;
}
.field-hint svg{ width: 13px; height: 13px; flex-shrink: 0; color: var(--text-4); }

/* =====================================================================
   Message
   ===================================================================== */
.msg{
  display: none;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r);
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.5;
  margin-top: 16px;
  border: 1px solid;
}
.msg.err{ display: flex; background: var(--red-soft); color: var(--red); border-color: var(--red-line); }
.msg.ok { display: flex; background: var(--green-soft); color: var(--green); border-color: var(--green-line); }
.msg svg{ flex-shrink: 0; margin-top: 2px; width: 16px; height: 16px; }

/* =====================================================================
   Submit
   ===================================================================== */
.btn-submit{ width: 100%; margin-top: 20px; }

/* =====================================================================
   Footer note
   ===================================================================== */
.login-foot{
  text-align: center;
  margin-top: 24px;
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.6;
}
.login-foot a{
  color: var(--brand-2);
  font-weight: 600;
  transition: color .15s ease;
}
.login-foot a:hover{ color: var(--brand-3); }
.login-foot .sep{
  display: inline-block;
  margin: 0 8px;
  color: var(--text-4);
}

/* =====================================================================
   Footer
   ===================================================================== */
.footer{
  padding: 28px 0;
  background: var(--bg-subtle);
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 12.5px;
  color: var(--text-3);
}
.footer strong{ color: var(--text-2); font-weight: 600; }

/* =====================================================================
   Motion
   ===================================================================== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration: 0s !important;
    transition-duration: 0s !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- ============================= Header ============================= -->
<header class="header">
  <div class="container header-inner">
    <a href="/" class="brand" aria-label="GuestHub home">
      <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect width="64" height="64" rx="14" fill="#003580"/>
        <rect x="13" y="13" width="17" height="17" rx="3" fill="#ffffff"/>
        <rect x="18.5" y="18.5" width="6" height="6" rx="1.5" fill="#003580"/>
        <rect x="34" y="13" width="17" height="17" rx="3" fill="#ffffff"/>
        <rect x="39.5" y="18.5" width="6" height="6" rx="1.5" fill="#003580"/>
        <rect x="13" y="34" width="17" height="17" rx="3" fill="#ffffff"/>
        <rect x="18.5" y="39.5" width="6" height="6" rx="1.5" fill="#003580"/>
        <path d="M36.5 48.5 L48.5 36.5 M42 36.5 L48.5 36.5 L48.5 43"
              stroke="#febb02" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-name">GuestHub</span>
    </a>

    <div class="header-actions">
      <a href="/hotel-signup.html" class="btn btn-secondary btn-sm">List your hotel</a>
    </div>
  </div>
</header>

<!-- ============================= Login ============================= -->
<main class="login-page">
  <div class="container">
    <div class="login-box">

      <div class="login-head">
        <div class="section-label">Hotel dashboard</div>
        <h1 class="login-title">Sign in</h1>
        <p class="login-lead">
          Access your orders, menu, vendors and revenue in one place.
        </p>
      </div>

      <section class="card">
        <form id="form" novalidate>

          <div class="field">
            <label for="hotelId">Hotel ID <span class="req">*</span></label>
            <input
              id="hotelId"
              required
              placeholder="e.g. BAOBAB"
              autocapitalize="characters"
              autocomplete="username"
              spellcheck="false"
            >
            <div class="field-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4"/>
                <path d="M12 8h.01"/>
              </svg>
              The ID we gave you after signup
            </div>
          </div>

          <div class="field">
            <label for="password">Password <span class="req">*</span></label>
            <div class="input-wrap">
              <input
                id="password"
                type="password"
                required
                placeholder="Enter your password"
                autocomplete="current-password"
              >
              <button
                type="button"
                class="toggle-pw"
                id="togglePw"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div id="msg" class="msg" role="status" aria-live="polite"></div>

          <button class="btn btn-primary btn-lg btn-submit" type="submit" id="btn">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Sign in to dashboard</span>
            <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          </button>

        </form>
      </section>

      <p class="login-foot">
        No account? <a href="/hotel-signup.html">List your hotel</a>
        <span class="sep">·</span>
        <a href="/contact.html">Need help?</a>
      </p>

    </div>
  </div>
</main>

<!-- ============================= Footer ============================= -->
<footer class="footer">
  <div class="container">
    © <span id="year"></span> <strong>GuestHub</strong> · Made in Kenya
  </div>
</footer>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const form = $('form');
  const msg = $('msg');
  const btn = $('btn');
  const btnText = btn.querySelector('.btn-text');
  const hotelIdInput = $('hotelId');
  const passwordInput = $('password');
  const togglePw = $('togglePw');
  const eyeIcon = $('eyeIcon');

  /* ---------------- Icons ---------------- */
  const ICONS = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
    err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
    eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
    eyeOff: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>'
  };

  function showMsg(text, type){
    msg.className = 'msg ' + (type || 'err');
    msg.innerHTML = ICONS[type === 'ok' ? 'ok' : 'err'] + '<span></span>';
    msg.querySelector('span').textContent = text;
  }
  function clearMsg(){
    msg.className = 'msg';
    msg.innerHTML = '';
  }

  /* ---------------- Password reveal ---------------- */
  togglePw.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    togglePw.setAttribute('aria-pressed', String(!showing));
    togglePw.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    eyeIcon.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
    passwordInput.focus();
  });

  /* ---------------- Force uppercase hotel ID ---------------- */
  hotelIdInput.addEventListener('input', () => {
    const start = hotelIdInput.selectionStart;
    const end = hotelIdInput.selectionEnd;
    hotelIdInput.value = hotelIdInput.value.toUpperCase();
    // Keep caret position stable while typing
    try { hotelIdInput.setSelectionRange(start, end); } catch(_) {}
  });

  /* ---------------- Submit ---------------- */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    clearMsg();

    const hotelId = hotelIdInput.value.trim().toUpperCase();
    const password = passwordInput.value;

    if (!hotelId){
      showMsg('Please enter your hotel ID.', 'err');
      hotelIdInput.focus();
      return;
    }
    if (!password){
      showMsg('Please enter your password.', 'err');
      passwordInput.focus();
      return;
    }

    btn.disabled = true;
    btn.classList.add('is-loading');
    btnText.textContent = 'Signing in';

    try {
      const r = await fetch('/api/hotels/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hotel_id: hotelId, password })
      });

      if (r.status === 429){
        throw new Error('Too many attempts — please wait 15 minutes and try again.');
      }

      let j;
      try { j = await r.json(); }
      catch(_) { throw new Error('Unexpected server response. Please try again.'); }

      if (!j.ok) throw new Error(j.error || 'Login failed');

      localStorage.setItem('hotel_token', j.token);
      localStorage.setItem('hotel_id', j.hotel_id);
      localStorage.setItem('hotel_name', j.hotel?.name || j.hotel?.hotel_name || '');

      showMsg('Welcome back — redirecting to your dashboard.', 'ok');
      btnText.textContent = 'Redirecting';

      setTimeout(() => {
        window.location.href = '/hotel-dashboard.html?hotel=' + encodeURIComponent(j.hotel_id);
      }, 500);

    } catch (err){
      showMsg(err.message || 'Login failed', 'err');
      btn.disabled = false;
      btn.classList.remove('is-loading');
      btnText.textContent = 'Sign in to dashboard';
      passwordInput.focus();
      passwordInput.select();
    }
  });

  /* ---------------- Footer year ---------------- */
  const yearEl = $('year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
