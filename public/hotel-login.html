<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Login - GuestHub8.5</title>
<style>
body{background:#0a0a0a; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.login-box{background:#1a1a1a; padding:30px; border-radius:15px; border:2px solid #B8860B; width:90%; max-width:400px;}
h1{text-align:center; color:#B8860B; margin-bottom:20px;}
label{display:block; margin-top:15px; color:#DAA520; font-weight:bold;}
input{width:100%; padding:12px; margin-top:5px; background:#222; border:1px solid #333; border-radius:8px; color:#fff;}
button{background:#B8860B; color:#000; padding:15px; width:100%; border:none; border-radius:10px; font-weight:bold; font-size:16px; margin-top:20px; cursor:pointer;}
button:hover{background:#DAA520;}
.note{font-size:12px; color:#aaa; text-align:center; margin-top:15px;}
</style>
</head>
<body>

<div class="login-box">
  <h1>🏨 Hotel Dashboard Login</h1>
  
  <form onsubmit="login(event)">
    <label>Hotel Email</label>
    <input type="email" id="email" required placeholder="gm@prideinn.co.ke">

    <label>Password</label>
    <input type="password" id="password" required placeholder="********">

    <button type="submit">Login to Dashboard</button>
  </form>
  
  <p class="note">Don't have an account? <a href="/" style="color:#00FF7F;">Contact GuestHub8.5</a></p>
</div>

<script>
function login(e){
  e.preventDefault();
  // Kwa sasa tuna-demo. Baadaye tuna-connect na database
  alert("Login Successful! 🎉 \nRedirecting to Hotel Dashboard...");
  window.location.href = '/hotel-dashboard.html';
}
</script>

</body>
</html>
