<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel Login — GuestHub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#c6ff00;--gold:#fbbf24;--bg:#070707;--card:#121212;--border:#222}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,rgba(251,191,36,.08),transparent 40%),var(--bg);color:#fff;font-family:Inter,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px}
.logo{text-align:center;margin-bottom:22px}
.logo b{font-family:Space Grotesk;font-size:26px;color:var(--gold);display:block}
.logo span{font-size:10px;letter-spacing:3px;color:#888;font-weight:800}
label{font-size:10px;font-weight:900;color:#777;letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:14px}
input{width:100%;margin-top:6px;padding:14px;background:#080808;border:1px solid #2a2a2a;border-radius:12px;color:#fff;font-size:14px;outline:none;font-family:inherit}
input:focus{border-color:var(--gold)}
.btn{width:100%;background:linear-gradient(135deg,var(--gold),#eab308);color:#000;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:15px;margin-top:20px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:13px;font-weight:700;display:none;text-align:center}
.msg.err{display:block;background:#2a0d0d;color:#ff7b7b;border:1px solid #7f1d1d}
.msg.ok{display:block;background:#0d2a15;color:#4ade80;border:1px solid #166534}
.note{text-align:center;color:#666;font-size:12px;margin-top:18px}
.note a{color:var(--lime);text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><b>GUESTHUB</b><span>HOTEL DASHBOARD</span></div>
  <form id="form">
    <label>Hotel ID</label>
    <input id="hotelId" required placeholder="e.g. BAOBAB" autocapitalize="characters" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
    <button type="submit" class="btn" id="btn">Login to Dashboard →</button>
  </form>
  <div id="msg" class="msg"></div>
  <div class="note">No account? <a href="/hotel-signup.html">Register your hotel</a></div>
</div>
<script>
const $ = id => document.getElementById(id);
const msg = $('msg');

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  msg.className = 'msg';
  const btn = $('btn');
  btn.disabled = true;
  btn.innerText = 'Signing in...';

  try {
    const r = await fetch('/api/hotels/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        hotel_id: $('hotelId').value.trim().toUpperCase(),
        password: $('password').value
      })
    });

    if (r.status === 429) throw new Error('Too many attempts — wait 15 minutes');

    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Login failed');

    localStorage.setItem('hotel_token', j.token);
    localStorage.setItem('hotel_id', j.hotel_id);
    localStorage.setItem('hotel_name', j.hotel?.name || j.hotel?.hotel_name || '');

    msg.className = 'msg ok';
    msg.textContent = 'Welcome! Redirecting...';
    setTimeout(() => { window.location.href = '/gm-dashboard.html?hotel=' + encodeURIComponent(j.hotel_id); }, 500);
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message || 'Login failed';
    btn.disabled = false;
    btn.innerText = 'Login to Dashboard →';
  }
});
</script>
</body>
</html>
