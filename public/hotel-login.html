<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM Login | GUESTHUB</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{background:linear-gradient(180deg,#1A1A1A 0%,#2D2418 100%);color:#fff;font-family:'Inter';padding:40px 20px;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.container{max-width:450px;width:100%;background:rgba(45,36,24,0.9);padding:40px;border-radius:24px;border:2px solid #FF6B35;backdrop-filter:blur(16px)}
h1{font-family:'Playfair Display';font-size:36px;color:#FFD700;text-align:center;margin-bottom:10px}
.subtitle{text-align:center;opacity:0.7;margin-bottom:30px}
input{width:100%;padding:16px;margin:12px 0;background:#1A1A1A;border:1px solid #444;border-radius:12px;color:#fff;font-size:16px;box-sizing:border-box}
.btn{width:100%;padding:18px;background:linear-gradient(135deg,#FF6B35,#0F9D58);border:none;color:#fff;font-weight:800;border-radius:12px;cursor:pointer;font-size:16px;margin-top:10px}
.btn:hover{transform:scale(0.98)}
.link{text-align:center;margin-top:20px}
.link a{color:#FFD700;text-decoration:none}
</style>
</head><body>
<div class="container">
<h1>🏨 GM LOGIN</h1>
<p class="subtitle">Access your hotel control center</p>
<input id="hotelId" placeholder="Enter Hotel ID - e.g prideinn" required>
<input id="password" type="password" placeholder="Password" required>
<button class="btn" onclick="login()">LOGIN TO DASHBOARD</button>
<div class="link">Don't have account? <a href="/hotel-signup.html">Sign up</a></div>
</div>
<script>
function login(){
  const id = document.getElementById('hotelId').value.trim();
  const pass = document.getElementById('password').value;
  if(!id || !pass) return alert('Please fill all fields');
  
  fetch('/api/hotel/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hotelId:id,password:pass})})
  .then(r=>r.json()).then(d=>{
    if(d.ok){
      localStorage.setItem('gm_hotelId', id);
      window.location.href = `/gm-dashboard.html?hotelId=${id}`;
    } else {
      alert(d.message || 'Login failed');
    }
  });
}
</script></body></html>
