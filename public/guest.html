<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003580">
<title>GuestHub Marketplace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">

<style>
:root{
  --brand:#003580; --brand-2:#0071c2; --brand-3:#005999;
  --brand-soft:#ebf3ff; --brand-line:#d4e4f5;
  --gold:#c9a227; --gold-soft:#fdf6e3; --gold-line:#f0dfa0; --gold-ink:#7a5c00;
  --yellow:#febb02; --yellow-soft:#fff6e0; --yellow-line:#f0dfa0; --yellow-ink:#7a5c00;
  --green:#008009; --green-soft:#e8f5e9; --green-line:#c3e6c4;
  --red:#d32f2f; --red-soft:#fdeaea; --red-line:#f4c5c5;
  --purple:#7c3aed; --purple-soft:#f3e8ff;
  --coral:#ff6b5b; --coral-soft:#fff0ed;
  --bg:#fff; --bg-subtle:#f5f7fa; --bg-muted:#f9fafb;
  --surface:#fff;
  --border:#e7e7e7; --border-2:#d9d9d9; --border-3:#c5c5c5;
  --text:#1a1a1a; --text-2:#595959; --text-3:#6f6f6f;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
  --shadow-xs:0 1px 2px rgb(0 0 0/4%);
  --shadow-sm:0 1px 3px rgb(0 0 0/6%),0 1px 2px rgb(0 0 0/4%);
  --shadow-md:0 4px 14px rgb(0 0 0/8%),0 2px 4px rgb(0 0 0/4%);
  --shadow-lg:0 12px 32px rgb(0 0 0/10%),0 4px 8px rgb(0 0 0/4%);
  --shadow-xl:0 24px 48px rgb(0 0 0/14%);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font);
  font-size:14.5px; line-height:1.5; color:var(--text);
  background:var(--bg-subtle);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:calc(90px + var(--safe-b));
  overscroll-behavior-y:contain;
}
img,svg{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,select,textarea{ font:inherit; color:inherit; }
::selection{ background:var(--yellow); color:var(--text); }
:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; border-radius:6px; }
.icon{ display:inline-block; vertical-align:middle; flex-shrink:0; color:currentColor; }
.hidden{ display:none !important; }

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:100;
  background:linear-gradient(180deg,#002855 0%,#003580 100%);
  color:#fff;
  border-bottom:1px solid rgb(255 255 255 / 8%);
  box-shadow:0 2px 12px rgba(0,40,85,.15);
}
.app-header-inner{
  max-width:760px; margin:auto;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:12px 18px; min-height:60px;
}
.brand{ display:flex; align-items:center; gap:11px; min-width:0; }
.brand-logo{
  display:grid; place-items:center;
  width:38px; height:38px; border-radius:11px;
  background:linear-gradient(135deg,var(--yellow),#ff9a00);
  color:#000; font-weight:900; font-size:16px;
  box-shadow:0 4px 12px rgba(254,187,2,.35);
  flex-shrink:0;
}
.brand-text{ min-width:0; }
.brand-title{
  font-size:15px; font-weight:700; letter-spacing:-.015em;
  color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-sub{
  font-size:11.5px; color:rgba(255,255,255,.75);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-top:1px;
}
.header-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
.icon-btn{
  width:38px; height:38px; border-radius:11px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  color:#fff; display:grid; place-items:center;
  position:relative;
  transition:background .15s;
}
.icon-btn:hover{ background:rgba(255,255,255,.2); }
.icon-btn .icon{ width:18px; height:18px; }

/* ============ CONTAINER ============ */
.container{ max-width:760px; margin:0 auto; padding:0 0 40px; }

/* ============ GREETING HERO ============ */
.greeting{
  padding:20px 18px 12px;
}
.greeting-eyebrow{
  font-size:12px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--brand-2);
  display:flex; align-items:center; gap:6px;
}
.greeting-eyebrow .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 3px var(--green-soft);
}
.greeting-title{
  font-family:var(--display);
  font-size:28px; font-weight:700; letter-spacing:-.02em;
  color:var(--text); margin-top:4px; line-height:1.15;
}
.greeting-sub{
  font-size:13.5px; color:var(--text-2); margin-top:4px;
}

/* ============ CONCIERGE INPUT ============ */
.concierge{
  margin:14px 18px 0;
  background:linear-gradient(135deg,#fff 0%,#fafbff 100%);
  border:1.5px solid var(--brand-line);
  border-radius:var(--r-xl);
  padding:14px 16px;
  box-shadow:0 4px 20px rgba(0,53,128,.06);
  position:relative; overflow:hidden;
}
.concierge::before{
  content:""; position:absolute; top:-30px; right:-30px;
  width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle,rgba(254,187,2,.15),transparent 70%);
  pointer-events:none;
}
.concierge-label{
  font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--brand-2);
  display:flex; align-items:center; gap:6px;
  margin-bottom:8px;
}
.concierge-label .icon{ width:14px; height:14px; color:var(--gold); }
.concierge-input{
  width:100%; border:0; background:transparent;
  font-size:15px; font-weight:500; outline:none;
  padding:4px 0; resize:none;
  line-height:1.5;
  min-height:44px;
  font-family:inherit;
}
.concierge-input::placeholder{ color:var(--text-3); }
.concierge-suggestions{
  display:flex; gap:6px; overflow-x:auto;
  margin-top:10px; padding-bottom:2px;
  scrollbar-width:none;
}
.concierge-suggestions::-webkit-scrollbar{ display:none; }
.sugg-chip{
  flex:0 0 auto;
  padding:6px 12px; border-radius:999px;
  background:var(--brand-soft); border:1px solid var(--brand-line);
  font-size:12px; font-weight:600; color:var(--brand-2);
  white-space:nowrap;
  transition:all .15s;
}
.sugg-chip:hover{ background:var(--brand-2); color:#fff; }

/* ============ MOMENT BAR ============ */
.moment{
  display:flex; align-items:center; gap:12px;
  margin:16px 18px 0;
  padding:12px 16px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border-radius:var(--r-lg);
  color:#fff;
  position:relative; overflow:hidden;
}
.moment::after{
  content:""; position:absolute; right:-20px; top:-20px;
  width:80px; height:80px; border-radius:50%;
  background:radial-gradient(circle,rgba(254,187,2,.25),transparent 70%);
}
.moment-emoji{ font-size:26px; flex-shrink:0; }
.moment-text{ flex:1; min-width:0; }
.moment-label{
  font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--yellow);
}
.moment-title{
  font-size:14.5px; font-weight:700; margin-top:2px;
  color:#fff;
}

/* ============ ACTIVE CARD ============ */
.active-card{
  display:none;
  margin:16px 18px 0;
  background:#fff;
  border-radius:var(--r-lg);
  padding:16px 18px;
  box-shadow:var(--shadow-md);
  border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.active-card.show{ display:block; }
.active-card::before{
  content:""; position:absolute; left:0; top:0; bottom:0;
  width:4px; background:var(--brand-2);
}
.active-card.status-preparing::before{ background:var(--yellow); }
.active-card.status-on_the_way::before{ background:var(--purple); }
.active-card.status-completed::before{ background:var(--green); }
.active-card.status-cancelled::before{ background:var(--red); }
.active-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; margin-bottom:8px;
}
.active-title{
  font-size:15px; font-weight:700; letter-spacing:-.01em;
}
.active-ref{
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  color:var(--brand-2); margin-top:2px; letter-spacing:.3px;
}
.eta-pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; margin:8px 0;
  background:var(--brand-soft); border:1px solid var(--brand-line);
  border-radius:999px;
  font-size:12.5px; font-weight:700; color:var(--brand-2);
}
.eta-pill .icon{ width:14px; height:14px; }
.progress{ display:flex; gap:4px; margin-top:10px; }
.progress .seg{
  flex:1; height:5px; border-radius:999px;
  background:var(--border);
  transition:background .3s;
}
.progress .seg.on{ background:var(--brand-2); }
.progress .seg.done{ background:var(--green); }

/* ============ SECTIONS / RAILS ============ */
.section{
  margin-top:28px;
}
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; padding:0 18px; margin-bottom:12px;
}
.section-title{
  font-family:var(--display);
  font-size:20px; font-weight:700; letter-spacing:-.015em;
  color:var(--text);
  display:flex; align-items:center; gap:8px;
}
.section-title .emoji{ font-size:18px; }
.section-sub{
  font-size:12px; color:var(--text-3); margin-top:1px;
}
.section-link{
  font-size:12.5px; font-weight:700; color:var(--brand-2);
  display:inline-flex; align-items:center; gap:4px;
  padding:6px 10px; border-radius:999px;
  transition:background .15s;
}
.section-link:hover{ background:var(--brand-soft); }

/* Rails (horizontal scroll) */
.rail{
  display:flex; gap:12px;
  overflow-x:auto;
  padding:4px 18px 8px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{ display:none; }
.rail > *{ scroll-snap-align:start; }

/* ============ PRODUCT CARDS ============ */
.tile{
  flex:0 0 220px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  overflow:hidden;
  box-shadow:var(--shadow-xs);
  transition:all .2s ease;
  cursor:pointer;
  position:relative;
}
.tile:hover{
  border-color:var(--brand-line);
  box-shadow:var(--shadow-md);
  transform:translateY(-2px);
}
.tile-img{
  height:120px; background:var(--bg-subtle);
  position:relative; overflow:hidden;
  display:grid; place-items:center;
  font-size:44px;
}
.tile-img img{ width:100%; height:100%; object-fit:cover; }
.tile-body{ padding:12px 14px 14px; }
.tile-name{
  font-size:14px; font-weight:700; letter-spacing:-.01em;
  line-height:1.3;
  overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.tile-meta{
  font-size:11.5px; color:var(--text-3); margin-top:3px;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.tile-price-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-top:10px;
}
.price{
  font-size:15px; font-weight:800; color:var(--brand);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.price small{ font-size:10.5px; color:var(--text-3); font-weight:600; margin-left:3px; }
.add-btn{
  width:34px; height:34px; border-radius:10px;
  background:var(--brand-2); color:#fff;
  display:grid; place-items:center;
  transition:all .15s;
  box-shadow:0 2px 6px rgba(0,113,194,.25);
}
.add-btn:hover{ background:var(--brand); }
.add-btn:active{ transform:scale(.9); }
.add-btn.has{ background:var(--green); }
.add-btn .icon{ width:16px; height:16px; }

/* Pro tile (bigger, 2-col grid) */
.tile.tile-lg{ flex:0 0 260px; }
.tile.tile-lg .tile-img{ height:150px; }

/* Vendor badge on tile */
.tile-badge{
  position:absolute; top:10px; left:10px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  color:#fff; font-size:10px; font-weight:700;
  padding:4px 9px; border-radius:999px;
  letter-spacing:.03em; text-transform:uppercase;
  display:flex; align-items:center; gap:4px;
}
.tile-badge.hotel{ background:var(--brand); }
.tile-badge.local{ background:var(--coral); }
.tile-badge.popular{ background:var(--yellow); color:#000; }
.tile-badge .icon{ width:9px; height:9px; }

/* Diet tags */
.diet-tags{ display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
.diet-tag{
  font-size:10px; font-weight:600;
  padding:2px 7px; border-radius:999px;
  background:var(--green-soft); color:var(--green);
  border:1px solid var(--green-line);
}
.diet-tag.warn{ background:var(--red-soft); color:var(--red); border-color:var(--red-line); }

/* ============ VENDOR CARDS (grid) ============ */
.vendor-grid{
  display:grid; grid-template-columns:1fr; gap:12px;
  padding:0 18px;
}
@media(min-width:560px){ .vendor-grid{ grid-template-columns:1fr 1fr; } }

.vendor-card{
  background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); overflow:hidden;
  box-shadow:var(--shadow-xs);
  transition:all .2s;
}
.vendor-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
.vendor-cover{
  height:110px; background:linear-gradient(135deg,var(--brand-soft),#dbeafe);
  position:relative; overflow:hidden;
}
.vendor-cover img{ width:100%; height:100%; object-fit:cover; }
.vendor-logo{
  position:absolute; bottom:-22px; left:14px;
  width:48px; height:48px; border-radius:14px;
  background:#fff; border:3px solid #fff;
  box-shadow:var(--shadow-sm);
  display:grid; place-items:center;
  font-size:20px; font-weight:900; color:var(--brand);
  overflow:hidden;
}
.vendor-logo img{ width:100%; height:100%; object-fit:cover; }
.vendor-body{ padding:30px 14px 14px; }
.vendor-name{
  font-size:15px; font-weight:700; letter-spacing:-.01em;
}
.vendor-meta{
  font-size:11.5px; color:var(--text-3); margin-top:3px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.vendor-rating{
  display:inline-flex; align-items:center; gap:3px;
  font-weight:700; color:var(--text);
}
.vendor-rating .icon{ width:11px; height:11px; color:var(--yellow); }
.vendor-hours{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:700;
  padding:2px 8px; border-radius:999px;
}
.vendor-hours.open{ background:var(--green-soft); color:var(--green); }
.vendor-hours.closed{ background:var(--red-soft); color:var(--red); }
.vendor-hours .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; }
.vendor-desc{
  font-size:12.5px; color:var(--text-2); margin-top:8px;
  line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.vendor-tags{
  display:flex; flex-wrap:wrap; gap:4px; margin-top:10px;
}
.vendor-tag{
  font-size:10.5px; padding:3px 9px;
  background:var(--bg-subtle); border:1px solid var(--border);
  border-radius:999px; color:var(--text-2); font-weight:600;
}
.vendor-actions{ display:flex; gap:8px; margin-top:12px; }
.vendor-actions .btn{ flex:1; }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px; height:40px; padding:0 16px;
  font-size:13.5px; font-weight:700; letter-spacing:-.01em;
  border-radius:var(--r); border:1px solid transparent;
  white-space:nowrap; transition:all .15s ease;
}
.btn:active:not(:disabled){ transform:scale(.97); }
.btn:disabled{ opacity:.55; cursor:wait; }
.btn-primary{ background:var(--brand-2); color:#fff; box-shadow:0 2px 6px rgba(0,113,194,.25); }
.btn-primary:hover:not(:disabled){ background:var(--brand); }
.btn-gold{ background:linear-gradient(135deg,var(--yellow),#ff9a00); color:#000; box-shadow:0 3px 10px rgba(254,187,2,.35); }
.btn-secondary{ background:#fff; color:var(--text); border-color:var(--border-2); box-shadow:var(--shadow-xs); }
.btn-secondary:hover:not(:disabled){ background:var(--bg-subtle); border-color:var(--border-3); }
.btn-ghost{ background:transparent; color:var(--brand-2); border-color:var(--brand-line); }
.btn-ghost:hover:not(:disabled){ background:var(--brand-soft); }
.btn-full{ width:100%; }
.btn-lg{ height:50px; padding:0 24px; font-size:15px; border-radius:var(--r-lg); }
.btn-sm{ height:32px; padding:0 12px; font-size:12px; border-radius:var(--r-sm); }
.btn .icon{ width:15px; height:15px; }

/* ============ CATEGORY PILLS ============ */
.pills{
  display:flex; gap:8px; overflow-x:auto;
  padding:4px 18px 12px;
  scrollbar-width:none;
}
.pills::-webkit-scrollbar{ display:none; }
.pill{
  flex:0 0 auto;
  padding:9px 16px; border-radius:999px;
  background:#fff; border:1px solid var(--border-2);
  font-size:13px; font-weight:600; color:var(--text-2);
  white-space:nowrap; transition:all .15s;
  display:inline-flex; align-items:center; gap:6px;
}
.pill .emoji{ font-size:14px; }
.pill:hover:not(.on){ border-color:var(--brand-line); color:var(--brand-2); }
.pill.on{ background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 2px 8px rgba(0,53,128,.2); }

/* ============ CART BAR ============ */
.cart-bar{
  position:fixed; left:12px; right:12px;
  bottom:calc(78px + var(--safe-b));
  background:linear-gradient(135deg,#003580,#005999);
  color:#fff; border-radius:var(--r-lg);
  padding:14px 18px;
  display:none; align-items:center; justify-content:space-between;
  gap:12px;
  box-shadow:0 16px 40px rgba(0,53,128,.4);
  z-index:95;
  animation:slideUp .3s cubic-bezier(.3,1.3,.5,1);
}
.cart-bar.show{ display:flex; }
@keyframes slideUp{
  from{ opacity:0; transform:translateY(16px); }
  to{ opacity:1; transform:translateY(0); }
}
.cart-bar .info b{ display:block; font-size:14.5px; font-weight:800; }
.cart-bar .info small{ font-size:11.5px; color:rgba(255,255,255,.8); }
.cart-bar button{
  background:var(--yellow); color:#000;
  border:none; padding:11px 20px;
  border-radius:999px;
  font-weight:800; font-size:13px;
  display:inline-flex; align-items:center; gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.cart-bar button:hover{ filter:brightness(1.06); }

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex; justify-content:space-around;
  padding:8px 4px calc(8px + var(--safe-b));
  z-index:90;
  box-shadow:0 -8px 24px rgba(0,0,0,.06);
}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-3);
  font-size:10.5px; font-weight:700;
  padding:6px 10px;
  border-radius:var(--r);
  transition:all .15s;
  position:relative;
  min-width:60px;
}
.nav-btn .icon{ width:22px; height:22px; }
.nav-btn.on{ color:var(--brand); }
.nav-btn.on::before{
  content:""; position:absolute; top:0; left:50%;
  transform:translateX(-50%);
  width:26px; height:3px; border-radius:999px;
  background:var(--yellow);
}
.nav-btn .nav-dot{
  position:absolute; top:4px; right:12px;
  min-width:16px; height:16px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9.5px; font-weight:800;
  border-radius:999px;
  display:grid; place-items:center;
  border:1.5px solid #fff;
}

/* ============ SHEETS ============ */
.sheet{
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.5);
  display:none; align-items:flex-end;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.sheet.show{ display:flex; }
.sheet-body{
  background:#fff;
  width:100%; max-width:620px;
  margin:0 auto;
  max-height:92vh; overflow-y:auto;
  border-radius:24px 24px 0 0;
  padding:22px 20px calc(24px + var(--safe-b));
  animation:sheetUp .3s cubic-bezier(.3,1.3,.5,1);
}
@media(min-width:700px){
  .sheet{ align-items:center; padding:20px; }
  .sheet-body{ border-radius:20px; }
}
@keyframes sheetUp{
  from{ transform:translateY(100%); }
  to{ transform:translateY(0); }
}
.sheet-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px; margin-bottom:18px; padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.sheet-title{
  font-family:var(--display);
  font-size:22px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; gap:8px;
}
.sheet-sub{
  font-size:13px; color:var(--text-3); margin-top:4px; line-height:1.5;
}
.sheet-close{
  width:36px; height:36px; flex-shrink:0;
  border-radius:50%; background:var(--bg-subtle);
  border:1px solid var(--border);
  display:grid; place-items:center;
  color:var(--text-2);
  transition:background .15s;
}
.sheet-close:hover{ background:var(--border); }
.sheet-close .icon{ width:16px; height:16px; }

/* ============ FORM ============ */
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:12px; font-weight:700;
  color:var(--text-2); margin-bottom:6px;
  letter-spacing:.02em;
}
.input, .textarea{
  width:100%; padding:13px 15px;
  background:#fff; border:1.5px solid var(--border-2);
  border-radius:var(--r);
  font-size:14.5px; font-weight:500;
  outline:none; transition:all .15s;
}
.input:focus, .textarea:focus{
  border-color:var(--brand-2);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.textarea{ min-height:80px; resize:vertical; font-family:inherit; }
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ============ CART LINES ============ */
.cart-line{
  display:flex; gap:12px; padding:14px 0;
  border-bottom:1px solid var(--border);
  align-items:center;
}
.cart-line-icon{
  width:52px; height:52px; border-radius:12px;
  background:var(--bg-subtle); display:grid; place-items:center;
  font-size:24px; flex-shrink:0; overflow:hidden;
}
.cart-line-icon img{ width:100%; height:100%; object-fit:cover; }
.cart-line-body{ flex:1; min-width:0; }
.cart-line-name{ font-size:14px; font-weight:700; }
.cart-line-price{ font-size:12px; color:var(--text-3); margin-top:3px; }
.qty{
  display:flex; align-items:center;
  background:var(--bg-subtle); border:1px solid var(--border);
  border-radius:999px; padding:3px;
  flex-shrink:0;
}
.qty button{
  width:28px; height:28px; border-radius:50%;
  background:transparent;
  display:grid; place-items:center;
  color:var(--brand-2); font-weight:800; font-size:16px;
  transition:background .15s;
}
.qty button:hover{ background:#fff; }
.qty span{
  min-width:26px; text-align:center;
  font-weight:800; font-size:13.5px;
  font-variant-numeric:tabular-nums;
}

/* Totals */
.totals{ padding:16px 0 0; display:flex; flex-direction:column; gap:6px; }
.total-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-2); }
.total-row.grand{
  font-weight:800; font-size:17px; color:var(--text);
  padding-top:12px; margin-top:6px;
  border-top:2px solid var(--border);
}

/* ============ EMPTY STATE ============ */
.empty{
  text-align:center; padding:48px 24px;
  color:var(--text-3); font-size:13.5px;
}
.empty-icon{
  width:64px; height:64px; margin:0 auto 14px;
  border-radius:18px; background:var(--bg-subtle);
  border:1px solid var(--border);
  display:grid; place-items:center; color:var(--text-3);
}
.empty-icon .icon{ width:28px; height:28px; }
.empty b{
  display:block; font-size:16px; font-weight:700;
  color:var(--text); margin-bottom:6px;
}
.empty p{ line-height:1.6; max-width:360px; margin:0 auto; }

/* ============ TOAST ============ */
.toast{
  position:fixed; left:50%; bottom:120px;
  transform:translate(-50%,120%);
  background:#1a1a1a; color:#fff;
  padding:13px 20px; border-radius:999px;
  font-size:13px; font-weight:600;
  z-index:500;
  transition:transform .3s cubic-bezier(.3,1.3,.5,1);
  box-shadow:var(--shadow-xl);
  max-width:calc(100vw - 32px);
  display:flex; align-items:center; gap:8px;
}
.toast.show{ transform:translate(-50%,0); }
.toast.error{ background:var(--red); }
.toast .icon{ width:16px; height:16px; flex-shrink:0; }

/* ============ WELCOME ============ */
.welcome-hero{ text-align:center; padding:32px 24px 24px; }
.welcome-hero .badge-icon{
  width:72px; height:72px; margin:0 auto 16px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--yellow),#ff9a00);
  color:#000;
  display:grid; place-items:center;
  box-shadow:0 16px 32px rgba(254,187,2,.3);
}
.welcome-hero .badge-icon .icon{ width:36px; height:36px; }
.welcome-hero h1{
  font-family:var(--display);
  font-size:26px; font-weight:700; letter-spacing:-.02em;
  margin-bottom:8px;
}
.welcome-hero p{
  font-size:14.5px; color:var(--text-2); line-height:1.55;
  max-width:360px; margin:0 auto;
}
.loc-chip{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:16px; padding:9px 16px;
  background:var(--brand-soft);
  border:1px solid var(--brand-line);
  color:var(--brand-2);
  font-weight:700; font-size:13px;
  border-radius:999px;
}
.loc-chip .icon{ width:15px; height:15px; }

/* ============ SPINNER ============ */
.spinner{
  width:18px; height:18px;
  border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============ OFFLINE ============ */
.offline{
  position:fixed; top:0; left:0; right:0; z-index:400;
  background:var(--red); color:#fff;
  text-align:center; padding:9px;
  font-size:12.5px; font-weight:700;
  transform:translateY(-100%);
  transition:transform .3s;
}
.offline.show{ transform:translateY(0); }

/* ============ SEARCH ============ */
.search-wrap{
  margin:0 18px 12px;
  position:relative;
}
.search-wrap input{
  width:100%; height:46px;
  padding:0 44px 0 42px;
  background:#fff; border:1.5px solid var(--border-2);
  border-radius:999px;
  font-size:14px; outline:none;
  transition:all .15s;
}
.search-wrap input:focus{
  border-color:var(--brand-2);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.search-wrap .search-icon{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--text-3);
  pointer-events:none;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(v){
  const currency = state.hotel?.currency || 'Ksh';
  return currency + ' ' + Number(v || 0).toLocaleString();
}

async function api(path, opts = {}){
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  let json = {};
  try { json = await res.json(); } catch {}
  if (!res.ok || json.ok === false) {
    const err = new Error(json.error || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return json;
}

let toastTimer = null;
function toast(msg, kind = 'success'){
  const el = $('toast');
  el.className = 'toast ' + kind;
  el.innerHTML = (kind === 'error' ? ICON.alert : ICON.check) + '<span>' + esc(msg) + '</span>';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function statusBadge(status){
  const s = String(status || '').toLowerCase();
  const map = {
    pending:['badge-yellow','Pending'], new:['badge-yellow','New'],
    accepted:['badge-blue','Accepted'], preparing:['badge-blue','Preparing'],
    on_the_way:['badge-purple','On the way'], completed:['badge-green','Completed'],
    cancelled:['badge-red','Cancelled'], requested:['badge-yellow','Requested'],
    confirmed:['badge-blue','Confirmed'], declined:['badge-red','Declined']
  };
  const [cls, label] = map[s] || ['badge-gray', s.toUpperCase()];
  const colors = {
    'badge-yellow':'background:#fff6e0;color:#7a5c00;border:1px solid #f0dfa0',
    'badge-blue':'background:#ebf3ff;color:#0071c2;border:1px solid #d4e4f5',
    'badge-purple':'background:#f3e8ff;color:#7c3aed;border:1px solid #e0c8ff',
    'badge-green':'background:#e8f5e9;color:#008009;border:1px solid #c3e6c4',
    'badge-red':'background:#fdeaea;color:#d32f2f;border:1px solid #f4c5c5',
    'badge-gray':'background:#f5f7fa;color:#6f6f6f;border:1px solid #e7e7e7'
  };
  return `<span class="badge" style="${colors[cls]};display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap">${esc(label)}</span>`;
}

function relativeTime(iso){
  if (!iso) return '';
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const s = Math.floor(diff / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

function formatETA(order){
  const mins = order.eta_minutes || order.estimated_minutes;
  if (mins) return `~${mins} min`;
  const status = String(order.status || '').toLowerCase();
  const fallback = { pending:25, accepted:20, preparing:12, on_the_way:4 };
  return fallback[status] ? `~${fallback[status]} min` : '';
}

function locLabel(mode, number){
  const m = mode === 'table' ? t('tableLabel') : t('roomLabel');
  return `${m} ${number}`;
}

   ============================================================ */
function saveLocal(){
  try {
    if (state.token) {
      localStorage.setItem('gh_guest_token', state.token);
      localStorage.setItem('gh_guest_loc', JSON.stringify({
        hotel: HOTEL_ID, mode: state.context.mode, number: state.context.number
      }));
    }
    localStorage.setItem('gh_guest_cart_' + HOTEL_ID, JSON.stringify(state.cart));
    localStorage.setItem('gh_guest_recent_' + HOTEL_ID, JSON.stringify(state.recentItems.slice(0, 8)));
    localStorage.setItem('gh_lang', state.lang);
    localStorage.setItem('gh_ratings_' + HOTEL_ID, JSON.stringify(state.ratings));
  } catch {}
}

function loadLocal(){
  try {
    state.token = localStorage.getItem('gh_guest_token') || null;
    const locStr = localStorage.getItem('gh_guest_loc');
    if (locStr && state.token) {
      try {
        const loc = JSON.parse(locStr);
        const sameHotel = loc.hotel === HOTEL_ID;
        const sameMode = loc.mode === (URL_MODE === 'table' ? 'table' : 'room');
        const sameLoc = !URL_ROOM || String(loc.number) === String(URL_ROOM);
        if (!(sameHotel && sameMode && sameLoc)) {
          localStorage.removeItem('gh_guest_token');
          localStorage.removeItem('gh_guest_loc');
          state.token = null;
        }
      } catch {
        localStorage.removeItem('gh_guest_token');
        state.token = null;
      }
    }
    const cart = localStorage.getItem('gh_guest_cart_' + HOTEL_ID);
    if (cart) state.cart = JSON.parse(cart) || [];
    const recent = localStorage.getItem('gh_guest_recent_' + HOTEL_ID);
    if (recent) state.recentItems = JSON.parse(recent) || [];
    const lang = localStorage.getItem('gh_lang');
    if (lang && I18N[lang]) state.lang = lang;
    const ratings = localStorage.getItem('gh_ratings_' + HOTEL_ID);
    if (ratings) state.ratings = JSON.parse(ratings) || {};
  } catch {}
}

function clearLocalSession(){
  try {
    localStorage.removeItem('gh_guest_token');
    localStorage.removeItem('gh_guest_loc');
    localStorage.removeItem('gh_guest_cart_' + HOTEL_ID);
  } catch {}
  Object.assign(state, {
    token:null, session:null, orders:[], bookings:[],
    activeOrder:null, activeBooking:null, cart:[]
  });
  if (state.sse) { try { state.sse.close(); } catch {} state.sse = null; }
}

   ============================================================ */
let sheetStack = [];
function openSheet(id){
  const el = $(id);
  if (!el) return;
  el.classList.add('show');
  if (!sheetStack.includes(id)) sheetStack.push(id);
  document.body.style.overflow = 'hidden';
}
function closeSheet(id){
  const el = $(id);
  if (!el) return;
  el.classList.remove('show');
  sheetStack = sheetStack.filter(x => x !== id);
  if (!sheetStack.length) document.body.style.overflow = '';
}
document.querySelectorAll('.sheet').forEach(s => {
  s.addEventListener('click', e => { if (e.target === s) closeSheet(s.id); });
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-close]');
  if (b) closeSheet(b.dataset.close);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetStack.length) closeSheet(sheetStack[sheetStack.length - 1]);
});

   ============================================================ */
async function tryAutoCheckIn(){
  if (state.token) {
    try {
      const me = await api('/api/guest/me');
      const s = me.session;
      if ((s.status || 'active') === 'active') {
        state.session = s;
        return { mode: 'existing' };
      }
      clearLocalSession();
    } catch { clearLocalSession(); }
  }
  try {
    const res = await api('/api/guest/checkin', {
      method: 'POST',
      body: JSON.stringify({
        hotel_id: HOTEL_ID,
        mode: state.context.mode,
        number: state.context.number,
        device_id: DEVICE_ID
      })
    });
    state.session = res.session;
    state.token = res.token;
    saveLocal();
    return { mode: res.created_new ? 'new' : 'joined', session: res.session };
  } catch (e) {
    if (e.status === 403 || e.status === 409) return { mode: 'blocked', error: e.message };
    throw e;
  }
}

/* ============================================================
   CONTENT RAILS — the heart of the marketplace
   ============================================================ */

/* Group vendors by their "group" field & auto-categorise */
function vendorGroup(v){ return v.group || 'services'; }

/* Which vendors belong in which rail */
const RAIL_MAP = {
  eat:       { emoji:'🍽️', titleKey:'eatTitle',       subKey:'eatSub',        groups:['food','restaurant','drinks'],   svcCats:['food','drink','kitchen'] },
  explore:   { emoji:'🦁', titleKey:'exploreTitle',   subKey:'exploreSub',    groups:['tours','transport'],            svcCats:['tour','transport'] },
  wellness:  { emoji:'🧘', titleKey:'wellnessTitle',  subKey:'wellnessSub',   groups:['wellness','spa'],                svcCats:['spa','wellness'] },
  ride:      { emoji:'🚗', titleKey:'rideTitle',      subKey:'rideSub',       groups:['transport','taxi'],              svcCats:['transport','taxi'] },
  local:     { emoji:'🛍️', titleKey:'localTitle',     subKey:'localSub',      groups:['local','crafts','shops'],        svcCats:['local'] },
  essentials:{ emoji:'🧴', titleKey:'essentialsTitle',subKey:'essentialsSub', groups:['essentials','convenience'],      svcCats:['essentials'] }
};

function itemsForRail(railKey){
  const rail = RAIL_MAP[railKey];
  if (!rail) return { items: [], vendors: [] };

  // Hotel menu items matching this rail
  const items = state.menu.filter(m => {
    const cat = String(m.category || '').toLowerCase();
    const dept = String(m.department || '').toLowerCase();
    if (rail.svcCats.includes(cat) || rail.svcCats.includes(dept)) return true;
    // Fallback: 'food' category → eat
    if (railKey === 'eat' && (cat.includes('food') || cat.includes('drink') || dept === 'kitchen')) return true;
    return false;
  });

  // Hotel services matching this rail
  const services = state.services.filter(s => {
    const cat = String(s.category || '').toLowerCase();
    const dept = String(s.department || '').toLowerCase();
    return rail.svcCats.includes(cat) || rail.svcCats.includes(dept) ||
           rail.groups.includes(cat) || rail.groups.includes(dept);
  });

  // Vendors matching this rail
  const vendors = state.vendors.filter(v => {
    const g = vendorGroup(v);
    return rail.groups.includes(g);
  });

  return { items, services, vendors };
}

function allMarketItems(){
  // Unified list of everything that can be ordered
  const menuItems = state.menu.map(m => ({
    kind: 'menu',
    id: String(m.id),
    name: m.name,
    price: m.price,
    desc: m.desc,
    image: m.image_url || m.image,
    icon: m.icon,
    category: m.category,
    dietary_tags: m.dietary_tags,
    tags: m.tags,
    available: m.available !== false,
    department: m.department,
    isHotel: true
  }));

  const services = state.services.map(s => ({
    kind: 'service',
    id: String(s.id),
    name: s.name,
    price: s.price || 0,
    desc: s.desc,
    image: s.image_url || s.image,
    icon: s.icon || '🛎️',
    category: s.category || 'service',
    available: true,
    department: s.department || 'front_desk',
    isHotel: true
  }));

  // Vendor items become orderable too — vendor "items" array
  const vendorItems = [];
  state.vendors.forEach(v => {
    (v.items || []).forEach(it => {
      vendorItems.push({
        kind: 'vendor',
        id: `v_${v.id}_${it.id}`,
        vendorId: v.id,
        vendorName: v.name,
        name: it.name,
        price: it.price,
        desc: it.desc || v.bio,
        image: it.image_url || it.image || v.logo_url,
        icon: it.icon || '🏪',
        category: vendorGroup(v),
        available: true,
        isHotel: false
      });
    });
  });

  return [...menuItems, ...services, ...vendorItems];
}

function renderRails(){
  const wrap = $('railsWrap');
  if (!wrap) return;

  const sections = [];
  for (const key of ['eat','explore','wellness','ride','local','essentials']) {
    const rail = RAIL_MAP[key];
    const { items, services, vendors } = itemsForRail(key);
    const total = items.length + services.length + vendors.length;
    if (total === 0) continue;

    sections.push({ key, rail, items, services, vendors });
  }

  if (!sections.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.cart}</div>
        <b>Marketplace coming soon</b>
        <p>Your hotel hasn't published items yet.</p>
      </div>`;
    return;
  }

  wrap.innerHTML = sections.map(({ key, rail, items, services, vendors }) => {
    // Build a mixed rail: first few menu items, then a couple of vendors
    const tiles = [];

    // Menu items first
    items.slice(0, 6).forEach(i => tiles.push(tileForMenuItem(i)));

    // Then services
    services.slice(0, 3).forEach(s => tiles.push(tileForService(s)));

    // Then vendors (as cards)
    vendors.slice(0, 4).forEach(v => tiles.push(tileForVendor(v)));

    return `
      <section class="section">
        <div class="section-head">
          <div>
            <div class="section-title">
              <span class="emoji">${rail.emoji}</span> ${esc(t(rail.titleKey))}
            </div>
            <div class="section-sub">${esc(t(rail.subKey))}</div>
          </div>
          <button class="section-link" data-goto="${key}">${t('seeAll')} →</button>
        </div>
        <div class="rail">${tiles.slice(0, 8).join('')}</div>
      </section>
    `;
  }).join('');

  wrap.querySelectorAll('[data-goto]').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.goto));
  });

  attachTileHandlers(wrap);
}

function renderPopularRail(){
  const popular = state.menu.filter(i => i.tags?.includes('popular')).slice(0, 8);
  const list = popular.length ? popular : state.menu.slice(0, 8);
  const rail = $('popularRail');

    ? list.map(tileForMenuItem).join('')
    : '<div style="padding:24px 18px;color:#6f6f6f;font-size:13px">Menu coming soon</div>';

/* ============================================================
   TILES
   ============================================================ */
function tileForMenuItem(item){
  const cartLine = state.cart.find(l => l.id === String(item.id));
  const qty = cartLine?.qty || 0;
  const unavailable = item.available === false;
  const img = item.image_url || item.image;
  const isPopular = item.tags?.includes('popular');

  return `
    <div class="tile ${unavailable ? 'unavailable' : ''}" data-tile-item="${esc(item.id)}" style="${unavailable ? 'opacity:.55;pointer-events:none' : ''}">
      ${isPopular ? '<span class="tile-badge popular">🔥 Popular</span>' : ''}
      <div class="tile-img">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : (item.icon || '🍽️')}
      </div>
      <div class="tile-body">
        <div class="tile-name">${esc(item.name)}</div>
        ${item.desc ? `<div class="tile-meta">${esc(item.desc).slice(0, 60)}</div>` : ''}
        <div class="tile-price-row">
          <span class="price">${money(item.price)}</span>
          <button class="add-btn ${qty > 0 ? 'has' : ''}" data-add-menu="${esc(item.id)}" aria-label="Add">
            ${qty > 0 ? ICON.check : ICON.plus}
          </button>
        </div>
      </div>
    </div>
  `;
}

function tileForService(s){
  return `
    <div class="tile" data-tile-svc="${esc(s.id)}">
      <span class="tile-badge hotel">🏨 Hotel</span>
      <div class="tile-img">
        ${s.image_url || s.image
          ? `<img src="${esc(s.image_url || s.image)}" alt="" loading="lazy">`
          : (s.icon || '🛎️')}
      </div>
      <div class="tile-body">
        <div class="tile-name">${esc(s.name)}</div>
        ${s.desc ? `<div class="tile-meta">${esc(s.desc).slice(0, 60)}</div>` : ''}
        <div class="tile-price-row">
          <span class="price">${s.price > 0 ? money(s.price) : '<small>Complimentary</small>'}</span>
          <button class="add-btn" data-request-svc="${esc(s.id)}" aria-label="Request">
            ${ICON.plus}
          </button>
        </div>
      </div>
    </div>
  `;
}

function tileForVendor(v){
  const logo = v.logo_url || v.image_url || v.image;
  const group = vendorGroup(v);
  const isLocal = group === 'local';
  return `
    <div class="tile" data-tile-vendor="${esc(v.id)}">
      <span class="tile-badge ${isLocal ? 'local' : ''}">${isLocal ? '🇰🇪 Local' : '🏪 Partner'}</span>
      <div class="tile-img">
        ${logo ? `<img src="${esc(logo)}" alt="" loading="lazy">` : '🏪'}
      </div>
      <div class="tile-body">
        <div class="tile-name">${esc(v.name)}</div>
        ${v.bio ? `<div class="tile-meta">${esc(v.bio).slice(0, 60)}</div>` : ''}
        <div class="tile-price-row">
          <span class="price" style="font-size:12px;color:#6f6f6f;font-weight:600">${(v.items || []).length} ${(v.items || []).length === 1 ? 'service' : 'services'}</span>
          <button class="add-btn" data-book-vendor="${esc(v.id)}" aria-label="Book">
            ${ICON.calendar}
          </button>
        </div>
      </div>
    </div>
  `;
}

function attachTileHandlers(root){
  // Add menu item
  root.querySelectorAll('[data-add-menu]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); addToCart(btn.dataset.addMenu); });
  });
  // Open item detail
  root.querySelectorAll('[data-tile-item]').forEach(tile => {
    tile.addEventListener('click', e => {
      if (e.target.closest('[data-add-menu]')) return;
      openItemDetail(tile.dataset.tileItem);
    });
  });
  // Request service
  root.querySelectorAll('[data-request-svc]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); requestService(btn.dataset.requestSvc); });
  });
  // Book vendor
  root.querySelectorAll('[data-book-vendor]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openBookingSheet(btn.dataset.bookVendor); });
  });
  // Open vendor detail
  root.querySelectorAll('[data-tile-vendor]').forEach(tile => {
    tile.addEventListener('click', e => {
      if (e.target.closest('[data-book-vendor]')) return;
      openVendorDetail(tile.dataset.tileVendor);
    });
  });
}

/* ============================================================
   CONCIERGE (natural-language stub)
   ============================================================ */
function wireConcierge(){
  const input = $('conciergeInput');
  if (!input) return;

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(120, input.scrollHeight) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleConciergeQuery(input.value.trim());
    }
  });

  $('conciergeSuggestions')?.querySelectorAll('[data-sugg]').forEach(b => {
    b.addEventListener('click', () => {
      input.value = b.dataset.sugg;
      handleConciergeQuery(b.dataset.sugg);
    });
  });
}

function handleConciergeQuery(q){
  if (!q) return;
  const query = q.toLowerCase();

  // Simple heuristic router
  if (/(dinner|lunch|breakfast|eat|food|hungry|menu|restaurant|meal)/.test(query)) {
    switchTab('eat');
    toast('🍽️ Showing food & drinks');
  } else if (/(safari|tour|excursion|adventure|experience)/.test(query)) {
    switchTab('explore');
    toast('🦁 Showing experiences');
  } else if (/(spa|massage|wellness|relax|facial)/.test(query)) {
    switchTab('wellness');
    toast('🧘 Showing wellness');
  } else if (/(taxi|airport|pickup|drive|car|transfer|ride)/.test(query)) {
    switchTab('ride');
    toast('🚗 Showing transport');
  } else if (/(gift|souvenir|craft|shop|buy)/.test(query)) {
    switchTab('local');
    toast('🛍️ Showing local finds');
  } else {
    // Generic search
    state.marketSearch = q;
    switchTab('market');
    toast('Searching: ' + q);
  }
  $('conciergeInput').value = '';
  $('conciergeInput').style.height = 'auto';
}

   ============================================================ */
function wireMarketSearch(){
  const input = $('marketSearch');
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const wrap = $('railsWrap');
    if (!q) { renderRails(); return; }
    renderSearchResults(q);
  });
}

function renderSearchResults(q){
  const all = allMarketItems().filter(i =>
    i.name.toLowerCase().includes(q) ||
    (i.desc || '').toLowerCase().includes(q) ||
    (i.category || '').toLowerCase().includes(q)
  );

  const wrap = $('railsWrap');
  if (!wrap) return;

  if (!all.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.search}</div>
        <b>No matches for "${esc(q)}"</b>
        <p>${t('tryDifferent')}</p>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <section class="section">
      <div class="section-head">
        <div>
          <div class="section-title"><span class="emoji">🔍</span> Results for "${esc(q)}"</div>
          <div class="section-sub">${all.length} ${all.length === 1 ? 'match' : 'matches'}</div>
        </div>
      </div>
      <div class="rail">${all.slice(0, 20).map(i => i.kind === 'menu' ? tileForMenuItem(i) : i.kind === 'service' ? tileForService(i) : '').filter(Boolean).join('')}</div>
    </section>
  `;
  attachTileHandlers(wrap);
}

/* ============================================================
   CART
   ============================================================ */
function addToCart(id){
  const item = state.menu.find(i => String(i.id) === String(id));
  if (!item) return;
  if (item.available === false) return toast(item.name + ' is sold out', 'error');

  const line = state.cart.find(l => l.id === String(id));
  if (line) line.qty += 1;
  else state.cart.push({
    id: String(item.id), name: item.name, price: Number(item.price) || 0,
    icon: item.icon || '🍽️', image: item.image_url || item.image || null,
    qty: 1, notes: '', department: item.department || 'kitchen'
  });
  trackRecentItem(id);
  saveLocal();
  renderCartBar();
  toast(item.name + ' added');
  if (state.tab === 'eat') renderEatPage();
  else if (state.tab === 'market') renderMarket();
}

function setCartLine(id, qty, notes){
  const item = state.menu.find(i => String(i.id) === String(id));
  if (!item) return;
  state.cart = state.cart.filter(l => l.id !== String(id));
  if (qty > 0) {
    state.cart.push({
      id: String(item.id), name: item.name, price: Number(item.price) || 0,
      icon: item.icon || '🍽️', image: item.image_url || item.image || null,
      qty, notes: notes || '', department: item.department || 'kitchen'
    });
    trackRecentItem(id);
  }
  saveLocal();
  renderCartBar();
  if (state.tab === 'eat') renderEatPage();
  else if (state.tab === 'market') renderMarket();
}

function updateQty(id, delta){
  const line = state.cart.find(l => l.id === String(id));
  if (!line) return;
  setCartLine(id, Math.max(0, line.qty + delta), line.notes);
  renderCartSheet();
}

function cartSubtotal(){ return state.cart.reduce((s, l) => s + l.qty * (Number(l.price) || 0), 0); }
function cartCount(){ return state.cart.reduce((s, l) => s + l.qty, 0); }

function renderCartBar(){
  const n = cartCount();
  const bar = $('cartBar');
  if (!bar) return;
  if (!n) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  $('cartCount').textContent = n + ' ' + (n === 1 ? 'item' : 'items');
  $('cartTotal').textContent = money(cartSubtotal());
}

function renderCartSheet(){
  const box = $('cartItems');
  if (!state.cart.length) {
    box.innerHTML = '<div class="empty"><b>' + t('cartEmpty') + '</b></div>';
    $('cartTotals').innerHTML = '';
    return;
  }
  box.innerHTML = state.cart.map(l => `
    <div class="cart-line">
      <div class="cart-line-icon">${l.image ? `<img src="${esc(l.image)}" loading="lazy">` : (l.icon || '🍽️')}</div>
      <div class="cart-line-body">
        <div class="cart-line-name">${esc(l.name)}</div>
        <div class="cart-line-price">${money(l.price)} each${l.notes ? ' · ' + esc(l.notes) : ''}</div>
      </div>
      <div class="qty">
        <button data-qty-dec="${esc(l.id)}">${ICON.minus}</button>
        <span>${l.qty}</span>
        <button data-qty-inc="${esc(l.id)}">${ICON.plus}</button>
      </div>
    </div>
  `).join('');
  box.querySelectorAll('[data-qty-inc]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.qtyInc, 1)));
  box.querySelectorAll('[data-qty-dec]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.qtyDec, -1)));

  const sub = cartSubtotal();
  $('cartTotals').innerHTML = `
    <div class="total-row"><span>${t('subtotal')}</span><span>${money(sub)}</span></div>
    <div class="total-row grand"><span>${t('total')}</span><span>${money(sub)}</span></div>
  `;

  $('cartSub').textContent = state.context.number
    ? `${locLabel(state.context.mode, state.context.number)} · ${state.hotel?.name || ''}`
    : state.hotel?.name || '';
}

async function placeOrder(){
  if (!state.cart.length) return;
  if (!state.session) return toast('Not signed in', 'error');

  const subtotal = cartSubtotal();
  const items = state.cart.map(l => ({
    id: l.id, name: l.name, price: l.price, qty: l.qty,
    notes: l.notes || '', department: l.department || 'kitchen'
  }));

  const deptCounts = {};
  state.cart.forEach(l => {
    const d = l.department || 'kitchen';
    deptCounts[d] = (deptCounts[d] || 0) + l.qty;
  });
  const primaryDept = Object.entries(deptCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'kitchen';

  const btn = $('placeOrderBtn');
  btn.disabled = true; btn.textContent = 'Placing…';

  try {
    const res = await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({
        hotel_id: HOTEL_ID,
        mode: state.context.mode,
        room_number: state.context.mode === 'room' ? state.context.number : null,
        table_number: state.context.mode === 'table' ? state.context.number : null,
        guest_name: state.session.guest_name,
        guest_phone: state.session.guest_phone,
        guest_session_id: state.session.id,
        service_title: items.map(i => i.qty + '× ' + i.name).join(', '),
        category: 'food', kind: 'food', department: primaryDept,
        amount: subtotal, total: subtotal, subtotal,
        details: items.filter(i => i.notes).map(i => i.name + ': ' + i.notes).join(' | '),
        items
      })
    });

    state.cart = [];
    saveLocal();
    renderCartBar();
    state.activeOrder = res.order;
    closeSheet('cartSheet');
    showSuccess(res.order);
    refreshOrders();
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = t('placeOrder');
  }
}

        <label>${t('date')}</label>
        <input type="date" class="input" id="bkDate" min="${dateStr(today)}" value="${dateStr(today)}">
      </div>
      <div class="field">
        <label>${t('guests')}</label>
        <input type="number" class="input" id="bkGuests" min="1" max="20" value="1">
      </div>
    </div>
    <div class="field">
      <label>${t('availableSlots')}</label>
      <div id="bkSlots"><div class="empty" style="padding:20px"><b>Pick a date</b></div></div>
    </div>
    <div class="field">
      <label>${t('notes')}</label>
      <textarea class="textarea" id="bkNotes" placeholder="${esc(t('notesPlaceholder'))}"></textarea>
    </div>
    <button class="btn btn-primary btn-full btn-lg" id="bkConfirm" disabled>${t('confirmBooking')}</button>
  `;

  $('bookingSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('bookingSheet'));

  let selectedSlot = null;

  async function loadSlots(){
    const date = $('bkDate').value;
    if (!date) return;
    $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>Loading…</b></div>';
    try {
      const res = await api(`/api/public/vendor/${encodeURIComponent(vendor.id)}/slots?date=${date}`);
      const slots = res.slots || [];
      if (!slots.length) {
        $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>No slots</b><p>Try another date.</p></div>';
        return;
      }
      $('bkSlots').innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px">${
        slots.map(s => `<button class="slot" data-slot="${esc(s.start)}" style="padding:10px;background:#fff;border:1.5px solid #d9d9d9;border-radius:8px;font-size:12.5px;font-weight:700;color:#595959">${new Date(s.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</button>`).join('')
      }</div>`;
      $('bkSlots').querySelectorAll('[data-slot]').forEach(btn => {
        btn.addEventListener('click', () => {
          $('bkSlots').querySelectorAll('[data-slot]').forEach(x => {
            x.style.background = '#fff';
            x.style.color = '#595959';
            x.style.borderColor = '#d9d9d9';
          });
          btn.style.background = '#0071c2';
          btn.style.color = '#fff';
          btn.style.borderColor = '#0071c2';
          selectedSlot = btn.dataset.slot;
          $('bkConfirm').disabled = false;
        });
      });
    } catch (e) {
      $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>Could not load</b></div>';
    }
  }

  $('bkDate').addEventListener('change', loadSlots);
  $('bkConfirm').addEventListener('click', async () => {
    if (!selectedSlot) return;
    const sel = $('bkService');
    const opt = sel.options[sel.selectedIndex];
    const serviceId = sel.value;
    const serviceName = opt.textContent.split(' — ')[0];
    const price = Number(opt.dataset.price) || 0;
    const guests = Number($('bkGuests').value) || 1;
    const notes = $('bkNotes').value.trim();

    $('bkConfirm').disabled = true;
    $('bkConfirm').textContent = 'Booking…';
    try {
      const res = await api('/api/bookings', {
        method: 'POST',
        body: JSON.stringify({
          hotel_id: HOTEL_ID,
          vendor_id: vendor.id,
          service_id: serviceId,
          service_title: serviceName,
          scheduled_for: selectedSlot,
          duration_min: 60,
          guests_count: guests,
          guest_name: state.session.guest_name,
          guest_phone: state.session.guest_phone,
          room_number: state.context.mode === 'room' ? state.context.number : null,
          table_number: state.context.mode === 'table' ? state.context.number : null,
          guest_session_id: state.session.id,
          amount: price, notes
        })
      });
      closeSheet('bookingSheet');
      showBookingSuccess(res.booking);
      refreshBookings();
    } catch (e) {
      toast('Booking failed: ' + e.message, 'error');
      $('bkConfirm').disabled = false;
      $('bkConfirm').textContent = t('confirmBooking');
    }
  });

  openSheet('bookingSheet');
  loadSlots();
}

function attachCopyHandlers(root){
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const old = btn.innerHTML;
        btn.innerHTML = ICON.check + ' ' + t('copied');
        setTimeout(() => btn.innerHTML = old, 1400);
      } catch { toast('Copy failed'); }
    });
  });
}

/* ============================================================
   ACTIVE CARD
   ============================================================ */
async function refreshOrders(){
  if (!state.token || !state.session) return;
  try {
    const r = await api('/api/guest/orders');
    state.orders = (r.orders || []).filter(o => String(o.guest_session_id) === String(state.session.id));
    pickActive();
    renderActiveCard();
    if (state.tab === 'trip') renderTripPage();
    maybePromptRating();
  } catch (e) { console.warn('refreshOrders:', e.message); }
}

async function refreshBookings(){
  if (!state.token || !state.session) return;
  try {
    const r = await api('/api/bookings/guest');
    state.bookings = (r.bookings || []).filter(b => String(b.guest_session_id) === String(state.session.id));
    pickActive();
    renderActiveCard();
    if (state.tab === 'trip') renderTripPage();
  } catch {}
}

function pickActive(){
  state.activeOrder = state.orders.find(o => !['completed','cancelled'].includes(String(o.status || '').toLowerCase())) || null;
  state.activeBooking = state.bookings.find(b => !['completed','cancelled','declined'].includes(String(b.status || '').toLowerCase())) || null;
  const count = (state.activeOrder ? 1 : 0) + (state.activeBooking ? 1 : 0);
  const dot = $('tripDot');
  if (dot) {
    dot.textContent = count;
    dot.classList.toggle('hidden', count === 0);
  }
}

function renderActiveCard(){
  const card = $('activeCard');
  if (!card) return;
  const o = state.activeOrder;
  const b = state.activeBooking;
  const active = o || b;

  if (!active) { card.classList.remove('show'); return; }
  card.className = 'active-card show status-' + String(active.status || '').toLowerCase();

  if (o) {
    const steps = ['pending','accepted','preparing','on_the_way','completed'];
    const idx = steps.indexOf(String(o.status || '').toLowerCase());
    const progress = steps.map((_, i) => {
      const cls = i < idx ? 'done' : i === idx ? 'on' : '';
      return `<div class="seg ${cls}"></div>`;
    }).join('');
    const eta = formatETA(o);
    card.innerHTML = `
      <div class="active-head">
        <div>
          <div class="active-title">${esc(o.service_title || t('yourOrder'))}</div>
          <div class="active-ref">${esc(o.reference)}</div>
        </div>
        ${statusBadge(o.status)}
      </div>
      ${eta ? `<div class="eta-pill">${ICON.clock}<span>${t('arrivingIn')} <b>${eta}</b></span></div>` : ''}
      <div class="progress">${progress}</div>
    `;
  } else {
    card.innerHTML = `
      <div class="active-head">
        <div>
          <div class="active-title">${esc(b.service_title || 'Booking')}</div>
          <div class="active-ref">${esc(b.reference)}</div>
        </div>
        ${statusBadge(b.status)}
      </div>
      <div style="display:flex;gap:12px;font-size:12.5px;color:#595959;margin-top:8px">
        <span style="display:flex;align-items:center;gap:5px">${ICON.calendar}<span>${new Date(b.scheduled_for).toLocaleString()}</span></span>
      </div>
    `;
  }
}

/* ============================================================
   RATING
   ============================================================ */
function maybePromptRating(){
  const completed = state.orders.filter(o =>
    String(o.status || '').toLowerCase() === 'completed' && !state.ratings[o.id]
  );
  if (!completed.length) return;
  if (document.querySelector('.sheet.show')) return;
  showRatingPrompt(completed[0]);
}

function showRatingPrompt(order){
  let selectedStars = 0, selectedTip = 0;
  const subtotal = Number(order.amount) || 0;
  const tips = [{ pct:0, label:t('noTip') }, { pct:5, label:'5%' }, { pct:10, label:'10%' }];

  $('ratingSheetBody').innerHTML = `
    <div class="sheet-head">
      <div>
        <div class="sheet-title">${t('rateYourOrder')}</div>
        <div class="sheet-sub">${esc(order.service_title || '')} · ${esc(order.reference)}</div>
      </div>
      <button class="sheet-close" data-close="ratingSheet" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div style="text-align:center;font-weight:700;color:#595959;font-size:14px;margin-bottom:10px">${t('howWasIt')}</div>
    <div style="display:flex;justify-content:center;gap:8px;margin:20px 0">
      ${[1,2,3,4,5].map(n => `<button data-star="${n}" style="width:48px;height:48px;display:grid;place-items:center;color:#c5c5c5;transition:all .15s">${ICON.starOutline}</button>`).join('')}
    </div>
    <div class="field">
      <label>${t('tip')}</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${tips.map(o => `<button data-tip="${o.pct}" style="padding:12px 8px;background:${o.pct===0?'#0071c2':'#fff'};color:${o.pct===0?'#fff':'#1a1a1a'};border:1.5px solid ${o.pct===0?'#0071c2':'#d9d9d9'};border-radius:12px;font-size:13px;font-weight:800;text-align:center">${o.label}${o.pct>0?`<small style="display:block;font-size:10.5px;font-weight:500;opacity:.7;margin-top:2px">${money(Math.round(subtotal*o.pct/100))}</small>`:''}</button>`).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn btn-secondary btn-lg" id="ratingSkip" style="flex:1">${t('skip')}</button>
      <button class="btn btn-primary btn-lg" id="ratingSubmit" style="flex:2">${t('submit')}</button>
    </div>
  `;

  const stars = $('ratingSheetBody').querySelectorAll('[data-star]');
  stars.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedStars = Number(btn.dataset.star);
      stars.forEach(s => {
        const on = Number(s.dataset.star) <= selectedStars;
        s.style.color = on ? '#febb02' : '#c5c5c5';
        s.style.transform = on ? 'scale(1.08)' : 'scale(1)';
        s.innerHTML = on ? ICON.star : ICON.starOutline;
      });
    });
  });

  $('ratingSheetBody').querySelectorAll('[data-tip]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedTip = Number(btn.dataset.tip);
      $('ratingSheetBody').querySelectorAll('[data-tip]').forEach(b => {
        const isOn = b === btn;
        const pct = Number(b.dataset.tip);
        b.style.background = isOn ? '#0071c2' : '#fff';
        b.style.color = isOn ? '#fff' : '#1a1a1a';
        b.style.borderColor = isOn ? '#0071c2' : '#d9d9d9';
      });
    });
  });

  $('ratingSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('ratingSheet'));
  $('ratingSheetBody').querySelector('#ratingSkip').addEventListener('click', () => {
    state.ratings[order.id] = { skipped: true, at: Date.now() };
    saveLocal();
    closeSheet('ratingSheet');
  });
  $('ratingSheetBody').querySelector('#ratingSubmit').addEventListener('click', async () => {
    if (!selectedStars) return toast('Pick a rating first', 'error');
    const tipAmount = selectedTip > 0 ? Math.round(subtotal * selectedTip / 100) : 0;
    state.ratings[order.id] = { stars: selectedStars, tip: tipAmount, at: Date.now() };
    saveLocal();
    closeSheet('ratingSheet');
    try {
      await api(`/api/orders/${encodeURIComponent(order.id)}/rate`, {
        method: 'POST',
        body: JSON.stringify({ stars: selectedStars, tip: tipAmount })
      });
      toast('Thank you!');
    } catch {
      toast('Rating saved');
    }
  });

  openSheet('ratingSheet');
}

/* ============================================================
   RECENT ITEMS
   ============================================================ */
function trackRecentItem(itemId){
  state.recentItems = [String(itemId), ...state.recentItems.filter(id => id !== String(itemId))].slice(0, 8);
  saveLocal();
}

/* ============================================================
   PROFILE
   ============================================================ */
function openProfileSheet(){

  const loc = locLabel(s.mode, s.room_number || s.table_number);

    <div class="sheet-head">
      <div>
        <div class="sheet-title">${t('yourProfile')}</div>
        <div class="sheet-sub">Update anytime</div>
      </div>
      <button class="sheet-close" data-close="profileSheet" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="field">
      <label>${t('name')}</label>
      <input class="input" id="pName" value="${esc(s.guest_name || '')}">
    </div>
    <div class="field">
      <label>${t('phone')}</label>
      <input class="input" id="pPhone" value="${esc(s.guest_phone || '')}" inputmode="tel">
    </div>
    <div class="field">
      <label>${t('currentLocation')}</label>
      <input class="input" value="${esc(loc)} · ${esc(state.hotel?.name || '')}" readonly>
    </div>
    <button class="btn btn-primary btn-full" id="pSave">${t('saveChanges')}</button>
    <button class="btn btn-secondary btn-full" id="pCheckout" style="margin-top:8px;color:#d32f2f;border-color:#f4c5c5">
      ${ICON.logout} ${t('endStay')}
    </button>
  `;

  $('profileSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('profileSheet'));
  $('profileSheetBody').querySelector('#pSave').addEventListener('click', async () => {
    const name = $('pName').value.trim();
    const phone = $('pPhone').value.trim();
    if (!name) return toast('Name required', 'error');
    if (!phone) return toast('Phone required', 'error');
    try {
      const r = await api('/api/guest/update-session', {
        method: 'POST',
        body: JSON.stringify({ guest_name: name, guest_phone: phone })
      });
      state.session = r.session;
      saveLocal();
      closeSheet('profileSheet');
      toast(t('saved'));
      renderApp();
    } catch (e) { toast(e.message, 'error'); }
  });
  $('profileSheetBody').querySelector('#pCheckout').addEventListener('click', async () => {
    if (!confirm(t('endStayConfirm'))) return;
    try { await api('/api/guest/checkout', { method: 'POST' }); } catch {}

    closeSheet('profileSheet');
    toast(t('checkedOut'));
    setTimeout(() => location.reload(), 800);
  });

  openSheet('profileSheet');
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(name){
  state.tab = name;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === name));

  switch (name) {
    case 'market':   renderMarket(); break;
    case 'eat':      renderEatPage(); break;
    case 'explore':  renderExplorePage(); break;
    case 'services': renderServicesPage(); break;
    case 'trip':     refreshOrders(); refreshBookings(); renderTripPage(); break;
    default:         renderMarket();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   MAIN APP RENDER
   ============================================================ */
function renderApp(){
  $('bottomNav').classList.remove('hidden');
  $('profileBtn').classList.remove('hidden');

  // Header buttons
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.removeEventListener('click', b._handler);
    b._handler = () => switchTab(b.dataset.tab);
    b.addEventListener('click', b._handler);
  });
  $('langBtn').onclick = () => openSheet('langSheet');
  $('profileBtn').onclick = openProfileSheet;
  $('viewCartBtn').onclick = () => { if (state.cart.length) { renderCartSheet(); openSheet('cartSheet'); } };
  $('placeOrderBtn').onclick = placeOrder;

  // Language picker
  document.querySelectorAll('[data-lang]').forEach(b => {
    b.onclick = () => {
      const lang = b.dataset.lang;
      if (!I18N[lang]) return toast('Language not available', 'error');
      state.lang = lang;
      saveLocal();
      closeSheet('langSheet');
      renderApp();
      toast('Language updated');
    };
  });

  renderCartBar();
  renderMarket();
}

/* ============================================================
   SSE
   ============================================================ */
function startSSE(){
  if (state.sse) try { state.sse.close(); } catch {}
  if (!state.token || !state.session) return;

  const es = new EventSource(`/api/stream/guest/${encodeURIComponent(state.token)}`);
  state.sse = es;

  es.addEventListener('orders', e => {
    try {
      const incoming = JSON.parse(e.data) || [];
      state.orders = incoming.filter(o => String(o.guest_session_id) === String(state.session.id));
      pickActive();
      renderActiveCard();
      if (state.tab === 'trip') renderTripPage();
      maybePromptRating();
    } catch {}
  });

  es.addEventListener('bookings', e => {
    try {
      const incoming = JSON.parse(e.data) || [];
      state.bookings = incoming.filter(b => String(b.guest_session_id) === String(state.session.id));
      pickActive();
      renderActiveCard();
      if (state.tab === 'trip') renderTripPage();
    } catch {}
  });

  es.addEventListener('kitchen', e => {
    try {
      const data = JSON.parse(e.data) || {};
      state.kitchenBusy = !!data.busy;
      if (data.message) state.hotel = { ...state.hotel, busy_message: data.message };
      if (state.tab === 'market') renderMarket();
    } catch {}
  });

  es.addEventListener('hello', () => { state.sseRetry = 0; });
  es.addEventListener('error', () => {
    try { es.close(); } catch {}
    state.sse = null;
    const delay = Math.min(30000, 2000 * Math.pow(2, state.sseRetry++));
    setTimeout(startSSE, delay);
  });
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function bootstrap(){
  loadLocal();
  updateOffline();

  if (!HOTEL_ID) return showFatal("No hotel specified. Please scan the QR code from your room.");

  state.context.mode = URL_MODE === 'table' ? 'table' : 'room';
  state.context.number = URL_ROOM;

  $('main').innerHTML = `
    <div class="welcome-hero">
      <div class="badge-icon"><div class="spinner" style="width:28px;height:28px;border-width:3px"></div></div>
      <h1>Loading…</h1>
      <p>Just a moment.</p>
    </div>`;

  try {
    const res = await api(`/api/public/hotel/${encodeURIComponent(HOTEL_ID)}/bootstrap`);
    state.hotel = res.hotel;
    state.menu = res.menu || [];
    state.services = res.services || [];
    state.vendors = res.vendors || [];
    state.departments = res.departments || [];
    state.kitchenBusy = !!(state.hotel.kitchen_busy || state.hotel.is_busy);
    document.title = state.hotel.name + ' · GuestHub';
  } catch (e) {
    return showFatal("Could not load hotel: " + e.message);
  }

  renderContext();
  if (!state.context.number) return showNoRoom();

  let result;
  try { result = await tryAutoCheckIn(); }
  catch (e) { return showFatal("Check-in failed: " + e.message); }

  if (result.mode === 'blocked') return showCheckInRequired(result.error || t('hotelLocked'));

  renderApp();
  startSSE();
  refreshOrders();
  refreshBookings();

  if (result.mode === 'new') {
    showWelcomeSheet(state.session);
  } else if (result.mode === 'joined') {
    toast(`Welcome, ${state.session.guest_name || 'guest'}!`);
  }
}

bootstrap();
