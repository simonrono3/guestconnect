<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUESTSHUB | Safari OS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF6B35;--green:#0F9D58;--gold:#FFD700;--black:#1A1A1A}
*{box-sizing:border-box}body{font-family:'Inter';background:linear-gradient(180deg,#1A1A1A 0%,#2D2418 100%);color:#fff;margin:0}
.hero{background:url('https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?q=80&w=2070') center/cover;padding:70px 20px;text-align:center;position:relative}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,#1A1A1A 100%)}
.hero *{position:relative;z-index:2}
.logo{font-family:'Playfair Display';font-size:40px;color:var(--gold);letter-spacing:3px}
.tagline{font-size:18px;margin-top:10px;opacity:0.9}
.container{max-width:800px;margin:-30px auto;padding:20px}
.glass{background:rgba(45,36,24,0.7);backdrop-filter:blur(16px);border:1px solid rgba(255,107,53,0.3);border-radius:24px;padding:20px}
.tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px}
.tab{padding:14px 24px;background:rgba(45,36,24,0.5);border:1px solid rgba(255,107,53,0.3);border-radius:50px;font-weight:800;cursor:pointer;white-space:nowrap;transition:0.3s}
.tab.active{background:linear-gradient(135deg,var(--orange),var(--green));border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:rgba(45,36,24,0.8);border:1px solid #333;border-radius:20px;overflow:hidden;transition:0.3s}
.card:hover{transform:translateY(-4px);border-color:var(--orange)}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:16px}
.price{color:var(--gold);font-family:'Playfair Display';font-size:22px;font-weight:800}
.btn{width:100%;background:linear-gradient(135deg,var(--orange),var(--green));color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.badge{font-size:11px;padding:4px 10px;border-radius:8px;font-weight:800}
.badge-free{background:var(--green)} .badge-vendor{background:var(--orange);color:#000}
</style>
</head><body>
<div class="hero">
  <div class="logo">GUESTSHUB™</div>
  <div class="tagline">YOUR ROOM. <span style="color:var(--orange)">EVERYTHING.</span></div>
</div>
<div class="container">
  <div class="glass" style="margin-bottom:20px">
    <h3 style="font-family:'Playfair Display'">🦁 Karibu Room <span id="room"></span></h3>
    <p style="opacity:0.8">Welcome to <span id="hotel" style="color:var(--gold)"></span></p>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('food',this)">🍽️ Room Service <span class="badge badge-free">0% FEE</span></div>
    <div class="tab" onclick="showTab('service',this)">🛎️ Hotel Services <span class="badge badge-free">0% FEE</span></div>
    <div class="tab" onclick="showTab('tour',this)">🦁 Tours & Safari <span class="badge badge-vendor">MARKET</span></div>
  </div>
  <div id="items" class="grid"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const hotelId = params.get('hotelId')||'prideinn'; const room = params.get('room')||'101';
document.getElementById('room').innerText=room;

fetch('/api/data').then(r=>r.json()).then(data=>{
  document.getElementById('hotel').innerText=data.hotels.find(h=>h.id===hotelId)?.name||hotelId;
  window.allItems = data.items.filter(i=>i.hotel_id===hotelId);
  showTab('food', document.querySelector('.tab'));
});

function showTab(type,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const filtered = window.allItems.filter(i=>i.type===type);
  document.getElementById('items').innerHTML = filtered.map(i=>`
    <div class="card">
      <img src="${i.image_url||'https://images.unsplash.com/photo-1516426122078-c23e76319801?q=80&w=800'}">
      <div class="card-body">
        <b style="font-size:16px">${i.name}</b>
        <p style="opacity:0.7;font-size:13px">${i.description}</p>
        <div class="price">KES ${Number(i.price).toLocaleString()}</div>
        <button class="btn" onclick="order('${i.id}','${i.name}',${i.price},'${i.type}')">Order Now →</button>
      </div>
    </div>
  `).join('');
}

function order(id,name,price,type){
  const guest = prompt('Enter your name:');
  if(!guest) return;
  const endpoint = (type==='food'||type==='service')?'/api/guest/order':'/api/guest/book-vendor';
  const body = (type==='food'||type==='service')?
    {hotel_id:hotelId,room,guest,item_id:id}:
    {hotel_id:hotelId,vendor_id:'vendor',service:name,price,room,guest};
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(()=>alert(type==='tour'?'✅ Safari Booked!':'✅ Order sent to team'));
}
</script></body></html>
