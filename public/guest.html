<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>GuestHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">

<style>
:root{
  --brand:#0b2545; --brand-2:#1a4a7a; --brand-3:#133a61;
  --brand-soft:#eef4fb; --brand-line:#d3e2f2;
  --gold:#b8935a; --gold-soft:#faf6ef; --gold-line:#eadfc9; --gold-ink:#6b5220;
  --green:#2e7d32; --green-soft:#eaf4ea; --green-line:#c8dfc9;
  --red:#b3261e; --red-soft:#fbeeec; --red-line:#efcbc7;
  --purple:#5b3d8f; --purple-soft:#f1ebf8;
  --bg:#fff; --bg-subtle:#f6f7f9; --bg-muted:#fafbfc;
  --surface:#fff;
  --border:#e5e7eb; --border-2:#d4d7dd; --border-3:#b8bcc5;
  --text:#1c1c1e; --text-2:#4a4d55; --text-3:#6d7079;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --shadow-xs:0 1px 2px rgb(15 23 42/4%);
  --shadow-sm:0 1px 3px rgb(15 23 42/6%),0 1px 2px rgb(15 23 42/4%);
  --shadow-md:0 4px 14px rgb(15 23 42/7%),0 2px 4px rgb(15 23 42/4%);
  --shadow-lg:0 12px 32px rgb(15 23 42/9%),0 4px 8px rgb(15 23 42/4%);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font);
  font-size:14.5px; line-height:1.5; color:var(--text);
  background:var(--bg-subtle);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:calc(88px + var(--safe-b));
  overscroll-behavior-y:contain;
}
img,svg{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,select,textarea{ font:inherit; color:inherit; }
::selection{ background:var(--gold); color:#fff; }
:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; border-radius:6px; }
.icon{ display:inline-block; vertical-align:middle; flex-shrink:0; color:currentColor; }
.hidden{ display:none !important; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:100;
  background:var(--brand); color:#fff;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.app-header-inner{
  max-width:760px; margin:auto;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:12px 18px; min-height:60px;
}
.brand{ display:flex; align-items:center; gap:11px; min-width:0; }
.brand-logo{
  display:grid; place-items:center;
  width:36px; height:36px; border-radius:9px;
  background:#fff; color:var(--brand);
  font-weight:800; font-size:15px;
  flex-shrink:0;
}
.brand-text{ min-width:0; }
.brand-title{
  font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-sub{
  font-size:11.5px; color:rgba(255,255,255,.72);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-top:1px;
}
.header-actions{ display:flex; gap:6px; align-items:center; flex-shrink:0; }
.icon-btn{
  width:36px; height:36px; border-radius:9px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  color:#fff; display:grid; place-items:center;
  transition:background .15s;
}
.icon-btn:hover{ background:rgba(255,255,255,.16); }
.icon-btn .icon{ width:17px; height:17px; }

/* ============ CONTAINER ============ */
.container{ max-width:760px; margin:0 auto; padding:0 0 40px; }

/* ============ GREETING ============ */
.greeting{
  padding:22px 18px 6px;
}
.greeting-eyebrow{
  font-size:11.5px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-3);
  display:flex; align-items:center; gap:8px;
}
.greeting-eyebrow .mark{
  width:5px; height:5px; border-radius:50%;
  background:var(--gold);
}
.greeting-title{
  font-family:var(--display);
  font-size:26px; font-weight:600; letter-spacing:-.015em;
  color:var(--text); margin-top:6px; line-height:1.2;
}
.greeting-sub{
  font-size:13.5px; color:var(--text-2); margin-top:6px;
  line-height:1.55;
}

/* ============ QUICK INPUT ============ */
.quick-input{
  margin:16px 18px 0;
  background:#fff;
  border:1px solid var(--border-2);
  border-radius:var(--r-lg);
  padding:14px 16px;
  box-shadow:var(--shadow-xs);
  transition:border-color .15s, box-shadow .15s;
}
.quick-input:focus-within{
  border-color:var(--brand-2);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.quick-input-label{
  font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--text-3);
  display:flex; align-items:center; gap:6px;
  margin-bottom:6px;
}
.quick-input-label .icon{ width:12px; height:12px; color:var(--gold); }
.quick-input-field{
  width:100%; border:0; background:transparent;
  font-size:15px; font-weight:500; outline:none;
  padding:2px 0; resize:none; line-height:1.5;
  min-height:40px;
  font-family:inherit;
  color:var(--text);
}
.quick-input-field::placeholder{ color:var(--text-3); }
.quick-input-hints{
  display:flex; gap:6px; overflow-x:auto;
  margin-top:10px; padding-bottom:2px;
  scrollbar-width:none;
}
.quick-input-hints::-webkit-scrollbar{ display:none; }
.hint{
  flex:0 0 auto;
  padding:6px 12px; border-radius:999px;
  background:var(--bg-subtle); border:1px solid var(--border);
  font-size:12px; font-weight:500; color:var(--text-2);
  white-space:nowrap;
  transition:all .15s;
}
.hint:hover{ background:var(--brand-soft); border-color:var(--brand-line); color:var(--brand-2); }

/* ============ MOMENT STRIP ============ */
.moment{
  display:flex; align-items:center; gap:14px;
  margin:16px 18px 0;
  padding:14px 18px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-xs);
}
.moment-mark{
  width:40px; height:40px; border-radius:10px;
  background:var(--gold-soft); border:1px solid var(--gold-line);
  color:var(--gold-ink);
  display:grid; place-items:center;
  flex-shrink:0;
}
.moment-mark .icon{ width:20px; height:20px; }
.moment-text{ flex:1; min-width:0; }
.moment-label{
  font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--text-3);
}
.moment-title{
  font-size:14px; font-weight:600; margin-top:2px;
  color:var(--text); line-height:1.3;
}

/* ============ BUSY BANNER ============ */
.busy-banner{
  display:none;
  margin:16px 18px 0;
  padding:12px 16px;
  background:var(--gold-soft);
  border:1px solid var(--gold-line);
  border-radius:var(--r);
  color:var(--gold-ink);
  font-size:12.5px; font-weight:500;
  align-items:center; gap:10px;
  line-height:1.5;
}
.busy-banner.show{ display:flex; }
.busy-banner .icon{ width:16px; height:16px; flex-shrink:0; }

/* ============ ACTIVE CARD ============ */
.active-card{
  display:none;
  margin:16px 18px 0;
  background:#fff;
  border:1px solid var(--border);
  border-left:3px solid var(--brand-2);
  border-radius:var(--r-lg);
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
}
.active-card.show{ display:block; }
.active-card.status-preparing{ border-left-color:var(--gold); }
.active-card.status-on_the_way{ border-left-color:var(--purple); }
.active-card.status-completed{ border-left-color:var(--green); }
.active-card.status-cancelled{ border-left-color:var(--red); }
.active-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; margin-bottom:10px;
}
.active-title{
  font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  line-height:1.35;
}
.active-ref{
  display:inline-block;
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  color:var(--text-3); margin-top:3px;
  letter-spacing:.3px;
}
.eta-row{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; margin:8px 0;
  background:var(--brand-soft);
  border:1px solid var(--brand-line);
  border-radius:var(--r-sm);
  font-size:12.5px; color:var(--brand-2); font-weight:500;
}
.eta-row .icon{ width:14px; height:14px; }
.eta-row b{ color:var(--brand); font-weight:700; }
.progress{ display:flex; gap:4px; margin-top:10px; }
.progress .seg{
  flex:1; height:4px; border-radius:999px;
  background:var(--border);
  transition:background .3s;
}
.progress .seg.on{ background:var(--brand-2); }
.progress .seg.done{ background:var(--green); }

/* ============ SECTIONS ============ */
.section{ margin-top:28px; }
.section-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; padding:0 18px; margin-bottom:14px;
}
.section-title{
  font-family:var(--display);
  font-size:19px; font-weight:600; letter-spacing:-.01em;
  color:var(--text); line-height:1.2;
}
.section-sub{
  font-size:12px; color:var(--text-3); margin-top:3px;
  line-height:1.5;
}
.section-link{
  font-size:12.5px; font-weight:600; color:var(--brand-2);
  display:inline-flex; align-items:center; gap:4px;
  padding:6px 10px; border-radius:999px;
  transition:background .15s;
  white-space:nowrap;
}
.section-link:hover{ background:var(--brand-soft); }

/* Rails */
.rail{
  display:flex; gap:12px;
  overflow-x:auto;
  padding:4px 18px 8px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{ display:none; }
.rail > *{ scroll-snap-align:start; }

/* ============ TILES ============ */
.tile{
  flex:0 0 210px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  overflow:hidden;
  box-shadow:var(--shadow-xs);
  transition:all .18s ease;
  cursor:pointer;
  position:relative;
}
.tile:hover{
  border-color:var(--border-2);
  box-shadow:var(--shadow-md);
  transform:translateY(-1px);
}
.tile-img{
  height:118px; background:var(--bg-subtle);
  position:relative; overflow:hidden;
  display:grid; place-items:center;
  color:var(--text-3);
}
.tile-img img{ width:100%; height:100%; object-fit:cover; }
.tile-img .icon{ width:32px; height:32px; opacity:.4; }
.tile-body{ padding:12px 14px 14px; }
.tile-name{
  font-size:13.5px; font-weight:600; letter-spacing:-.005em;
  line-height:1.35;
  overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  min-height:36px;
}
.tile-meta{
  font-size:11.5px; color:var(--text-3); margin-top:5px;
  line-height:1.5;
  overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.tile-price-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-top:11px;
}
.price{
  font-size:14.5px; font-weight:700; color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.price small{ font-size:10.5px; color:var(--text-3); font-weight:500; margin-left:3px; }
.add-btn{
  width:32px; height:32px; border-radius:8px;
  background:var(--brand); color:#fff;
  display:grid; place-items:center;
  transition:background .15s;
  flex-shrink:0;
}
.add-btn:hover{ background:var(--brand-2); }
.add-btn:active{ transform:scale(.94); }
.add-btn.has{ background:var(--green); }
.add-btn .icon{ width:15px; height:15px; }

/* Tile badge */
.tile-badge{
  position:absolute; top:10px; left:10px;
  background:rgba(255,255,255,.95);
  border:1px solid var(--border);
  color:var(--text-2);
  font-size:10px; font-weight:700;
  padding:3px 8px; border-radius:6px;
  letter-spacing:.03em; text-transform:uppercase;
  backdrop-filter:blur(4px);
  display:flex; align-items:center; gap:4px;
}
.tile-badge .icon{ width:9px; height:9px; }
.tile-badge.hotel{ background:var(--brand); color:#fff; border-color:var(--brand); }
.tile-badge.partner{ background:#fff; color:var(--text-2); }
.tile-badge.local{ background:var(--gold); color:#fff; border-color:var(--gold); }
.tile-badge.popular{ background:var(--gold-soft); color:var(--gold-ink); border-color:var(--gold-line); }

/* ============ VENDOR CARDS ============ */
.vendor-grid{
  display:grid; grid-template-columns:1fr; gap:12px;
  padding:0 18px;
}
@media(min-width:560px){ .vendor-grid{ grid-template-columns:1fr 1fr; } }

.vendor-card{
  background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); overflow:hidden;
  box-shadow:var(--shadow-xs);
  transition:all .18s;
  cursor:pointer;
}
.vendor-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
.vendor-cover{
  height:104px; background:var(--bg-subtle);
  position:relative; overflow:hidden;
}
.vendor-cover img{ width:100%; height:100%; object-fit:cover; }
.vendor-logo{
  position:absolute; bottom:-20px; left:14px;
  width:44px; height:44px; border-radius:11px;
  background:#fff; border:2.5px solid #fff;
  box-shadow:var(--shadow-sm);
  display:grid; place-items:center;
  font-size:18px; font-weight:800; color:var(--brand);
  overflow:hidden;
}
.vendor-logo img{ width:100%; height:100%; object-fit:cover; }
.vendor-body{ padding:28px 14px 14px; }
.vendor-name{
  font-size:14.5px; font-weight:600; letter-spacing:-.005em;
  line-height:1.3;
}
.vendor-meta{
  font-size:11.5px; color:var(--text-3); margin-top:4px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  line-height:1.4;
}
.vendor-hours{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:5px;
}
.vendor-hours.open{ background:var(--green-soft); color:var(--green); }
.vendor-hours.closed{ background:var(--red-soft); color:var(--red); }
.vendor-hours .mark{
  width:5px; height:5px; border-radius:50%;
  background:currentColor;
}
.vendor-desc{
  font-size:12.5px; color:var(--text-2); margin-top:8px;
  line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.vendor-actions{ display:flex; gap:8px; margin-top:12px; }
.vendor-actions .btn{ flex:1; }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px; height:38px; padding:0 15px;
  font-size:13px; font-weight:600; letter-spacing:-.005em;
  border-radius:var(--r-sm); border:1px solid transparent;
  white-space:nowrap;
  transition:all .15s ease;
}
.btn:active:not(:disabled){ transform:scale(.98); }
.btn:disabled{ opacity:.55; cursor:wait; }
.btn-primary{ background:var(--brand); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--brand-2); }
.btn-secondary{ background:#fff; color:var(--text); border-color:var(--border-2); }
.btn-secondary:hover:not(:disabled){ background:var(--bg-subtle); border-color:var(--border-3); }
.btn-full{ width:100%; }
.btn-lg{ height:48px; padding:0 22px; font-size:14.5px; border-radius:var(--r); }
.btn-sm{ height:30px; padding:0 10px; font-size:12px; border-radius:6px; }
.btn .icon{ width:14px; height:14px; }
.btn-danger-text{ color:var(--red); }

/* ============ PILLS ============ */
.pills{
  display:flex; gap:6px; overflow-x:auto;
  padding:4px 18px 14px;
  scrollbar-width:none;
}
.pills::-webkit-scrollbar{ display:none; }
.pill{
  flex:0 0 auto;
  padding:7px 14px; border-radius:999px;
  background:#fff; border:1px solid var(--border-2);
  font-size:12.5px; font-weight:500; color:var(--text-2);
  white-space:nowrap; transition:all .15s;
}
.pill:hover:not(.on){ border-color:var(--border-3); color:var(--text); }
.pill.on{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }

/* ============ SEARCH ============ */
.search-wrap{
  margin:0 18px 14px;
  position:relative;
}
.search-wrap input{
  width:100%; height:42px;
  padding:0 42px 0 40px;
  background:#fff; border:1px solid var(--border-2);
  border-radius:var(--r);
  font-size:13.5px; outline:none;
  transition:all .15s;
}
.search-wrap input:focus{
  border-color:var(--brand-2);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.search-wrap .search-icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-3);
  pointer-events:none;
}

/* ============ CART BAR ============ */
.cart-bar{
  position:fixed; left:12px; right:12px;
  bottom:calc(76px + var(--safe-b));
  background:var(--brand);
  color:#fff; border-radius:var(--r-lg);
  padding:13px 18px;
  display:none; align-items:center; justify-content:space-between;
  gap:12px;
  box-shadow:0 16px 40px rgba(11,37,69,.35);
  z-index:95;
  animation:slideUp .28s cubic-bezier(.3,1.2,.5,1);
}
.cart-bar.show{ display:flex; }
@keyframes slideUp{
  from{ opacity:0; transform:translateY(12px); }
  to{ opacity:1; transform:translateY(0); }
}
.cart-bar .info b{ display:block; font-size:14px; font-weight:600; letter-spacing:-.005em; }
.cart-bar .info small{ font-size:11.5px; color:rgba(255,255,255,.72); }
.cart-bar button{
  background:#fff; color:var(--brand);
  border:none; padding:10px 18px;
  border-radius:999px;
  font-weight:700; font-size:12.5px;
  display:inline-flex; align-items:center; gap:6px;
}
.cart-bar button:hover{ background:var(--gold-soft); }
.cart-bar button .icon{ width:13px; height:13px; }

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex; justify-content:space-around;
  padding:8px 4px calc(8px + var(--safe-b));
  z-index:90;
  box-shadow:0 -6px 20px rgba(15,23,42,.04);
}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-3);
  font-size:10.5px; font-weight:600;
  padding:6px 8px;
  border-radius:var(--r-sm);
  transition:all .15s;
  position:relative;
  min-width:58px;
  letter-spacing:-.005em;
}
.nav-btn .icon{ width:21px; height:21px; }
.nav-btn.on{ color:var(--brand); }
.nav-btn .nav-dot{
  position:absolute; top:4px; right:12px;
  min-width:16px; height:16px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9.5px; font-weight:700;
  border-radius:999px;
  display:grid; place-items:center;
  border:1.5px solid #fff;
}

/* ============ SHEETS ============ */
.sheet{
  position:fixed; inset:0; z-index:200;
  background:rgba(15,23,42,.5);
  display:none; align-items:flex-end;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.sheet.show{ display:flex; }
.sheet-body{
  background:#fff;
  width:100%; max-width:620px;
  margin:0 auto;
  max-height:92vh; overflow-y:auto;
  border-radius:20px 20px 0 0;
  padding:22px 20px calc(24px + var(--safe-b));
  animation:sheetUp .28s cubic-bezier(.3,1.2,.5,1);
}
@media(min-width:700px){
  .sheet{ align-items:center; padding:20px; }
  .sheet-body{ border-radius:16px; }
}
@keyframes sheetUp{
  from{ transform:translateY(100%); }
  to{ transform:translateY(0); }
}
.sheet-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px; margin-bottom:18px; padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.sheet-title{
  font-family:var(--display);
  font-size:21px; font-weight:600; letter-spacing:-.015em;
  display:flex; align-items:center; gap:8px;
  line-height:1.2;
}
.sheet-title .icon{ width:20px; height:20px; color:var(--brand-2); }
.sheet-sub{
  font-size:12.5px; color:var(--text-3); margin-top:5px; line-height:1.5;
}
.sheet-close{
  width:34px; height:34px; flex-shrink:0;
  border-radius:50%; background:var(--bg-subtle);
  border:1px solid var(--border);
  display:grid; place-items:center;
  color:var(--text-2);
  transition:background .15s;
}
.sheet-close:hover{ background:var(--border); }
.sheet-close .icon{ width:15px; height:15px; }

/* ============ FORM ============ */
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:11.5px; font-weight:600;
  color:var(--text-2); margin-bottom:6px;
  letter-spacing:.005em;
}
.input, .textarea{
  width:100%; padding:12px 14px;
  background:#fff; border:1px solid var(--border-2);
  border-radius:var(--r-sm);
  font-size:14px; font-weight:500;
  outline:none; transition:all .15s;
}
.input:focus, .textarea:focus{
  border-color:var(--brand-2);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.textarea{ min-height:74px; resize:vertical; font-family:inherit; }
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ============ CART LINES ============ */
.cart-line{
  display:flex; gap:12px; padding:14px 0;
  border-bottom:1px solid var(--border);
  align-items:center;
}
.cart-line-icon{
  width:50px; height:50px; border-radius:10px;
  background:var(--bg-subtle); display:grid; place-items:center;
  color:var(--text-3); flex-shrink:0; overflow:hidden;
}
.cart-line-icon img{ width:100%; height:100%; object-fit:cover; }
.cart-line-icon .icon{ width:22px; height:22px; }
.cart-line-body{ flex:1; min-width:0; }
.cart-line-name{ font-size:13.5px; font-weight:600; line-height:1.3; }
.cart-line-price{ font-size:12px; color:var(--text-3); margin-top:3px; }
.qty{
  display:flex; align-items:center;
  background:var(--bg-subtle); border:1px solid var(--border);
  border-radius:999px; padding:2px;
  flex-shrink:0;
}
.qty button{
  width:28px; height:28px; border-radius:50%;
  background:transparent;
  display:grid; place-items:center;
  color:var(--brand-2); font-weight:700;
  transition:background .15s;
}
.qty button:hover{ background:#fff; }
.qty button .icon{ width:13px; height:13px; }
.qty span{
  min-width:24px; text-align:center;
  font-weight:700; font-size:13px;
  font-variant-numeric:tabular-nums;
}

.totals{ padding:16px 0 0; display:flex; flex-direction:column; gap:6px; }
.total-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-2); }
.total-row.grand{
  font-weight:700; font-size:16px; color:var(--text);
  padding-top:12px; margin-top:6px;
  border-top:1px solid var(--border);
}

/* ============ BADGES ============ */
.badge{
  display:inline-flex; align-items:center;
  padding:3px 9px; border-radius:6px;
  font-size:10.5px; font-weight:600;
  white-space:nowrap;
  letter-spacing:.005em;
}
.badge-yellow{ background:var(--gold-soft); color:var(--gold-ink); }
.badge-blue{ background:var(--brand-soft); color:var(--brand-2); }
.badge-purple{ background:var(--purple-soft); color:var(--purple); }
.badge-green{ background:var(--green-soft); color:var(--green); }
.badge-red{ background:var(--red-soft); color:var(--red); }
.badge-gray{ background:var(--bg-subtle); color:var(--text-3); }

/* ============ EMPTY STATE ============ */
.empty{
  text-align:center; padding:52px 24px;
  color:var(--text-3); font-size:13.5px;
}
.empty-icon{
  width:56px; height:56px; margin:0 auto 14px;
  border-radius:14px; background:var(--bg-subtle);
  border:1px solid var(--border);
  display:grid; place-items:center; color:var(--text-3);
}
.empty-icon .icon{ width:24px; height:24px; }
.empty b{
  display:block; font-size:15px; font-weight:600;
  color:var(--text); margin-bottom:6px;
}
.empty p{ line-height:1.6; max-width:340px; margin:0 auto; }

/* ============ TOAST ============ */
.toast{
  position:fixed; left:50%; bottom:120px;
  transform:translate(-50%,120%);
  background:#1c1c1e; color:#fff;
  padding:12px 18px; border-radius:999px;
  font-size:12.5px; font-weight:500;
  z-index:500;
  transition:transform .3s cubic-bezier(.3,1.2,.5,1);
  box-shadow:var(--shadow-lg);
  max-width:calc(100vw - 32px);
  display:flex; align-items:center; gap:8px;
}
.toast.show{ transform:translate(-50%,0); }
.toast.error{ background:var(--red); }
.toast .icon{ width:15px; height:15px; flex-shrink:0; }

/* ============ WELCOME ============ */
.welcome-hero{ text-align:center; padding:32px 24px 24px; }
.welcome-hero .badge-icon{
  width:64px; height:64px; margin:0 auto 16px;
  border-radius:16px;
  background:var(--brand);
  color:#fff;
  display:grid; place-items:center;
  box-shadow:var(--shadow-md);
}
.welcome-hero .badge-icon .icon{ width:28px; height:28px; }
.welcome-hero h1{
  font-family:var(--display);
  font-size:24px; font-weight:600; letter-spacing:-.015em;
  margin-bottom:8px;
  line-height:1.2;
}
.welcome-hero p{
  font-size:14px; color:var(--text-2); line-height:1.55;
  max-width:340px; margin:0 auto;
}
.loc-chip{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:16px; padding:8px 14px;
  background:var(--brand-soft);
  border:1px solid var(--brand-line);
  color:var(--brand-2);
  font-weight:600; font-size:12.5px;
  border-radius:999px;
}
.loc-chip .icon{ width:14px; height:14px; }

/* ============ SPINNER ============ */
.spinner{
  width:16px; height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============ OFFLINE ============ */
.offline{
  position:fixed; top:0; left:0; right:0; z-index:400;
  background:var(--red); color:#fff;
  text-align:center; padding:8px;
  font-size:12px; font-weight:600;
  transform:translateY(-100%);
  transition:transform .3s;
}
.offline.show{ transform:translateY(0); }

/* ============ PAYMENT BOX ============ */
.pay{
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px;
  margin-top:14px;
}
.pay-head{
  display:flex; align-items:center; gap:8px;
  margin-bottom:10px;
}
.pay-head .icon{ width:16px; height:16px; color:var(--brand-2); }
.pay-head b{ font-size:13px; font-weight:600; }
.pay-rows{
  background:#fff; border:1px dashed var(--border-2);
  border-radius:var(--r-sm); padding:12px;
}
.pay-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:7px 0; gap:10px;
}
.pay-row + .pay-row{ border-top:1px solid var(--border); }
.pay-row .label{
  font-size:10.5px; font-weight:600; color:var(--text-3);
  text-transform:uppercase; letter-spacing:.05em;
}
.pay-row .value{
  font-family:var(--mono); font-size:14.5px; font-weight:700;
  letter-spacing:.3px;
}
.pay-copy{
  background:transparent; border:1px solid var(--border-2);
  border-radius:6px; padding:4px 8px;
  font-size:10.5px; font-weight:600; color:var(--brand-2);
  display:inline-flex; align-items:center; gap:4px;
  transition:all .15s;
}
.pay-copy:hover{ background:var(--brand-soft); border-color:var(--brand-2); }
.pay-copy .icon{ width:11px; height:11px; }

.pay-note{
  background:var(--gold-soft); border:1px solid var(--gold-line);
  border-radius:var(--r-sm); padding:12px;
  font-size:12.5px; color:var(--gold-ink); line-height:1.5;
}

/* ============ RATING ============ */
.rating-stars{
  display:flex; justify-content:center; gap:6px;
  margin:20px 0;
}
.rating-star{
  width:44px; height:44px;
  display:grid; place-items:center;
  color:var(--border-3);
  transition:all .15s;
  border-radius:8px;
}
.rating-star .icon{ width:28px; height:28px; }
.rating-star.on{ color:var(--gold); }
.tip-grid{
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:8px; margin:10px 0;
}
.tip-btn{
  padding:12px 8px;
  background:#fff; border:1.5px solid var(--border-2);
  border-radius:var(--r-sm);
  font-size:13px; font-weight:700; color:var(--text);
  text-align:center;
  transition:all .15s;
}
.tip-btn:hover:not(.on){ border-color:var(--border-3); }
.tip-btn.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
.tip-btn small{ display:block; font-size:10.5px; font-weight:500; opacity:.72; margin-top:3px; }

/* ============ SLOTS ============ */
.slots{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:8px;
}
.slot{
  padding:10px 8px;
  background:#fff; border:1.5px solid var(--border-2);
  border-radius:var(--r-sm);
  text-align:center;
  font-size:12.5px; font-weight:600; color:var(--text-2);
  transition:all .15s;
}
.slot:hover:not(:disabled):not(.on){ border-color:var(--border-3); color:var(--text); }
.slot.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
.slot:disabled{ opacity:.35; cursor:not-allowed; text-decoration:line-through; }

/* ============ CONFIRM LIST ============ */
.confirm-list{
  background:var(--bg-subtle); border:1px solid var(--border);
  border-radius:var(--r); padding:12px; margin-bottom:14px;
  max-height:220px; overflow-y:auto;
}
.confirm-list .row{
  display:flex; justify-content:space-between;
  font-size:13px; padding:5px 0; color:var(--text-2);
}
.confirm-list .row b{ color:var(--text); }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(v){
  const currency = state.hotel?.currency || 'Ksh';
  return currency + ' ' + Number(v || 0).toLocaleString();
}

async function api(path, opts = {}){
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  let json = {};
  try { json = await res.json(); } catch {}
  if (!res.ok || json.ok === false) {
    const err = new Error(json.error || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return json;
}

let toastTimer = null;
function toast(msg, kind = 'success'){
  const el = $('toast');
  el.className = 'toast ' + kind;
  el.innerHTML = (kind === 'error' ? ICON.alert : ICON.check) + '<span>' + esc(msg) + '</span>';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function statusBadge(status){
  const s = String(status || '').toLowerCase();
  const map = {
    pending:['badge-yellow','Pending'], new:['badge-yellow','New'],
    accepted:['badge-blue','Accepted'], preparing:['badge-blue','Preparing'],
    on_the_way:['badge-purple','On the way'], completed:['badge-green','Completed'],
    cancelled:['badge-red','Cancelled'], requested:['badge-yellow','Requested'],
    confirmed:['badge-blue','Confirmed'], declined:['badge-red','Declined']
  };
  const [cls, label] = map[s] || ['badge-gray', s.toUpperCase()];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function relativeTime(iso){
  if (!iso) return '';
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const s = Math.floor(diff / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

function formatETA(order){
  const mins = order.eta_minutes || order.estimated_minutes;
  if (mins) return '~' + mins + ' min';
  const status = String(order.status || '').toLowerCase();
  const fallback = { pending:25, accepted:20, preparing:12, on_the_way:4 };
  return fallback[status] ? '~' + fallback[status] + ' min' : '';
}

function locLabel(mode, number){
  const m = mode === 'table' ? t('tableLabel') : t('roomLabel');
  return m + ' ' + number;
}

function saveLocal(){
  try {
    if (state.token) {
      localStorage.setItem('gh_guest_token', state.token);
      localStorage.setItem('gh_guest_loc', JSON.stringify({
        hotel: HOTEL_ID, mode: state.context.mode, number: state.context.number
      }));
    }
    localStorage.setItem('gh_guest_cart_' + HOTEL_ID, JSON.stringify(state.cart));
    localStorage.setItem('gh_guest_recent_' + HOTEL_ID, JSON.stringify(state.recentItems.slice(0, 8)));
    localStorage.setItem('gh_lang', state.lang);
    localStorage.setItem('gh_ratings_' + HOTEL_ID, JSON.stringify(state.ratings));
  } catch {}
}

function loadLocal(){
  try {
    state.token = localStorage.getItem('gh_guest_token') || null;
    const locStr = localStorage.getItem('gh_guest_loc');
    if (locStr && state.token) {
      try {
        const loc = JSON.parse(locStr);
        const sameHotel = loc.hotel === HOTEL_ID;
        const sameMode = loc.mode === (URL_MODE === 'table' ? 'table' : 'room');
        const sameLoc = !URL_ROOM || String(loc.number) === String(URL_ROOM);
        if (!(sameHotel && sameMode && sameLoc)) {
          localStorage.removeItem('gh_guest_token');
          localStorage.removeItem('gh_guest_loc');
          state.token = null;
        }
      } catch {
        localStorage.removeItem('gh_guest_token');
        state.token = null;
      }
    }
    const cart = localStorage.getItem('gh_guest_cart_' + HOTEL_ID);
    if (cart) state.cart = JSON.parse(cart) || [];
    const recent = localStorage.getItem('gh_guest_recent_' + HOTEL_ID);
    if (recent) state.recentItems = JSON.parse(recent) || [];
    const lang = localStorage.getItem('gh_lang');
    if (lang && I18N[lang]) state.lang = lang;
    const ratings = localStorage.getItem('gh_ratings_' + HOTEL_ID);
    if (ratings) state.ratings = JSON.parse(ratings) || {};
  } catch {}
}

function clearLocalSession(){
  try {
    localStorage.removeItem('gh_guest_token');
    localStorage.removeItem('gh_guest_loc');
    localStorage.removeItem('gh_guest_cart_' + HOTEL_ID);
  } catch {}
  Object.assign(state, {
    token:null, session:null, orders:[], bookings:[],
    activeOrder:null, activeBooking:null, cart:[]
  });
  if (state.sse) { try { state.sse.close(); } catch {} state.sse = null; }
}

   ============================================================ */
let sheetStack = [];
function openSheet(id){
  const el = $(id);
  if (!el) return;
  el.classList.add('show');
  if (!sheetStack.includes(id)) sheetStack.push(id);
  document.body.style.overflow = 'hidden';
}
function closeSheet(id){
  const el = $(id);
  if (!el) return;
  el.classList.remove('show');
  sheetStack = sheetStack.filter(x => x !== id);
  if (!sheetStack.length) document.body.style.overflow = '';
}
document.querySelectorAll('.sheet').forEach(s => {
  s.addEventListener('click', e => { if (e.target === s) closeSheet(s.id); });
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-close]');
  if (b) closeSheet(b.dataset.close);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetStack.length) closeSheet(sheetStack[sheetStack.length - 1]);
});

/* ============================================================
   AUTO CHECK-IN
   ============================================================ */
async function tryAutoCheckIn(){
  if (state.token) {
    try {
      const me = await api('/api/guest/me');
      const s = me.session;
      if ((s.status || 'active') === 'active') {
        state.session = s;
        return { mode: 'existing' };
      }
      clearLocalSession();
    } catch { clearLocalSession(); }
  }
  try {
    const res = await api('/api/guest/checkin', {
      method: 'POST',
      body: JSON.stringify({
        hotel_id: HOTEL_ID,
        mode: state.context.mode,
        number: state.context.number,
        device_id: DEVICE_ID
      })
    });
    state.session = res.session;
    state.token = res.token;
    saveLocal();
    return { mode: res.created_new ? 'new' : 'joined', session: res.session };
  } catch (e) {
    if (e.status === 403 || e.status === 409) return { mode: 'blocked', error: e.message };
    throw e;
  }
}

/* ============================================================
   MARKETPLACE RAILS
   ============================================================ */
const RAIL_MAP = {
  eat:       { icon:ICON.utensils,    titleKey:'eatTitle',       subKey:'eatSub',        groups:['food','restaurant','drinks'],  svcCats:['food','drink','kitchen'] },
  explore:   { icon:ICON.compass,     titleKey:'exploreTitle',   subKey:'exploreSub',    groups:['tours','transport'],           svcCats:['tour','transport'] },
  wellness:  { icon:ICON.heart,       titleKey:'wellnessTitle',  subKey:'wellnessSub',   groups:['wellness','spa'],              svcCats:['spa','wellness'] },
  ride:      { icon:ICON.car,         titleKey:'rideTitle',      subKey:'rideSub',       groups:['transport','taxi'],            svcCats:['transport','taxi'] },
  local:     { icon:ICON.shoppingBag, titleKey:'localTitle',     subKey:'localSub',      groups:['local','crafts','shops'],      svcCats:['local'] },
  essentials:{ icon:ICON.droplets,    titleKey:'essentialsTitle',subKey:'essentialsSub', groups:['essentials','convenience'],    svcCats:['essentials'] }
};

function vendorGroup(v){ return v.group || 'services'; }

function itemsForRail(railKey){
  const rail = RAIL_MAP[railKey];
  if (!rail) return { items:[], services:[], vendors:[] };

  const items = state.menu.filter(m => {
    const cat = String(m.category || '').toLowerCase();
    const dept = String(m.department || '').toLowerCase();
    if (rail.svcCats.includes(cat) || rail.svcCats.includes(dept)) return true;
    if (railKey === 'eat' && (cat.includes('food') || cat.includes('drink') || dept === 'kitchen')) return true;
    return false;
  });

  const services = state.services.filter(s => {
    const cat = String(s.category || '').toLowerCase();
    const dept = String(s.department || '').toLowerCase();
    return rail.svcCats.includes(cat) || rail.svcCats.includes(dept) ||
           rail.groups.includes(cat) || rail.groups.includes(dept);
  });

  const vendors = state.vendors.filter(v => rail.groups.includes(vendorGroup(v)));

  return { items, services, vendors };
}

function renderRails(){
  const wrap = $('railsWrap');
  if (!wrap) return;

  const sections = [];
  for (const key of ['eat','explore','wellness','ride','local','essentials']) {
    const rail = RAIL_MAP[key];
    const { items, services, vendors } = itemsForRail(key);
    if (items.length + services.length + vendors.length === 0) continue;
    sections.push({ key, rail, items, services, vendors });
  }

  if (!sections.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.store}</div>
        <b>Marketplace coming soon</b>
        <p>Your hotel has not published items yet.</p>
      </div>`;
    return;
  }

  wrap.innerHTML = sections.map(({ key, rail, items, services, vendors }) => {
    const tiles = [];
    items.slice(0, 6).forEach(i => tiles.push(tileForMenuItem(i)));
    services.slice(0, 3).forEach(s => tiles.push(tileForService(s)));
    vendors.slice(0, 4).forEach(v => tiles.push(tileForVendor(v)));

    return `
      <section class="section">
        <div class="section-head">
          <div>
            <div class="section-title">${esc(t(rail.titleKey))}</div>
            <div class="section-sub">${esc(t(rail.subKey))}</div>
          </div>
          <button class="section-link" data-goto="${key}">${t('seeAll')} →</button>
        </div>
        <div class="rail">${tiles.slice(0, 8).join('')}</div>
      </section>
    `;
  }).join('');

  wrap.querySelectorAll('[data-goto]').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.goto));
  });

  attachTileHandlers(wrap);
}

function renderPopularRail(){
  const popular = state.menu.filter(i => i.tags?.includes('popular')).slice(0, 8);
  const list = popular.length ? popular : state.menu.slice(0, 8);
  const rail = $('popularRail');
  if (!rail) return;
  rail.innerHTML = list.length
    ? list.map(tileForMenuItem).join('')
    : '<div style="padding:24px 18px;color:var(--text-3);font-size:13px">Menu coming soon</div>';
  attachTileHandlers(rail);
}

/* ============================================================

function tileForMenuItem(item){
  const cartLine = state.cart.find(l => l.id === String(item.id));
  const qty = cartLine?.qty || 0;
  const unavailable = item.available === false;
  const img = item.image_url || item.image;
  const isPopular = item.tags?.includes('popular');

  return `
    <div class="tile" data-tile-item="${esc(item.id)}" style="${unavailable ? 'opacity:.55;pointer-events:none' : ''}">
      ${isPopular ? '<span class="tile-badge popular">' + ICON.flame + 'Popular</span>' : '<span class="tile-badge hotel">' + ICON.store + 'Hotel</span>'}
      <div class="tile-img">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ICON.utensils}
      </div>
      <div class="tile-body">
        <div class="tile-name">${esc(item.name)}</div>
        ${item.desc ? `<div class="tile-meta">${esc(item.desc)}</div>` : ''}
        <div class="tile-price-row">
          <span class="price">${money(item.price)}</span>
          <button class="add-btn ${qty > 0 ? 'has' : ''}" data-add-menu="${esc(item.id)}" aria-label="Add">
            ${qty > 0 ? ICON.check : ICON.plus}
          </button>
        </div>
      </div>
    </div>
  `;
}

function tileForService(s){
  return `
    <div class="tile" data-tile-svc="${esc(s.id)}">
      <span class="tile-badge hotel">${ICON.store}Hotel</span>
      <div class="tile-img">
        ${s.image_url || s.image
          ? `<img src="${esc(s.image_url || s.image)}" alt="" loading="lazy">`
          : ICON.bell}
      </div>
      <div class="tile-body">
        <div class="tile-name">${esc(s.name)}</div>
        ${s.desc ? `<div class="tile-meta">${esc(s.desc)}</div>` : ''}
        <div class="tile-price-row">
          <span class="price">${s.price > 0 ? money(s.price) : '<small>Complimentary</small>'}</span>
          <button class="add-btn" data-request-svc="${esc(s.id)}" aria-label="Request">
            ${ICON.plus}

function tileForVendor(v){
  const logo = v.logo_url || v.image_url || v.image;
  const group = vendorGroup(v);
  const isLocal = group === 'local';
  const badgeCls = isLocal ? 'local' : 'partner';
  const badgeLabel = isLocal ? 'Local' : 'Partner';
  return `
    <div class="tile" data-tile-vendor="${esc(v.id)}">
      <span class="tile-badge ${badgeCls}">${ICON.store}${badgeLabel}</span>
      <div class="tile-img">

function attachTileHandlers(root){
  root.querySelectorAll('[data-add-menu]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); addToCart(btn.dataset.addMenu); });
  });

    tile.addEventListener('click', e => {
      if (e.target.closest('[data-add-menu]')) return;
      openItemDetail(tile.dataset.tileItem);

  });
  root.querySelectorAll('[data-request-svc]').forEach(btn => {

  });

    btn.addEventListener('click', e => { e.stopPropagation(); openBookingSheet(btn.dataset.bookVendor); });
  });

    tile.addEventListener('click', e => {

      openVendorDetail(tile.dataset.tileVendor);

/* ============================================================
   CONCIERGE
   ============================================================ */
function wireConcierge(){
  const input = $('conciergeInput');
  if (!input) return;
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(110, input.scrollHeight) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleConciergeQuery(input.value.trim());
    }
  });
  $('conciergeHints')?.querySelectorAll('[data-hint]').forEach(b => {
    b.addEventListener('click', () => {
      input.value = b.dataset.hint;
      handleConciergeQuery(b.dataset.hint);
    });
  });
}

function handleConciergeQuery(q){
  if (!q) return;
  const query = q.toLowerCase();
  if (/(dinner|lunch|breakfast|eat|food|hungry|menu|restaurant|meal)/.test(query)) {
    switchTab('eat'); toast('Showing food and drinks');
  } else if (/(safari|tour|excursion|adventure|experience)/.test(query)) {
    switchTab('explore'); toast('Showing experiences');
  } else if (/(spa|massage|wellness|relax|facial)/.test(query)) {
    switchTab('explore'); toast('Showing wellness');
  } else if (/(taxi|airport|pickup|drive|car|transfer|ride)/.test(query)) {
    switchTab('explore'); toast('Showing transport');
  } else if (/(gift|souvenir|craft|shop|buy)/.test(query)) {
    switchTab('market'); toast('Showing local finds');
  } else {
    switchTab('market');
    const si = $('marketSearch');
    if (si) { si.value = q; si.dispatchEvent(new Event('input')); }
    toast('Searching ' + q);
  }
  const inp = $('conciergeInput');
  if (inp) { inp.value = ''; inp.style.height = 'auto'; }
}

/* ============================================================
   SEARCH
   ============================================================ */
function wireMarketSearch(){
  const input = $('marketSearch');
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const wrap = $('railsWrap');
    if (!wrap) return;
    if (!q) { renderRails(); return; }
    renderSearchResults(q);
  });
}

function renderSearchResults(q){
  const pool = [];
  state.menu.forEach(i => pool.push({ type:'menu', data:i }));
  state.services.forEach(s => pool.push({ type:'service', data:s }));
  state.vendors.forEach(v => pool.push({ type:'vendor', data:v }));

  const matches = pool.filter(x => {
    const d = x.data;
    const hay = (d.name || '') + ' ' + (d.desc || d.bio || '') + ' ' + (d.category || vendorGroup(d));
    return hay.toLowerCase().includes(q);
  });

  const wrap = $('railsWrap');
  if (!matches.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.search}</div>
        <b>No matches for "${esc(q)}"</b>
        <p>${t('tryDifferent')}</p>
      </div>`;
    return;
  }

  const tiles = matches.map(x => {
    if (x.type === 'menu') return tileForMenuItem(x.data);
    if (x.type === 'service') return tileForService(x.data);
    return tileForVendor(x.data);
  }).join('');

  wrap.innerHTML = `
    <section class="section">
      <div class="section-head">
        <div>
          <div class="section-title">Results for "${esc(q)}"</div>
          <div class="section-sub">${matches.length} ${matches.length === 1 ? 'match' : 'matches'}</div>
        </div>
      </div>
      <div class="rail">${tiles}</div>
    </section>
  `;
  attachTileHandlers(wrap);
}

/* ============================================================
   CART
   ============================================================ */
function addToCart(id){
  const item = state.menu.find(i => String(i.id) === String(id));
  if (!item) return;
  if (item.available === false) return toast(item.name + ' is sold out', 'error');

  const line = state.cart.find(l => l.id === String(id));
  if (line) line.qty += 1;
  else state.cart.push({
    id: String(item.id), name: item.name, price: Number(item.price) || 0,
    icon: null, image: item.image_url || item.image || null,
    qty: 1, notes: '', department: item.department || 'kitchen'
  });
  trackRecentItem(id);
  saveLocal();
  renderCartBar();
  toast(item.name + ' added');
  refreshCurrentPage();
}

function setCartLine(id, qty, notes){
  const item = state.menu.find(i => String(i.id) === String(id));
  if (!item) return;
  state.cart = state.cart.filter(l => l.id !== String(id));
  if (qty > 0) {
    state.cart.push({
      id: String(item.id), name: item.name, price: Number(item.price) || 0,
      icon: null, image: item.image_url || item.image || null,
      qty, notes: notes || '', department: item.department || 'kitchen'
    });
    trackRecentItem(id);
  }
  saveLocal();
  renderCartBar();
  refreshCurrentPage();
}

function updateQty(id, delta){
  const line = state.cart.find(l => l.id === String(id));
  if (!line) return;
  setCartLine(id, Math.max(0, line.qty + delta), line.notes);
  renderCartSheet();
}

function cartSubtotal(){ return state.cart.reduce((s, l) => s + l.qty * (Number(l.price) || 0), 0); }
function cartCount(){ return state.cart.reduce((s, l) => s + l.qty, 0); }

function renderCartBar(){
  const n = cartCount();
  const bar = $('cartBar');
  if (!bar) return;
  if (!n) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  $('cartCount').textContent = n + ' ' + (n === 1 ? 'item' : 'items');
  $('cartTotal').textContent = money(cartSubtotal());
}

function renderCartSheet(){
  const box = $('cartItems');
  if (!state.cart.length) {
    box.innerHTML = '<div class="empty" style="padding:32px 0"><b>' + t('cartEmpty') + '</b></div>';
    $('cartTotals').innerHTML = '';
    return;
  }
  box.innerHTML = state.cart.map(l => `
    <div class="cart-line">
      <div class="cart-line-icon">${l.image ? `<img src="${esc(l.image)}" loading="lazy">` : ICON.utensils}</div>
      <div class="cart-line-body">
        <div class="cart-line-name">${esc(l.name)}</div>
        <div class="cart-line-price">${money(l.price)} each${l.notes ? ' · ' + esc(l.notes) : ''}</div>
      </div>
      <div class="qty">
        <button data-qty-dec="${esc(l.id)}" aria-label="Decrease">${ICON.minus}</button>
        <span>${l.qty}</span>
        <button data-qty-inc="${esc(l.id)}" aria-label="Increase">${ICON.plus}</button>
      </div>
    </div>
  `).join('');
  box.querySelectorAll('[data-qty-inc]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.qtyInc, 1)));
  box.querySelectorAll('[data-qty-dec]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.qtyDec, -1)));

  const sub = cartSubtotal();
  $('cartTotals').innerHTML = `
    <div class="total-row"><span>${t('subtotal')}</span><span>${money(sub)}</span></div>
    <div class="total-row grand"><span>${t('total')}</span><span>${money(sub)}</span></div>
  `;

  $('cartSub').textContent = state.context.number
    ? `${locLabel(state.context.mode, state.context.number)} · ${state.hotel?.name || ''}`
    : state.hotel?.name || '';
}

async function placeOrder(){
  if (!state.cart.length) return;
  if (!state.session) return toast('Not signed in', 'error');

  const subtotal = cartSubtotal();
  const items = state.cart.map(l => ({
    id: l.id, name: l.name, price: l.price, qty: l.qty,
    notes: l.notes || '', department: l.department || 'kitchen'
  }));

  const deptCounts = {};
  state.cart.forEach(l => {
    const d = l.department || 'kitchen';
    deptCounts[d] = (deptCounts[d] || 0) + l.qty;
  });
  const primaryDept = Object.entries(deptCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'kitchen';

  const btn = $('placeOrderBtn');
  btn.disabled = true; btn.textContent = 'Placing';

  try {
    const res = await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({
        hotel_id: HOTEL_ID,
        mode: state.context.mode,
        room_number: state.context.mode === 'room' ? state.context.number : null,
        table_number: state.context.mode === 'table' ? state.context.number : null,
        guest_name: state.session.guest_name,
        guest_phone: state.session.guest_phone,
        guest_session_id: state.session.id,
        service_title: items.map(i => i.qty + ' x ' + i.name).join(', '),
        category: 'food', kind: 'food', department: primaryDept,
        amount: subtotal, total: subtotal, subtotal,
        details: items.filter(i => i.notes).map(i => i.name + ': ' + i.notes).join(' | '),
        items
      })
    });

    state.cart = [];
    saveLocal();
    renderCartBar();
    state.activeOrder = res.order;
    closeSheet('cartSheet');
    showSuccess(res.order);
    refreshOrders();
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = t('placeOrder');
  }
}

function attachCopyHandlers(root){
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const old = btn.innerHTML;
        btn.innerHTML = ICON.check + t('copied');
        setTimeout(() => btn.innerHTML = old, 1400);
      } catch { toast('Copy failed'); }
    });
  });
}

    </div>
    <div class="field">
      <label>${t('notes')}</label>
      <textarea class="textarea" id="bkNotes" placeholder="${esc(t('notesPlaceholder'))}"></textarea>

  `;

  $('bookingSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('bookingSheet'));

  async function loadSlots(){
    const date = $('bkDate').value;
    if (!date) return;
    $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>Loading</b></div>';
    try {
      const res = await api(`/api/public/vendor/${encodeURIComponent(vendor.id)}/slots?date=${date}`);
      const slots = res.slots || [];
      if (!slots.length) {
        $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>No slots</b><p>Try another date.</p></div>';
        return;
      }
      $('bkSlots').innerHTML = `<div class="slots">${
        slots.map(s => `<button class="slot" data-slot="${esc(s.start)}">${new Date(s.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</button>`).join('')
      }</div>`;
      $('bkSlots').querySelectorAll('[data-slot]').forEach(btn => {
        btn.addEventListener('click', () => {
          $('bkSlots').querySelectorAll('[data-slot]').forEach(x => x.classList.remove('on'));
          btn.classList.add('on');
          selectedSlot = btn.dataset.slot;
          $('bkConfirm').disabled = false;
        });
      });
    } catch (e) {
      $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>Could not load</b></div>';
    }
  }

  $('bkDate').addEventListener('change', loadSlots);
  $('bkConfirm').addEventListener('click', async () => {
    if (!selectedSlot) return;
    const sel = $('bkService');
    const opt = sel.options[sel.selectedIndex];
    const serviceId = sel.value;
    const serviceName = opt.textContent.split(' — ')[0];
    const price = Number(opt.dataset.price) || 0;
    const guests = Number($('bkGuests').value) || 1;
    const notes = $('bkNotes').value.trim();

    $('bkConfirm').disabled = true;
    $('bkConfirm').textContent = 'Booking';
    try {
      const res = await api('/api/bookings', {
        method: 'POST',
        body: JSON.stringify({
          hotel_id: HOTEL_ID,
          vendor_id: vendor.id,
          service_id: serviceId,
          service_title: serviceName,
          scheduled_for: selectedSlot,
          duration_min: 60,
          guests_count: guests,
          guest_name: state.session.guest_name,
          guest_phone: state.session.guest_phone,
          room_number: state.context.mode === 'room' ? state.context.number : null,
          table_number: state.context.mode === 'table' ? state.context.number : null,
          guest_session_id: state.session.id,
          amount: price, notes
        })
      });
      closeSheet('bookingSheet');
      showBookingSuccess(res.booking);
      refreshBookings();
    } catch (e) {
      toast('Booking failed: ' + e.message, 'error');
      $('bkConfirm').disabled = false;
      $('bkConfirm').textContent = t('confirmBooking');
    }
  });

  openSheet('bookingSheet');
  loadSlots();
}

async function refreshOrders(){
  if (!state.token || !state.session) return;
  try {
    const r = await api('/api/guest/orders');
    state.orders = (r.orders || []).filter(o => String(o.guest_session_id) === String(state.session.id));
    pickActive();
    renderActiveCard();
    if (state.tab === 'trip') renderTripPage();
    maybePromptRating();
  } catch (e) { console.warn('refreshOrders:', e.message); }
}

async function refreshBookings(){
  if (!state.token || !state.session) return;
  try {
    const r = await api('/api/bookings/guest');
    state.bookings = (r.bookings || []).filter(b => String(b.guest_session_id) === String(state.session.id));
    pickActive();
    renderActiveCard();
    if (state.tab === 'trip') renderTripPage();
  } catch {}
}

function pickActive(){
  state.activeOrder = state.orders.find(o => !['completed','cancelled'].includes(String(o.status || '').toLowerCase())) || null;
  state.activeBooking = state.bookings.find(b => !['completed','cancelled','declined'].includes(String(b.status || '').toLowerCase())) || null;
  const count = (state.activeOrder ? 1 : 0) + (state.activeBooking ? 1 : 0);
  const dot = $('tripDot');
  if (dot) {
    dot.textContent = count;
    dot.classList.toggle('hidden', count === 0);
  }
}

function renderActiveCard(){
  const card = $('activeCard');
  if (!card) return;
  const o = state.activeOrder;
  const b = state.activeBooking;
  const active = o || b;

  if (!active) { card.classList.remove('show'); return; }
  card.className = 'active-card show status-' + String(active.status || '').toLowerCase();

  if (o) {
    const steps = ['pending','accepted','preparing','on_the_way','completed'];
    const idx = steps.indexOf(String(o.status || '').toLowerCase());
    const progress = steps.map((_, i) => {
      const cls = i < idx ? 'done' : i === idx ? 'on' : '';
      return `<div class="seg ${cls}"></div>`;
    }).join('');
    const eta = formatETA(o);
    card.innerHTML = `
      <div class="active-head">
        <div>
          <div class="active-title">${esc(o.service_title || t('yourOrder'))}</div>
          <div class="active-ref">${esc(o.reference)} · ${relativeTime(o.created_at)}</div>
        </div>
        ${statusBadge(o.status)}
      </div>
      ${eta ? `<div class="eta-row">${ICON.clock}<span>${t('arrivingIn')} <b>${eta}</b></span></div>` : ''}
      <div class="progress">${progress}</div>
    `;
  } else {
    card.innerHTML = `
      <div class="active-head">
        <div>
          <div class="active-title">${esc(b.service_title || 'Booking')}</div>
          <div class="active-ref">${esc(b.reference)}</div>
        </div>
        ${statusBadge(b.status)}
      </div>
      <div style="display:flex;gap:12px;font-size:12.5px;color:var(--text-2);margin-top:10px;align-items:center">
        ${ICON.calendar}<span>${new Date(b.scheduled_for).toLocaleString()}</span>
      </div>
    `;
  }
}

function showRatingPrompt(order){
  let selectedStars = 0, selectedTip = 0;
  const subtotal = Number(order.amount) || 0;
  const tips = [{ pct:0, label:t('noTip') }, { pct:5, label:'5%' }, { pct:10, label:'10%' }];

  $('ratingSheetBody').innerHTML = `
    <div class="sheet-head">
      <div>
        <div class="sheet-title">${t('rateYourOrder')}</div>
        <div class="sheet-sub">${esc(order.service_title || '')} · ${esc(order.reference)}</div>
      </div>
      <button class="sheet-close" data-close="ratingSheet" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div style="text-align:center;font-size:13.5px;font-weight:500;color:var(--text-2)">${t('howWasIt')}</div>
    <div class="rating-stars">
      ${[1,2,3,4,5].map(n => `<button class="rating-star" data-star="${n}" aria-label="${n} stars">${ICON.starOutline}</button>`).join('')}
    </div>
    <div class="field">
      <label>${t('tip')}</label>
      <div class="tip-grid">
        ${tips.map(o => `
          <button class="tip-btn ${o.pct === 0 ? 'on' : ''}" data-tip="${o.pct}">
            ${o.label}
            ${o.pct > 0 ? `<small>${money(Math.round(subtotal * o.pct / 100))}</small>` : ''}
          </button>
        `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn btn-secondary btn-lg" id="ratingSkip" style="flex:1">${t('skip')}</button>
      <button class="btn btn-primary btn-lg" id="ratingSubmit" style="flex:2">${t('submit')}</button>
    </div>
  `;

  const stars = $('ratingSheetBody').querySelectorAll('[data-star]');
  stars.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedStars = Number(btn.dataset.star);
      stars.forEach(s => {
        const on = Number(s.dataset.star) <= selectedStars;
        s.classList.toggle('on', on);
        s.innerHTML = on ? ICON.star : ICON.starOutline;
      });
    });
  });

  $('ratingSheetBody').querySelectorAll('[data-tip]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedTip = Number(btn.dataset.tip);
      $('ratingSheetBody').querySelectorAll('[data-tip]').forEach(b => b.classList.toggle('on', b === btn));
    });
  });

  $('ratingSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('ratingSheet'));
  $('ratingSheetBody').querySelector('#ratingSkip').addEventListener('click', () => {
    state.ratings[order.id] = { skipped: true, at: Date.now() };
    saveLocal();
    closeSheet('ratingSheet');
  });
  $('ratingSheetBody').querySelector('#ratingSubmit').addEventListener('click', async () => {
    if (!selectedStars) return toast('Pick a rating first', 'error');
    const tipAmount = selectedTip > 0 ? Math.round(subtotal * selectedTip / 100) : 0;
    state.ratings[order.id] = { stars: selectedStars, tip: tipAmount, at: Date.now() };
    saveLocal();
    closeSheet('ratingSheet');
    try {
      await api(`/api/orders/${encodeURIComponent(order.id)}/rate`, {
        method: 'POST',
        body: JSON.stringify({ stars: selectedStars, tip: tipAmount })
      });
      toast('Thank you');
    } catch {
      toast('Rating saved');
    }
  });

  openSheet('ratingSheet');
}

  switch (name) {
    case 'market':   renderMarket(); break;

/* ============================================================
   SSE
   ============================================================ */
function startSSE(){
  if (state.sse) try { state.sse.close(); } catch {}
  if (!state.token || !state.session) return;

  const es = new EventSource(`/api/stream/guest/${encodeURIComponent(state.token)}`);
  state.sse = es;

  es.addEventListener('orders', e => {
    try {
      const incoming = JSON.parse(e.data) || [];
      state.orders = incoming.filter(o => String(o.guest_session_id) === String(state.session.id));
      pickActive();
      renderActiveCard();
      if (state.tab === 'trip') renderTripPage();
      maybePromptRating();
    } catch {}
  });

  es.addEventListener('bookings', e => {
    try {
      const incoming = JSON.parse(e.data) || [];
      state.bookings = incoming.filter(b => String(b.guest_session_id) === String(state.session.id));
      pickActive();
      renderActiveCard();
      if (state.tab === 'trip') renderTripPage();
    } catch {}
  });

  es.addEventListener('kitchen', e => {
    try {
      const data = JSON.parse(e.data) || {};
      state.kitchenBusy = !!data.busy;
      if (data.message) state.hotel = { ...state.hotel, busy_message: data.message };
      if (state.tab === 'market') renderMarket();
    } catch {}
  });

  es.addEventListener('hello', () => { state.sseRetry = 0; });
  es.addEventListener('error', () => {
    try { es.close(); } catch {}
    state.sse = null;
    const delay = Math.min(30000, 2000 * Math.pow(2, state.sseRetry++));
    setTimeout(startSSE, delay);
  });
}

async function bootstrap(){
  loadLocal();

  if (!HOTEL_ID) return showFatal("No hotel specified. Please scan the QR code from your room.");

  state.context.mode = URL_MODE === 'table' ? 'table' : 'room';
  state.context.number = URL_ROOM;

  $('main').innerHTML = `
    <div class="welcome-hero">
      <div class="badge-icon"><div class="spinner" style="width:22px;height:22px;border-width:3px"></div></div>
      <h1>Loading</h1>
      <p>Just a moment.</p>
    </div>`;

  try {
    const res = await api(`/api/public/hotel/${encodeURIComponent(HOTEL_ID)}/bootstrap`);
    state.hotel = res.hotel;
    state.menu = res.menu || [];
    state.services = res.services || [];
    state.vendors = res.vendors || [];
    state.departments = res.departments || [];
    state.kitchenBusy = !!(state.hotel.kitchen_busy || state.hotel.is_busy);
    document.title = state.hotel.name + ' · GuestHub';
  } catch (e) {
    return showFatal("Could not load hotel: " + e.message);
  }

  renderContext();
  if (!state.context.number) return showNoRoom();

  let result;
  try { result = await tryAutoCheckIn(); }
  catch (e) { return showFatal("Check-in failed: " + e.message); }

  if (result.mode === 'blocked') return showCheckInRequired(result.error || t('hotelLocked'));

  renderApp();
  startSSE();
  refreshOrders();
  refreshBookings();

  if (result.mode === 'new') {
    showWelcomeSheet(state.session);
  } else if (result.mode === 'joined') {
    toast(`Welcome, ${state.session.guest_name || 'guest'}`);
  }
}

bootstrap();
</script>
</body>
</html>
