<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003580">
<title>GuestHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* =====================================================================
   Tokens — light blue Booking.com palette (matches hotel dashboard)
   ===================================================================== */
:root{
  --brand:#003580; --brand-2:#0071c2; --brand-3:#005999;
  --brand-soft:#ebf3ff; --brand-line:#d4e4f5;
  --yellow:#febb02; --yellow-soft:#fff6e0; --yellow-line:#f0dfa0; --yellow-ink:#7a5c00;
  --green:#008009; --green-soft:#e8f5e9; --green-line:#c3e6c4;
  --red:#d32f2f; --red-soft:#fdeaea; --red-line:#f4c5c5;
  --purple:#7c3aed; --purple-soft:#f3e8ff;
  --bg:#fff; --bg-subtle:#f5f7fa; --bg-muted:#f9fafb;
  --surface:#fff;
  --border:#e7e7e7; --border-2:#d9d9d9; --border-3:#c5c5c5;
  --text:#1a1a1a; --text-2:#595959; --text-3:#6f6f6f; --text-4:#8a8a8a;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --shadow-xs:0 1px 2px rgb(0 0 0/4%);
  --shadow-sm:0 1px 3px rgb(0 0 0/6%),0 1px 2px rgb(0 0 0/4%);
  --shadow-md:0 4px 12px rgb(0 0 0/8%),0 2px 4px rgb(0 0 0/4%);
  --shadow-lg:0 12px 32px rgb(0 0 0/10%),0 4px 8px rgb(0 0 0/4%);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}

*,*::before,*::after{ box-sizing:border-box; }
*{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font);
  font-size:14.5px; line-height:1.5; color:var(--text);
  background:var(--bg-subtle);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-feature-settings:'cv02','cv03','cv04','cv11';
  min-height:100vh;
  padding-bottom:calc(84px + var(--safe-b));
}
img,svg{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,select,textarea{ font:inherit; color:inherit; }
ul{ list-style:none; }
::selection{ background:var(--yellow); color:var(--text); }
:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; border-radius:4px; }
.icon{ display:inline-block; vertical-align:middle; flex-shrink:0; color:currentColor; }
.hidden{ display:none !important; }

/* =====================================================================
   Header
   ===================================================================== */
.app-header{
  position:sticky; top:0; z-index:100;
  background:var(--brand); color:#fff;
  border-bottom:1px solid rgb(255 255 255 / 10%);
}
.app-header-inner{
  max-width:720px; margin:auto;
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding:10px 16px; min-height:56px;
}
.brand{ display:flex; align-items:center; gap:9px; min-width:0; }
.brand-logo{
  display:grid; place-items:center;
  width:32px; height:32px; border-radius:8px;
  background:#fff; color:var(--brand);
  font-weight:800; font-size:15px;
  flex-shrink:0;
}
.brand-text{ min-width:0; }
.brand-title{
  font-size:14px; font-weight:600; letter-spacing:-.01em;
  color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-sub{
  font-size:11px; color:rgba(255,255,255,.7);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-top:1px;
}
.header-actions{ display:flex; gap:6px; align-items:center; flex-shrink:0; }
.icon-btn{
  width:34px; height:34px; border-radius:8px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:#fff; display:grid; place-items:center;
  position:relative;
}
.icon-btn:hover{ background:rgba(255,255,255,.18); }
.icon-btn .dot{
  position:absolute; top:6px; right:6px;
  width:7px; height:7px; border-radius:50%;
  background:var(--yellow); border:1.5px solid var(--brand);
  display:none;
}
.icon-btn.has-dot .dot{ display:block; }

/* =====================================================================
   Buttons
   ===================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px; height:40px; padding:0 14px;
  font-size:13.5px; font-weight:600; letter-spacing:-.01em;
  border-radius:var(--r-sm); border:1px solid transparent;
  white-space:nowrap;
  transition:all .15s ease;
}
.btn:active:not(:disabled){ transform:scale(.98); }
.btn:disabled{ opacity:.6; cursor:wait; }
.btn-primary{ background:var(--brand-2); color:#fff; box-shadow:var(--shadow-xs); }
.btn-primary:hover:not(:disabled){ background:var(--brand-3); }
.btn-secondary{ background:#fff; color:var(--text); border-color:var(--border-2); box-shadow:var(--shadow-xs); }
.btn-secondary:hover:not(:disabled){ background:var(--bg-subtle); border-color:var(--border-3); }
.btn-success{ background:var(--green); color:#fff; }
.btn-warn{ background:var(--yellow); color:#000; }
.btn-danger{ background:#fff; color:var(--red); border-color:var(--red-line); }
.btn-dark{ background:#fff; color:var(--text); border-color:var(--border-2); }
.btn-full{ width:100%; }
.btn-lg{ height:48px; padding:0 20px; font-size:15px; border-radius:var(--r); }
.btn-sm{ height:32px; padding:0 10px; font-size:12px; }
.btn .icon{ width:14px; height:14px; }

/* =====================================================================
   Container & layout
   ===================================================================== */
.container{ max-width:720px; margin:0 auto; padding:14px 14px 40px; }

/* =====================================================================
   Context banner
   ===================================================================== */
.context{
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(135deg,var(--brand),var(--brand-3));
  color:#fff; border-radius:var(--r-lg);
  padding:14px 16px; margin-bottom:14px;
  box-shadow:var(--shadow-md);
  position:relative; overflow:hidden;
}
.context::after{
  content:""; position:absolute; top:-40px; right:-40px;
  width:140px; height:140px; border-radius:50%;
  background:rgba(254,187,2,.12);
  pointer-events:none;
}
.context-icon{
  width:42px; height:42px; flex-shrink:0;
  border-radius:12px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
  display:grid; place-items:center;
  color:var(--yellow);
}
.context-icon .icon{ width:22px; height:22px; }
.context-body{ flex:1; min-width:0; }
.context-title{
  font-size:15px; font-weight:700; color:#fff;
  letter-spacing:-.01em;
  display:flex; align-items:center; gap:8px;
}
.context-sub{
  font-size:12px; color:rgba(255,255,255,.75);
  margin-top:3px; display:flex; align-items:center; gap:6px;
}
.context-sub .icon{ width:13px; height:13px; color:var(--yellow); }
.context-change{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);
  color:#fff; padding:7px 12px; border-radius:999px;
  font-size:11.5px; font-weight:600;
  flex-shrink:0;
}
.context-change:hover{ background:rgba(255,255,255,.22); }

/* =====================================================================
   Promo banner
   ===================================================================== */
.promo{
  display:none;
  background:var(--yellow-soft);
  border:1px solid var(--yellow-line);
  border-radius:var(--r);
  padding:12px 14px;
  margin-bottom:14px;
  color:var(--yellow-ink);
}
.promo.show{ display:block; }
.promo b{ display:block; font-size:13.5px; font-weight:700; }
.promo p{ font-size:12.5px; margin-top:3px; line-height:1.5; }

/* =====================================================================
   Section headers
   ===================================================================== */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; margin:20px 0 10px;
}
.section-head:first-child{ margin-top:0; }
.section-title{
  font-size:17px; font-weight:700; letter-spacing:-.02em;
  color:var(--text); display:flex; align-items:center; gap:8px;
}
.section-title .icon{ width:18px; height:18px; color:var(--brand-2); }
.section-link{
  font-size:12.5px; font-weight:600; color:var(--brand-2);
  display:inline-flex; align-items:center; gap:4px;
}

/* =====================================================================
   Active order card
   ===================================================================== */
.active-card{
  display:none;
  background:#fff;
  border:1px solid var(--border);
  border-left:4px solid var(--brand-2);
  border-radius:var(--r-lg);
  padding:16px 18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  animation:slideDown .3s ease;
}
.active-card.show{ display:block; }
.active-card.status-completed{ border-left-color:var(--green); }
.active-card.status-cancelled{ border-left-color:var(--red); }
@keyframes slideDown{
  from{ opacity:0; transform:translateY(-8px); }
  to{ opacity:1; transform:translateY(0); }
}
.active-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; margin-bottom:8px;
}
.active-title{
  font-size:14.5px; font-weight:700; color:var(--text);
  letter-spacing:-.01em; line-height:1.35;
}
.active-ref{
  display:inline-block;
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  color:var(--brand-2); margin-top:2px;
  letter-spacing:.3px;
}
.badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 9px; border-radius:999px;
  font-size:10.5px; font-weight:600;
  border:1px solid transparent; white-space:nowrap;
}
.badge-blue{ background:var(--brand-soft); color:var(--brand-2); border-color:var(--brand-line); }
.badge-yellow{ background:var(--yellow-soft); color:var(--yellow-ink); border-color:var(--yellow-line); }
.badge-green{ background:var(--green-soft); color:var(--green); border-color:var(--green-line); }
.badge-red{ background:var(--red-soft); color:var(--red); border-color:var(--red-line); }
.badge-gray{ background:var(--bg-subtle); color:var(--text-3); border-color:var(--border); }
.badge-purple{ background:var(--purple-soft); color:var(--purple); }

.active-meta{
  display:flex; justify-content:space-between; gap:12px;
  padding:10px 0; border-top:1px solid var(--border);
  font-size:12.5px; color:var(--text-2);
}
.active-meta strong{ color:var(--text); font-weight:700; }

.progress{
  display:flex; gap:4px; margin-top:8px;
}
.progress .seg{
  flex:1; height:5px; border-radius:999px;
  background:var(--border);
  transition:background .3s ease;
}
.progress .seg.on{ background:var(--brand-2); }
.progress .seg.done{ background:var(--green); }

/* =====================================================================
   Quick actions grid
   ===================================================================== */
.quick{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:8px; margin-bottom:8px;
}
.quick-btn{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px 6px;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  font-size:11px; font-weight:600; color:var(--text);
  box-shadow:var(--shadow-xs);
  transition:all .15s ease;
}
.quick-btn:hover{ border-color:var(--brand-2); background:var(--brand-soft); }
.quick-btn:active{ transform:scale(.97); }
.quick-btn .icon{ width:20px; height:20px; color:var(--brand-2); }

/* =====================================================================
   Menu grid
   ===================================================================== */
.grid{
  display:grid; grid-template-columns:1fr;
  gap:10px;
}
@media(min-width:520px){ .grid{ grid-template-columns:1fr 1fr; } }

/* =====================================================================
   Category pills
   ===================================================================== */
.pills{
  display:flex; gap:6px; overflow-x:auto;
  padding-bottom:6px; margin:0 -14px 12px;
  padding-left:14px; padding-right:14px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.pills::-webkit-scrollbar{ display:none; }
.pill{
  flex:0 0 auto;
  padding:7px 14px; border-radius:999px;
  background:#fff; border:1px solid var(--border-2);
  font-size:12.5px; font-weight:600; color:var(--text-2);
  white-space:nowrap;
  transition:all .15s ease;
}
.pill:hover:not(.on){ border-color:var(--border-3); color:var(--text); }
.pill.on{ background:var(--brand-2); border-color:var(--brand-2); color:#fff; }

/* =====================================================================
   Menu / service / vendor cards
   ===================================================================== */
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:14px;
  display:flex; gap:12px;
  box-shadow:var(--shadow-xs);
  transition:all .15s ease;
  position:relative;
}
.card:hover{ border-color:var(--border-2); box-shadow:var(--shadow-sm); }
.card.clickable{ cursor:pointer; }
.card.clickable:active{ transform:scale(.99); }

.card-icon{
  width:56px; height:56px; flex-shrink:0;
  border-radius:12px; background:var(--bg-subtle);
  display:grid; place-items:center;
  font-size:26px;
  overflow:hidden;
}
.card-icon img{ width:100%; height:100%; object-fit:cover; }
.card-body{ flex:1; min-width:0; }
.card-name{
  font-size:14.5px; font-weight:700; color:var(--text);
  letter-spacing:-.01em; line-height:1.3;
}
.card-desc{
  font-size:12.5px; color:var(--text-3); margin-top:3px;
  line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-top:9px;
}
.price{
  font-size:14.5px; font-weight:700; color:var(--brand-2);
  font-variant-numeric:tabular-nums;
}
.price small{ font-size:11px; color:var(--text-3); font-weight:600; margin-left:4px; }

.add-btn{
  width:36px; height:36px; border-radius:10px;
  background:var(--brand-2); color:#fff;
  display:grid; place-items:center;
  flex-shrink:0; transition:all .15s ease;
  box-shadow:var(--shadow-xs);
}
.add-btn:hover{ background:var(--brand-3); }
.add-btn:active{ transform:scale(.92); }
.add-btn.has{ background:var(--brand-soft); color:var(--brand-2); border:1px solid var(--brand-line); }
.add-btn .icon{ width:18px; height:18px; }

.badge-float{
  position:absolute; top:10px; left:10px;
  background:var(--yellow); color:#000;
  font-size:9.5px; font-weight:700;
  padding:3px 8px; border-radius:999px;
  text-transform:uppercase; letter-spacing:.3px;
}

/* Vendor card */
.vendor-card{
  background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); padding:14px;
  box-shadow:var(--shadow-xs);
  transition:all .15s ease;
}
.vendor-card:hover{ border-color:var(--border-2); box-shadow:var(--shadow-sm); }
.vendor-head{
  display:flex; gap:12px; align-items:center;
  margin-bottom:10px;
}
.vendor-logo{
  width:48px; height:48px; border-radius:12px;
  background:var(--brand-soft); color:var(--brand-2);
  display:grid; place-items:center;
  font-size:22px; font-weight:800;
  flex-shrink:0;
}
.vendor-info{ flex:1; min-width:0; }
.vendor-name{
  font-size:14.5px; font-weight:700; color:var(--text);
  letter-spacing:-.01em;
}
.vendor-meta{
  font-size:11.5px; color:var(--text-3);
  margin-top:2px;
  display:flex; gap:8px; flex-wrap:wrap;
}
.vendor-services{
  display:flex; flex-wrap:wrap; gap:5px;
  margin-top:8px;
}
.vendor-tag{
  font-size:11px; padding:3px 9px;
  background:var(--bg-subtle); border:1px solid var(--border);
  border-radius:999px; color:var(--text-2); font-weight:500;
}
.vendor-actions{ display:flex; gap:6px; margin-top:12px; }
.vendor-actions .btn{ flex:1; }

/* =====================================================================
   Cart bar
   ===================================================================== */
.cart-bar{
  position:fixed; left:12px; right:12px;
  bottom:calc(74px + var(--safe-b));
  background:var(--brand);
  color:#fff; border-radius:var(--r-lg);
  padding:14px 18px;
  display:none; align-items:center; justify-content:space-between;
  gap:12px;
  box-shadow:0 12px 32px rgba(0,53,128,.28);
  z-index:95;
  animation:slideUp .25s ease;
}
.cart-bar.show{ display:flex; }
@keyframes slideUp{
  from{ opacity:0; transform:translateY(12px); }
  to{ opacity:1; transform:translateY(0); }
}
.cart-bar .info b{ display:block; font-size:14px; font-weight:700; }
.cart-bar .info small{ font-size:11.5px; color:rgba(255,255,255,.7); }
.cart-bar button{
  background:var(--yellow); color:#000;
  border:none; padding:10px 18px;
  border-radius:999px;
  font-weight:700; font-size:13px;
  display:inline-flex; align-items:center; gap:6px;
}
.cart-bar button:hover{ filter:brightness(.96); }

/* =====================================================================
   Bottom nav
   ===================================================================== */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex; justify-content:space-around;
  padding:8px 4px calc(8px + var(--safe-b));
  z-index:90;
  box-shadow:0 -4px 20px rgba(0,0,0,.04);
}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-4);
  font-size:10.5px; font-weight:600;
  padding:6px 8px;
  border-radius:var(--r);
  transition:all .15s ease;
  position:relative;
  min-width:56px;
}
.nav-btn .icon{ width:22px; height:22px; }
.nav-btn.on{ color:var(--brand-2); background:var(--brand-soft); }
.nav-btn .nav-dot{
  position:absolute; top:4px; right:14px;
  min-width:16px; height:16px; padding:0 4px;
  background:var(--red); color:#fff;
  font-size:9.5px; font-weight:700;
  border-radius:999px;
  display:grid; place-items:center;
  border:1.5px solid #fff;
}

/* =====================================================================
   Modals / sheets
   ===================================================================== */
.sheet{
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.5);
  display:none; align-items:flex-end;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.sheet.show{ display:flex; }
.sheet-body{
  background:#fff;
  width:100%; max-width:600px;
  margin:0 auto;
  max-height:92vh; overflow-y:auto;
  border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + var(--safe-b));
  animation:sheetUp .25s cubic-bezier(.3,1.3,.5,1);
}
@media(min-width:700px){
  .sheet{ align-items:center; padding:20px; }
  .sheet-body{ border-radius:16px; }
}
@keyframes sheetUp{
  from{ transform:translateY(100%); }
  to{ transform:translateY(0); }
}
.sheet-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px; margin-bottom:16px; padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.sheet-title{
  font-size:18px; font-weight:700; letter-spacing:-.02em;
  color:var(--text);
  display:flex; align-items:center; gap:8px;
}
.sheet-title .icon{ width:18px; height:18px; color:var(--brand-2); }
.sheet-sub{
  font-size:12.5px; color:var(--text-3); margin-top:4px; line-height:1.5;
}
.sheet-close{
  width:34px; height:34px; flex-shrink:0;
  border-radius:50%; background:var(--bg-subtle);
  border:1px solid var(--border);
  display:grid; place-items:center;
  color:var(--text-2);
}
.sheet-close:hover{ background:var(--bg-muted); }
.sheet-close .icon{ width:16px; height:16px; }

/* =====================================================================
   Cart items
   ===================================================================== */
.cart-line{
  display:flex; gap:12px; padding:12px 0;
  border-bottom:1px solid var(--border);
  align-items:center;
}
.cart-line-icon{
  width:48px; height:48px; border-radius:10px;
  background:var(--bg-subtle);
  display:grid; place-items:center;
  font-size:22px; flex-shrink:0;
}
.cart-line-body{ flex:1; min-width:0; }
.cart-line-name{ font-size:13.5px; font-weight:600; color:var(--text); }
.cart-line-price{ font-size:12px; color:var(--text-3); margin-top:2px; }
.qty{
  display:flex; align-items:center; gap:0;
  background:var(--bg-subtle); border:1px solid var(--border);
  border-radius:999px; padding:2px;
  flex-shrink:0;
}
.qty button{
  width:28px; height:28px;
  border-radius:50%; background:transparent;
  display:grid; place-items:center;
  color:var(--brand-2); font-weight:700;
  font-size:16px;
}
.qty button:hover{ background:#fff; }
.qty span{
  min-width:24px; text-align:center;
  font-weight:700; font-size:13px;
  font-variant-numeric:tabular-nums;
}

/* Totals */
.totals{
  padding:14px 0 0;
  display:flex; flex-direction:column; gap:6px;
}
.total-row{
  display:flex; justify-content:space-between;
  font-size:13.5px; color:var(--text-2);
}
.total-row.grand{
  font-weight:700; font-size:16px; color:var(--text);
  padding-top:10px; margin-top:6px;
  border-top:1px solid var(--border);
}

/* =====================================================================
   Payment card
   ===================================================================== */
.pay{
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:16px;
  margin-top:16px;
}
.pay-head{
  display:flex; align-items:center; gap:8px;
  margin-bottom:12px;
}
.pay-head .icon{ width:18px; height:18px; color:var(--brand-2); }
.pay-head b{ font-size:13.5px; font-weight:700; color:var(--text); }
.pay-rows{
  background:#fff; border:1px dashed var(--border-2);
  border-radius:var(--r); padding:12px;
}
.pay-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0; gap:10px;
}
.pay-row + .pay-row{ border-top:1px solid var(--border); }
.pay-row .label{
  font-size:10.5px; font-weight:600; color:var(--text-3);
  text-transform:uppercase; letter-spacing:.3px;
}
.pay-row .value{
  font-family:var(--mono); font-size:15px; font-weight:700;
  color:var(--text); letter-spacing:.3px;
}
.pay-copy{
  background:transparent; border:1px solid var(--border-2);
  border-radius:6px; padding:4px 8px;
  font-size:10.5px; font-weight:600; color:var(--brand-2);
  display:inline-flex; align-items:center; gap:4px;
}
.pay-copy:hover{ background:var(--brand-soft); border-color:var(--brand-2); }
.pay-copy .icon{ width:12px; height:12px; }

.pay-steps{
  margin-top:14px; padding:0 4px;
  counter-reset:step;
}
.pay-steps li{
  position:relative; padding-left:28px; margin-bottom:6px;
  font-size:12.5px; color:var(--text-2); line-height:1.5;
  counter-increment:step;
}
.pay-steps li::before{
  content:counter(step);
  position:absolute; left:0; top:0;
  width:18px; height:18px; border-radius:50%;
  background:var(--brand-2); color:#fff;
  font-size:10px; font-weight:700;
  display:grid; place-items:center;
}
.pay-steps li b{ color:var(--text); }

.pay-warn{
  background:var(--yellow-soft); border:1px solid var(--yellow-line);
  border-radius:var(--r); padding:12px;
  font-size:12.5px; color:var(--yellow-ink); line-height:1.5;
}

/* =====================================================================
   Form inputs
   ===================================================================== */
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:11.5px; font-weight:600;
  color:var(--text-2); margin-bottom:6px;
  letter-spacing:.3px; text-transform:uppercase;
}
.input, .textarea{
  width:100%; padding:12px 14px;
  background:#fff; border:1px solid var(--border-2);
  border-radius:var(--r-sm);
  font-size:14px; font-weight:500;
  outline:none; transition:all .15s ease;
}
.input:focus, .textarea:focus{
  border-color:var(--brand-2);
  box-shadow:0 0 0 3px var(--brand-soft);
}
.input::placeholder, .textarea::placeholder{ color:var(--text-4); }
.textarea{ min-height:70px; resize:vertical; font-family:inherit; }

.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* =====================================================================
   Slot picker
   ===================================================================== */
.slots{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
  gap:8px;
}
.slot{
  padding:10px 8px;
  background:#fff; border:1px solid var(--border-2);
  border-radius:var(--r-sm);
  text-align:center;
  font-size:12.5px; font-weight:600; color:var(--text-2);
  transition:all .15s ease;
}
.slot:hover:not(:disabled){ border-color:var(--brand-2); color:var(--brand-2); }
.slot.on{ background:var(--brand-2); border-color:var(--brand-2); color:#fff; }
.slot:disabled{ opacity:.35; cursor:not-allowed; text-decoration:line-through; }

/* =====================================================================
   Empty states
   ===================================================================== */
.empty{
  text-align:center; padding:48px 20px;
  color:var(--text-3); font-size:13.5px;
}
.empty-icon{
  width:52px; height:52px; margin:0 auto 12px;
  border-radius:12px; background:var(--bg-subtle);
  border:1px solid var(--border);
  display:grid; place-items:center; color:var(--text-4);
}
.empty-icon .icon{ width:22px; height:22px; }
.empty b{
  display:block; font-size:14.5px; font-weight:600;
  color:var(--text); margin-bottom:6px;
}

/* =====================================================================
   Skeleton
   ===================================================================== */
.skel{
  height:78px; border-radius:var(--r-lg);
  background:linear-gradient(90deg,#f0f0f0 0%,#e8e8e8 50%,#f0f0f0 100%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border:1px solid var(--border);
}
@keyframes shimmer{
  0%{ background-position:200% 0; }
  100%{ background-position:-200% 0; }
}

/* =====================================================================
   Toast
   ===================================================================== */
.toast{
  position:fixed; left:50%; bottom:120px;
  transform:translate(-50%,120%);
  background:#1a1a1a; color:#fff;
  padding:12px 18px; border-radius:999px;
  font-size:13px; font-weight:500;
  z-index:500;
  transition:transform .28s cubic-bezier(.3,1.3,.5,1);
  box-shadow:var(--shadow-lg);
  max-width:calc(100vw - 32px);
  display:flex; align-items:center; gap:8px;
}
.toast.show{ transform:translate(-50%,0); }
.toast.error{ background:var(--red); }
.toast.success{ background:#1a1a1a; }
.toast .icon{ width:16px; height:16px; flex-shrink:0; }

/* =====================================================================
   Offline bar
   ===================================================================== */
.offline{
  position:fixed; top:0; left:0; right:0;
  z-index:400;
  background:var(--red); color:#fff;
  text-align:center;
  padding:8px;
  font-size:12.5px; font-weight:600;
  transform:translateY(-100%);
  transition:transform .3s ease;
}
.offline.show{ transform:translateY(0); }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>

const URL_MODE = params.get('mode') || (params.get('table') ? 'table' : 'room');

/* ============================================================
   UTILS
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const money = v => 'Ksh ' + Number(v || 0).toLocaleString();

const cleanPhone = v => {
  const d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('254')) return d;
  if (d.startsWith('0')) return '254' + d.slice(1);
  return d;
};

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  let json = {};
  try { json = await res.json(); } catch {}
  if (!res.ok || json.ok === false) throw new Error(json.error || ('HTTP ' + res.status));
  return json;
}

let toastTimer = null;
function toast(msg, kind = 'success') {
  const el = $('toast');
  el.className = 'toast ' + kind;
  el.innerHTML = (kind === 'error' ? ICON.alert : ICON.check) + '<span>' + esc(msg) + '</span>';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function statusBadge(status) {
  const s = String(status || '').toLowerCase();
  const map = {
    pending:    ['badge-yellow', 'Pending'],
    new:        ['badge-yellow', 'New'],
    accepted:   ['badge-blue',   'Accepted'],
    preparing:  ['badge-blue',   'Preparing'],
    on_the_way: ['badge-purple', 'On the way'],
    completed:  ['badge-green',  'Completed'],
    cancelled:  ['badge-red',    'Cancelled'],
    requested:  ['badge-yellow', 'Requested'],
    confirmed:  ['badge-blue',   'Confirmed'],
    declined:   ['badge-red',    'Declined']
  };
  const [cls, label] = map[s] || ['badge-gray', s.toUpperCase()];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function relativeTime(iso) {
  if (!iso) return '';
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const s = Math.floor(diff / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveLocal() {
  try {
    localStorage.setItem('gh_guest_ctx', JSON.stringify(state.context));
    if (state.token) localStorage.setItem('gh_guest_token', state.token);
    localStorage.setItem('gh_guest_cart_' + HOTEL_ID, JSON.stringify(state.cart));
  } catch {}
}
function loadLocal() {
  try {
    const ctx = localStorage.getItem('gh_guest_ctx');
    if (ctx) state.context = { ...state.context, ...JSON.parse(ctx) };
    state.token = localStorage.getItem('gh_guest_token') || null;
    const cart = localStorage.getItem('gh_guest_cart_' + HOTEL_ID);
    if (cart) state.cart = JSON.parse(cart) || [];
  } catch {}
}

$('saveContextBtn').addEventListener('click', async () => {
  const num = $('contextInput').value.trim();
  const name = $('guestNameInput').value.trim();
  const phone = $('guestPhoneInput').value.trim();

  if (!num) return toast('Enter a room or table number', 'error');
  if (!state.session || !state.session.guest_name) {
    if (!name) return toast('Please add your name', 'error');
    if (!phone) return toast('Please add your phone', 'error');

  try {

        guest_phone: phone || state.session?.guest_phone,
        mode: state.context.mode,
        number: num
      })
    });
    state.session = res.session;
    state.token = res.token;
    saveLocal();
    closeSheet('contextSheet');
    renderContext();
    startSSE();

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function bootstrap() {
  if (!HOTEL_ID) {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.alert}</div>
        <b>No hotel specified</b>
        <p>Please scan the QR code from your room.</p>
      </div>`;
    return;
  }

  // Skeleton
  $('popularGrid').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  $('menuGrid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

  try {
    const res = await api(`/api/public/hotel/${encodeURIComponent(HOTEL_ID)}/bootstrap`);
    state.hotel = res.hotel;
    state.menu = res.menu || [];
    state.services = res.services || [];
    state.vendors = res.vendors || [];
    state.departments = res.departments || [];

    document.title = state.hotel.name + ' · GuestHub';
    $('brandLogo').textContent = (state.hotel.name || 'G')[0].toUpperCase();

    // Promo
    if (state.hotel.promo_title) {
      $('promoTitle').textContent = state.hotel.promo_title;
      $('promoText').textContent = state.hotel.promo_text || '';
      $('promoBanner').classList.add('show');
    }

    // Prefill context from URL
    if (URL_ROOM && !state.context.number) {
      state.context.mode = URL_MODE === 'table' ? 'table' : 'room';
      state.context.number = URL_ROOM;
    }
    saveLocal();
    renderContext();

    // Session — if we don't have name+phone yet, open the sheet
    if (state.token) {
      try {
        const me = await api('/api/guest/me');
        state.session = me.session;
        if (!state.session.guest_name || !state.session.guest_phone) openContextSheet();
        else startSSE();
      } catch {
        state.token = null;
        openContextSheet();
      }
    } else {
      openContextSheet();
    }

    // Render all views
    renderPopular();
    renderMenuPills();
    renderMenu();
    renderServices();
    renderVendorPills();
    renderVendors();
    renderCartBar();
    refreshOrders();
    refreshBookings();

  } catch (e) {
    $('main').innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.alert}</div>
        <b>Could not load hotel</b>
        <p>${esc(e.message)}</p>
      </div>`;
  }
}

/* ============================================================

   ============================================================ */
function menuCategories() {
  const set = new Map();
  state.menu.forEach(i => {
    const c = i.category || 'Menu';
    if (!set.has(c)) set.set(c, c);
  });
  return ['all', ...set.keys()];
}

function renderMenuPills() {
  const cats = menuCategories();
  $('menuPills').innerHTML = cats.map(c => `
    <button class="pill ${state.menuFilter === c ? 'on' : ''}" data-mcat="${esc(c)}">
      ${c === 'all' ? 'All' : esc(c)}
    </button>
  `).join('');
  $('menuPills').querySelectorAll('[data-mcat]').forEach(b => {
    b.addEventListener('click', () => {
      state.menuFilter = b.dataset.mcat;
      renderMenuPills();
      renderMenu();
    });
  });
}

function menuCard(item) {
  const qty = state.cart.find(l => l.id === item.id)?.qty || 0;
  return `
    <div class="card clickable" data-item-id="${esc(item.id)}">
      <div class="card-icon">${item.icon || '🍽️'}</div>
      <div class="card-body">
        <div class="card-name">${esc(item.name)}</div>
        ${item.desc ? `<div class="card-desc">${esc(item.desc)}</div>` : ''}
        <div class="card-row">
          <span class="price">${money(item.price)}</span>
          <button class="add-btn ${qty > 0 ? 'has' : ''}" data-add="${esc(item.id)}" aria-label="Add">
            ${qty > 0 ? ICON.check : ICON.plus}
          </button>

      </div>

}

function renderMenu() {
  const list = state.menuFilter === 'all'
    ? state.menu
    : state.menu.filter(i => (i.category || 'Menu') === state.menuFilter);

  $('menuGrid').innerHTML = list.length
    ? list.map(menuCard).join('')
    : '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">' + ICON.cart + '</div><b>No items</b><p>Try a different category.</p></div>';

  attachMenuHandlers($('menuGrid'));
}

function attachMenuHandlers(root) {
  root.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      addToCart(btn.dataset.add);
    });

      openItemDetail(card.dataset.itemId);

/* ============================================================
   CART
   ============================================================ */
function addToCart(id) {
  const item = state.menu.find(i => String(i.id) === String(id));
  if (!item) return;
  const line = state.cart.find(l => l.id === id);
  if (line) line.qty += 1;
  else state.cart.push({ id: item.id, name: item.name, price: Number(item.price) || 0, icon: item.icon || '🍽️', qty: 1, notes: '' });
  saveLocal();
  renderCartBar();
  refreshCurrentView();
  toast(item.name + ' added');
}

function setCartLine(id, qty, notes) {
  const item = state.menu.find(i => String(i.id) === String(id));
  if (!item) return;
  state.cart = state.cart.filter(l => l.id !== id);
  if (qty > 0) {
    state.cart.push({
      id: item.id, name: item.name, price: Number(item.price) || 0,
      icon: item.icon || '🍽️', qty, notes: notes || ''
    });
  }
  saveLocal();
  renderCartBar();
  refreshCurrentView();
}

function removeFromCart(id) { setCartLine(id, 0, ''); }
function updateQty(id, delta) {
  const line = state.cart.find(l => l.id === id);
  if (!line) return;
  setCartLine(id, Math.max(0, line.qty + delta), line.notes);
}

function cartSubtotal() { return state.cart.reduce((s, l) => s + l.qty * (Number(l.price) || 0), 0); }
function cartCount() { return state.cart.reduce((s, l) => s + l.qty, 0); }

function renderCartBar() {
  const n = cartCount();
  const bar = $('cartBar');
  if (!n) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  $('cartCount').textContent = n + ' item' + (n > 1 ? 's' : '');
  $('cartTotal').textContent = money(cartSubtotal());
}

function renderCartSheet() {
  const box = $('cartItems');
  if (!state.cart.length) {
    box.innerHTML = '<div class="empty"><b>Your cart is empty</b></div>';
    $('cartTotals').innerHTML = '';
    return;
  }
  box.innerHTML = state.cart.map(l => `
    <div class="cart-line">
      <div class="cart-line-icon">${l.icon || '🍽️'}</div>
      <div class="cart-line-body">
        <div class="cart-line-name">${esc(l.name)}</div>
        <div class="cart-line-price">${money(l.price)} each${l.notes ? ' · ' + esc(l.notes) : ''}</div>
      </div>
      <div class="qty">
        <button data-qty-dec="${esc(l.id)}">−</button>
        <span>${l.qty}</span>
        <button data-qty-inc="${esc(l.id)}">+</button>
      </div>
    </div>
  `).join('');
  box.querySelectorAll('[data-qty-inc]').forEach(b =>
    b.addEventListener('click', () => updateQty(b.dataset.qtyInc, 1)));
  box.querySelectorAll('[data-qty-dec]').forEach(b =>
    b.addEventListener('click', () => updateQty(b.dataset.qtyDec, -1)));

  const sub = cartSubtotal();
  $('cartTotals').innerHTML = `
    <div class="total-row"><span>Subtotal</span><span>${money(sub)}</span></div>
    <div class="total-row grand"><span>Total</span><span>${money(sub)}</span></div>
  `;

  $('cartSub').textContent = state.context.number
    ? `${state.context.mode === 'table' ? 'Table' : 'Room'} ${state.context.number} · ${state.hotel?.name || ''}`
    : state.hotel?.name || '';
}

$('viewCartBtn').addEventListener('click', () => {
  if (!state.cart.length) return;
  renderCartSheet();
  openSheet('cartSheet');
});

$('placeOrderBtn').addEventListener('click', placeOrder);

/* ============================================================
   PLACE ORDER
   ============================================================ */
async function placeOrder() {
  if (!state.cart.length) return;
  if (!state.session) { openContextSheet(); return toast('Set your room first', 'error'); }

  const subtotal = cartSubtotal();
  const items = state.cart.map(l => ({
    id: l.id, name: l.name, price: l.price, qty: l.qty, notes: l.notes || ''
  }));

  const btn = $('placeOrderBtn');
  btn.disabled = true; btn.textContent = 'Placing…';

  try {
    const res = await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({
        hotel_id: HOTEL_ID,
        mode: state.context.mode,
        room_number: state.context.mode === 'room' ? state.context.number : null,
        table_number: state.context.mode === 'table' ? state.context.number : null,
        guest_name: state.session.guest_name,
        guest_phone: state.session.guest_phone,
        guest_session_id: state.session.id,
        service_title: items.map(i => i.qty + '× ' + i.name).join(', '),
        category: 'food',
        kind: 'food',
        amount: subtotal,
        total: subtotal,
        subtotal,
        details: items.filter(i => i.notes).map(i => i.name + ': ' + i.notes).join(' | '),
        items
      })
    });

    state.cart = [];
    saveLocal();
    renderCartBar();
    closeSheet('cartSheet');
    refreshCurrentView();

    showSuccess(res.order);
    refreshOrders();

  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Place order';
  }
}

/* ============================================================
   SUCCESS + PAYMENT

function showSuccess(order) {
  const p = state.hotel.payment || {};
  const isConfigured = p.configured;

  $('successSheetBody').innerHTML = `

          </div>
          <div class="pay-row">
            <span class="label">Account</span>
            <span class="value">${esc(acc)}</span>
            <button class="pay-copy" data-copy="${esc(acc)}">${ICON.copy} Copy</button>
          </div>
          <div class="pay-row">
            <span class="label">Amount</span>
            <span class="value">${money(amount)}</span>
          </div>
        </div>
        <ol class="pay-steps">
          <li>Open M-Pesa → <b>Lipa na M-Pesa</b> → <b>Pay Bill</b></li>
          <li>Business no: <b>${esc(p.paybill_number)}</b></li>
          <li>Account: <b>${esc(acc)}</b></li>
          <li>Amount: <b>${amount}</b> · Enter PIN</li>
        </ol>
      </div>`;
  }
  if (channel === 'till' && p.till_number) {
    return `
      <div class="pay">
        <div class="pay-head">${ICON.cart}<b>Pay via M-Pesa Till</b></div>
        <div class="pay-rows">
          <div class="pay-row">
            <span class="label">Till</span>
            <span class="value">${esc(p.till_number)}</span>
            <button class="pay-copy" data-copy="${esc(p.till_number)}">${ICON.copy} Copy</button>
          </div>
          <div class="pay-row">

            <span class="value">${money(amount)}</span>

        <ol class="pay-steps">
          <li>Open M-Pesa → <b>Lipa na M-Pesa</b> → <b>Buy Goods</b></li>
          <li>Till no: <b>${esc(p.till_number)}</b></li>

function attachCopyHandlers(root) {
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const old = btn.innerHTML;
        btn.innerHTML = ICON.check + ' Copied';
        setTimeout(() => btn.innerHTML = old, 1400);
      } catch { toast('Copy failed'); }
    });
  });
}

async function requestService(id) {
  const svc = state.services.find(s => String(s.id) === String(id));
  if (!svc) return;
  if (!state.session) { openContextSheet(); return toast('Set your room first', 'error'); }

  try {
    await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({
        hotel_id: HOTEL_ID,
        mode: state.context.mode,
        room_number: state.context.mode === 'room' ? state.context.number : null,
        table_number: state.context.mode === 'table' ? state.context.number : null,
        guest_name: state.session.guest_name,
        guest_phone: state.session.guest_phone,
        guest_session_id: state.session.id,
        service_title: svc.name,
        category: svc.category || 'service',
        kind: 'hotel_service',
        amount: svc.price || 0,
        total: svc.price || 0
      })
    });
    toast(svc.name + ' requested');
    refreshOrders();
    switchTab('orders');
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* ============================================================
   BOOKING SHEET
   ============================================================ */
async function openBookingSheet(vendorId) {
  const vendor = state.vendors.find(v => String(v.id) === String(vendorId));
  if (!vendor) return;
  if (!state.session) { openContextSheet(); return toast('Set your room first', 'error'); }

  const item = vendor.items?.[0];
  if (!item) return toast('Vendor has no services', 'error');

  const today = new Date();
  const dateStr = d => d.toISOString().slice(0, 10);

  const html = `
    <div class="sheet-head">
      <div>
        <div class="sheet-title">Book ${esc(vendor.name)}</div>
        <div class="sheet-sub">${esc(item.name)} · ${money(item.price)}</div>
      </div>
      <button class="sheet-close" data-close="bookingSheet">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="field">
      <label>Service</label>
      <select class="input" id="bkService">
        ${(vendor.items || []).map(i => `
          <option value="${esc(i.id)}" data-price="${i.price}">${esc(i.name)} — ${money(i.price)}</option>
        `).join('')}
      </select>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Date</label>
        <input type="date" class="input" id="bkDate" min="${dateStr(today)}" value="${dateStr(today)}">
      </div>
      <div class="field">
        <label>Guests</label>
        <input type="number" class="input" id="bkGuests" min="1" max="20" value="1">
      </div>
    </div>

    <div class="field">
      <label>Available time slots</label>
      <div id="bkSlots"><div class="empty" style="padding:20px"><b>Pick a date</b></div></div>
    </div>

    <div class="field">
      <label>Notes (optional)</label>
      <textarea class="textarea" id="bkNotes" placeholder="Any special requests?"></textarea>
    </div>

    <button class="btn btn-primary btn-full btn-lg" id="bkConfirm" disabled>
      Confirm booking
    </button>
  `;

  $('bookingSheetBody').innerHTML = html;
  $('bookingSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('bookingSheet'));

  let selectedSlot = null;

  async function loadSlots() {
    const date = $('bkDate').value;
    if (!date) return;
    $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>Loading slots…</b></div>';
    try {
      const res = await api(`/api/public/vendor/${encodeURIComponent(vendor.id)}/slots?date=${date}`);
      const slots = res.slots || [];
      if (!slots.length) {
        $('bkSlots').innerHTML = '<div class="empty" style="padding:20px"><b>No slots this day</b><p>Try another date.</p></div>';
        selectedSlot = null;
        updateConfirm();
        return;
      }
      $('bkSlots').innerHTML = `
        <div class="slots">
          ${slots.map(s => `<button class="slot" data-slot="${esc(s.start)}">${new Date(s.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</button>`).join('')}
        </div>
      `;
      $('bkSlots').querySelectorAll('[data-slot]').forEach(b => {
        b.addEventListener('click', () => {
          $('bkSlots').querySelectorAll('.slot').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
          selectedSlot = b.dataset.slot;
          updateConfirm();
        });
      });
    } catch (e) {
      $('bkSlots').innerHTML = `<div class="empty" style="padding:20px"><b>Could not load</b><p>${esc(e.message)}</p></div>`;
    }
  }

  function updateConfirm() {
    $('bkConfirm').disabled = !selectedSlot;
  }

  $('bkDate').addEventListener('change', loadSlots);
  $('bkConfirm').addEventListener('click', async () => {
    if (!selectedSlot) return;
    const sel = $('bkService');
    const opt = sel.options[sel.selectedIndex];
    const serviceId = sel.value;
    const serviceName = opt.textContent.split(' — ')[0];
    const price = Number(opt.dataset.price) || 0;
    const guests = Number($('bkGuests').value) || 1;
    const notes = $('bkNotes').value.trim();

    $('bkConfirm').disabled = true;
    $('bkConfirm').textContent = 'Booking…';
    try {
      const res = await api('/api/bookings', {
        method: 'POST',
        body: JSON.stringify({
          hotel_id: HOTEL_ID,
          vendor_id: vendor.id,
          service_id: serviceId,
          service_title: serviceName,
          scheduled_for: selectedSlot,
          duration_min: 60,
          guests_count: guests,
          guest_name: state.session.guest_name,
          guest_phone: state.session.guest_phone,
          room_number: state.context.mode === 'room' ? state.context.number : null,
          table_number: state.context.mode === 'table' ? state.context.number : null,
          guest_session_id: state.session.id,
          amount: price,
          notes
        })
      });
      closeSheet('bookingSheet');
      showBookingSuccess(res.booking);
      refreshBookings();
      switchTab('orders');
    } catch (e) {
      toast('Booking failed: ' + e.message, 'error');
      $('bkConfirm').disabled = false;
      $('bkConfirm').textContent = 'Confirm booking';
    }
  });

  openSheet('bookingSheet');
  loadSlots();
}

/* ============================================================
   ORDERS
   ============================================================ */
$('orderPills').querySelectorAll('[data-ofilter]').forEach(b => {
  b.addEventListener('click', () => {
    state.orderFilter = b.dataset.ofilter;
    $('orderPills').querySelectorAll('[data-ofilter]').forEach(x => x.classList.toggle('on', x === b));
    renderOrders();
  });
});

async function refreshOrders() {
  if (!state.token) return;
  try {
    const [orders, bookings] = await Promise.all([
      api('/api/guest/orders').then(r => r.orders || []).catch(() => []),
      api('/api/bookings/guest').then(r => r.bookings || []).catch(() => [])
    ]);
    state.orders = orders;
    state.bookings = bookings;
    pickActive();
    renderOrders();
    renderActiveCard();
  } catch {}
}

async function refreshBookings() {
  if (!state.token) return;
  try {
    const r = await api('/api/bookings/guest');
    state.bookings = r.bookings || [];
    pickActive();
    renderOrders();
    renderActiveCard();
  } catch {}
}

function pickActive() {
  state.activeOrder = state.orders.find(o => !['completed', 'cancelled'].includes(String(o.status || '').toLowerCase())) || null;
  state.activeBooking = state.bookings.find(b => !['completed', 'cancelled', 'declined'].includes(String(b.status || '').toLowerCase())) || null;

  const count = (state.activeOrder ? 1 : 0) + (state.activeBooking ? 1 : 0);
  const dot = $('ordersDot');
  if (dot) {
    dot.textContent = count;
    dot.classList.toggle('hidden', count === 0);
  }
}

function renderActiveCard() {
  const card = $('activeCard');
  const o = state.activeOrder;
  const b = state.activeBooking;
  const active = o || b;

  if (!active) { card.classList.remove('show'); return; }

  card.className = 'active-card show status-' + String(active.status || '').toLowerCase();

  if (o) {
    const steps = ['pending', 'accepted', 'preparing', 'on_the_way', 'completed'];
    const idx = steps.indexOf(String(o.status || '').toLowerCase());
    const progress = steps.map((_, i) => {
      const cls = i < idx ? 'done' : i === idx ? 'on' : '';
      return `<div class="seg ${cls}"></div>`;
    }).join('');

    card.innerHTML = `
      <div class="active-head">
        <div>
          <div class="active-title">${esc(o.service_title || 'Your order')}</div>
          <div class="active-ref">${esc(o.reference)}</div>
        </div>
        ${statusBadge(o.status)}
      </div>
      <div class="active-meta">
        <span>${ICON.clock} <strong>${relativeTime(o.created_at)}</strong></span>
        <span>Total <strong>${money(o.amount)}</strong></span>
      </div>
      <div class="progress">${progress}</div>
    `;
  } else {
    card.innerHTML = `
      <div class="active-head">
        <div>
          <div class="active-title">${esc(b.service_title || 'Booking')}</div>
          <div class="active-ref">${esc(b.reference)}</div>
        </div>
        ${statusBadge(b.status)}
      </div>
      <div class="active-meta">
        <span>${ICON.calendar} <strong>${new Date(b.scheduled_for).toLocaleString()}</strong></span>
        <span>Total <strong>${money(b.amount)}</strong></span>
      </div>
    `;
  }
}

function renderOrders() {
  const box = $('ordersList');
  const filter = state.orderFilter;

  let list = [];
  if (filter === 'active') {
    list = [
      ...state.orders.filter(o => !['completed', 'cancelled'].includes(String(o.status || '').toLowerCase())).map(o => ({ type: 'order', ...o })),
      ...state.bookings.filter(b => !['completed', 'cancelled', 'declined'].includes(String(b.status || '').toLowerCase())).map(b => ({ type: 'booking', ...b }))
    ];
  } else {
    list = [
      ...state.orders.filter(o => ['completed', 'cancelled'].includes(String(o.status || '').toLowerCase())).map(o => ({ type: 'order', ...o })),
      ...state.bookings.filter(b => ['completed', 'cancelled', 'declined'].includes(String(b.status || '').toLowerCase())).map(b => ({ type: 'booking', ...b }))
    ];
  }

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${ICON.cart}</div>
        <b>${filter === 'active' ? 'Nothing active' : 'No history yet'}</b>
        <p>${filter === 'active' ? 'Place an order or book a service to see it here.' : 'Completed orders will appear here.'}</p>
      </div>`;
    return;
  }

  box.innerHTML = list.map(x => orderRow(x)).join('');
}

function orderRow(x) {
  const isOrder = x.type === 'order';
  const when = isOrder ? x.created_at : x.scheduled_for;
  return `
    <div class="card" style="margin-bottom:10px">
      <div class="card-icon">${isOrder ? '🍽️' : '📅'}</div>
      <div class="card-body">
        <div class="card-name">${esc(x.service_title || 'Request')}</div>
        <div class="card-desc">${esc(x.reference)} · ${new Date(when).toLocaleString()}</div>
        <div class="card-row">
          <span class="price">${money(x.amount)}</span>
          ${statusBadge(x.status)}
        </div>
      </div>
    </div>`;
}

/* ============================================================
   TABS
   ============================================================ */
function switchTab(name) {
  state.tab = name;
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  const view = $('view-' + name);
  if (view) view.classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (name === 'orders') { refreshOrders(); refreshBookings(); }
}

document.querySelectorAll('.nav-btn').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});
document.querySelectorAll('[data-tab]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    switchTab(a.dataset.tab);
  });
});

function refreshCurrentView() {
  if (state.tab === 'home') renderPopular();
  else if (state.tab === 'menu') renderMenu();
  else if (state.tab === 'services') renderServices();
  else if (state.tab === 'vendors') renderVendors();
}

/* ============================================================
   SSE — real-time order + booking status
   ============================================================ */
function startSSE() {
  if (state.sse) try { state.sse.close(); } catch {}
  if (!state.token) return;

  const es = new EventSource(`/api/stream/guest/${encodeURIComponent(state.token)}`);
  state.sse = es;

  es.addEventListener('orders', e => {
    try {
      state.orders = JSON.parse(e.data) || [];
      pickActive();
      renderActiveCard();
      if (state.tab === 'orders') renderOrders();
    } catch {}
  });

  es.addEventListener('bookings', e => {
    try {
      state.bookings = JSON.parse(e.data) || [];
      pickActive();
      renderActiveCard();
      if (state.tab === 'orders') renderOrders();
    } catch {}
  });

  es.addEventListener('hello', () => { state.sseRetry = 0; });
  es.addEventListener('error', () => {
    try { es.close(); } catch {}
    state.sse = null;
    const delay = Math.min(30000, 2000 * Math.pow(2, state.sseRetry++));
    setTimeout(startSSE, delay);
  });
}

/* ============================================================
   HEADER ACTIONS
   ============================================================ */
$('langBtn').addEventListener('click', () => openSheet('langSheet'));
$('profileBtn').addEventListener('click', () => {
  if (!state.session) return openContextSheet();
  $('profileSheetBody').innerHTML = `
    <div class="sheet-head">
      <div>
        <div class="sheet-title">Your profile</div>
        <div class="sheet-sub">Update anytime</div>
      </div>
      <button class="sheet-close" data-close="profileSheet">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="field"><label>Name</label><input class="input" value="${esc(state.session.guest_name || '')}" disabled></div>
    <div class="field"><label>Phone</label><input class="input" value="${esc(state.session.guest_phone || '')}" disabled></div>
    <div class="field"><label>Hotel</label><input class="input" value="${esc(state.hotel?.name || '')}" disabled></div>
    <div class="field"><label>Current location</label><input class="input" value="${esc(state.context.mode === 'table' ? 'Table ' : 'Room ')}${esc(state.context.number || '')}" disabled></div>
    <button class="btn btn-primary btn-full" id="editContext">Change location</button>
  `;
  $('profileSheetBody').querySelector('.sheet-close').addEventListener('click', () => closeSheet('profileSheet'));
  $('profileSheetBody').querySelector('#editContext').addEventListener('click', () => {
    closeSheet('profileSheet');
    openContextSheet();
  });
  openSheet('profileSheet');
});

document.querySelectorAll('[data-lang]').forEach(b => {
  b.addEventListener('click', () => {
    const lang = b.dataset.lang;
    try { localStorage.setItem('gh_lang', lang); } catch {}
    document.documentElement.lang = lang;
    closeSheet('langSheet');
    toast('Language: ' + lang);
  });
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadLocal();
  renderContext();
  bootstrap();
  setInterval(renderActiveCard, 30000);
}

init();
</script>
