<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join GuestHub - Hotel Application</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0a;color:#fff;font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.signup-box{background:#1a1a1a;padding:35px;border-radius:15px;width:100%;max-width:480px;border:2px solid #B8860B}
h1{color:#DAA520;text-align:center;margin-bottom:10px;font-family:'Playfair Display'}
p.sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:25px}
input,select{width:100%;padding:14px;margin:10px 0;background:#333;border:1px solid #555;border-radius:8px;color:#fff;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;background:#00FF7F;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:15px;font-size:16px}
.success{color:#00FF7F;text-align:center;margin-top:15px;font-weight:bold}
.error{color:#FF4444;text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="signup-box">
<h1>🏨 Join GuestHub 9.0</h1>
<p class="sub">Fill the form. We will review and get back to you within 24hrs.</p>
<form onsubmit="signup(event)">
<input type="text" id="hotel_name" placeholder="Hotel Name e.g. Sirikwa Eldoret" required>
<select id="location" required><option value="">Select Location</option><option>Mombasa</option><option>Nairobi</option><option>Kisumu</option><option>Diani</option><option>Nakuru</option><option>Eldoret</option><option>Malindi</option><option>Watamu</option></select>
<select id="hotel_type" required><option value="">Hotel Type</option><option>5 Star</option><option>Beach</option><option>Safari</option><option>City</option><option>Resort</option></select>
<input type="email" id="email" placeholder="Manager Email" required>
<input type="tel" id="phone" placeholder="Phone e.g 0722xxxxxx" required>
<input type="password" id="password" placeholder="Create Password" minlength="6" required>
<button type="submit" id="btn">Submit Application</button>
</form>
<p class="success" id="msg"></p>
<p class="error" id="err"></p>
<div id="nextSteps" style="display:none;background:#0a2a14;border:1px solid #22c55e;padding:12px;border-radius:10px;margin-top:12px;font-size:13px"></div>
<p style="text-align:center;margin-top:15px"><a href="/" style="color:#B8860B;">← Back to Home</a> | <a href="/admin-login.html" style="color:#22c55e;">Admin Login</a></p>
</div>
<script>
async function signup(e){
 e.preventDefault();
 const msgEl=document.getElementById('msg'), errEl=document.getElementById('err'), btn=document.getElementById('btn'), next=document.getElementById('nextSteps');
 msgEl.innerText=''; errEl.innerText=''; next.style.display='none';
 btn.innerText='Sending...'; btn.disabled=true;
 const rawName=document.getElementById('hotel_name').value.trim();
 // FIX: Unique ID with random suffix to avoid collision Sirikwa -> PrideInn
 const baseId=rawName.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,12);
 const uniqueId=baseId+'-'+Math.floor(Math.random()*9000+1000);
 const payload={
  hotel_name: rawName,
  location: document.getElementById('location').value,
  hotel_type: document.getElementById('hotel_type').value,
  email: document.getElementById('email').value.trim().toLowerCase(),
  phone: document.getElementById('phone').value.trim(),
  password: document.getElementById('password').value,
  hotel_id: uniqueId,
  status: 'PENDING'
 };
 try{
  const res=await fetch('/api/hotels/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await res.json(); if(!res.ok) throw new Error(data.error||'Signup failed');
  msgEl.innerText='✅ Application sent! ID: '+uniqueId;
  next.style.display='block';
  next.innerHTML=`<b>Your Hotel ID:</b> ${uniqueId}<br><br>1. Admin will approve in <a href="/admin.html" style="color:#22c55e">Admin Dashboard</a><br>2. After approval, your Guest Page: <br><code style="color:#fbbf24">/guest.html?hotelId=${uniqueId}&room=101</code><br>3. QR Codes: <code style="color:#fbbf24">/qr-codes.html?hotelId=${uniqueId}</code>`;
  e.target.reset();
 }catch(error){ errEl.innerText='Error: '+error.message; }
 finally{ btn.innerText='Submit Application'; btn.disabled=false; }
}
</script>
</body></html>
