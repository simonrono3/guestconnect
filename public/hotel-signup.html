<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join GuestHub8.5 - Hotel Signup</title>
<style>
body{background:#0a0a0a; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
.signup-box{background:#1a1a1a; padding:30px; border-radius:15px; width:100%; max-width:450px; border:2px solid #B8860B;}
h1{color:#B8860B; text-align:center; margin-bottom:20px;}
input{width:100%; padding:12px; margin:10px 0; background:#333; border:1px solid #555; border-radius:8px; color:#fff; box-sizing:border-box;}
button{width:100%; padding:12px; background:#00FF7F; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px;}
.success{color:#00FF7F; text-align:center; margin-top:15px;}
</style>
</head>
<body>

<div class="signup-box">
  <h1>🏨 Join GuestHub8.5</h1>
  <form onsubmit="signup(event)">
    <input type="text" id="hotel_name" placeholder="Hotel Name" required>
    <input type="text" id="location" placeholder="Location e.g. Mombasa" required>
    <input type="email" id="email" placeholder="Manager Email" required>
    <input type="tel" id="phone" placeholder="Phone Number" required>
    <input type="password" id="password" placeholder="Create Password" required>
    <button type="submit">Submit Application</button>
  </form>
  <p class="success" id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://your-project.supabase.co'
const SUPABASE_KEY = 'your-anon-key-here'
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function signup(e){
  e.preventDefault();
  const { error } = await supabase.from('hotels').insert([{
    hotel_name: document.getElementById('hotel_name').value,
    location: document.getElementById('location').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value,
    status: 'PENDING' // Muhimu: Hii ndio inafanya iende kwa approval
  }]);
  
  if(error){ alert('Email tayari imetumika!') } 
  else {
    document.getElementById('msg').innerText = 'Application sent! We will review and email you within 24hrs ✅';
    e.target.reset();
  }
}
</script>
</body>
</html>
