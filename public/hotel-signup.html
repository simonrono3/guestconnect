<!DOCTYPE html>
<html>
<head>
  <title>Hotel GM Signup - GUESTHUB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background:#111; color:#fff; display:flex; justify-content:center; padding:20px; }
    .box { background:#222; padding:25px; border-radius:12px; width:100%; max-width:450px; }
    input, button { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; background:#333; color:#fff; }
    button { background:#FFD700; color:#000; font-weight:bold; cursor:pointer; font-size:16px; }
    button:hover { background:#FFC700; }
    label { font-size:12px; color:#aaa; text-align:left; display:block; margin-top:10px; }
    h2 { text-align:center; color:#FFD700; }
    h4 { color:#00FF7F; margin-top:15px; }
    hr { border-color:#333; margin:15px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🏨 Hotel GM Signup</h2>
    
    <label>Hotel Name</label>
    <input id="hotelName" placeholder="e.g PrideInn Paradise">

    <label>GM Full Name</label>
    <input id="gmName" placeholder="e.g John Doe">

    <label>GM Email</label>
    <input id="email" type="email" placeholder="gm@hotel.com">

    <label>Password</label>
    <input id="password" type="password" placeholder="Create Password">

    <label>Hotel Location</label>
    <input id="location" placeholder="e.g Nairobi, Mombasa">

    <hr>
    <h4>📱 Department WhatsApp Numbers</h4>
    <p style="font-size:11px; color:#aaa;">Weka namba za WhatsApp. Orders/requests zitatumwa hapa</p>
    
    <label>Room Service WhatsApp</label>
    <input id="wa_roomservice" placeholder="+2547XXXXXXXX">
    
    <label>Housekeeping WhatsApp</label>
    <input id="wa_housekeeping" placeholder="+2547XXXXXXXX">
    
    <label>Maintenance WhatsApp</label>
    <input id="wa_maintenance" placeholder="+2547XXXXXXXX">
    
    <label>Front Desk WhatsApp</label>
    <input id="wa_frontdesk" placeholder="+2547XXXXXXXX">

    <button onclick="signupHotel()">Create Hotel Account</button>
    <p style="text-align:center; font-size:14px;">Already have account? <a href="/hotel-login.html" style="color:#FFD700">Login Here</a></p>
  </div>

  <script>
  async function signupHotel() {
    const data = {
      hotel: document.getElementById('hotelName').value,
      gm: document.getElementById('gmName').value,
      email: document.getElementById('email').value,
      location: document.getElementById('location').value,
      wa_roomservice: document.getElementById('wa_roomservice').value,
      wa_housekeeping: document.getElementById('wa_housekeeping').value,
      wa_maintenance: document.getElementById('wa_maintenance').value,
      wa_frontdesk: document.getElementById('wa_frontdesk').value
    };
    
    if(!data.hotel || !data.email) {
      alert('Please fill Hotel Name and Email');
      return;
    }

    console.log('Saving Hotel:', data);
    alert('Hotel Account Created Successfully! \n\nNext: Login to add Menu, Rooms & Services');
    window.location.href = '/gm-dashboard.html';
  }
  </script>
</body>
</html>
