<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuestHub Partner Network</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>/* DESIGN YAKO YOTE NIME-KEEP */*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}:root{--gold:#fbbf24;--green:#22c55e;--dark:#020617}body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px 15px;background:radial-gradient(circle at top left,rgba(34,197,94,.12),transparent 30%),radial-gradient(circle at bottom right,rgba(34,197,94,.12),transparent 30%),linear-gradient(135deg,#01040b,#071426,#020617);color:white}.container{width:100%;max-width:900px}.card{background:rgba(8,15,35,.92);backdrop-filter:blur(15px);border:1px solid rgba(251,191,36,.25);border-radius:30px;padding:50px;box-shadow:0 20px 80px rgba(0,0,0,.6)}.logo{text-align:center;font-size:60px}.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:52px;font-weight:800;line-height:1.1}.hero h2{font-size:26px;color:var(--gold);margin-top:10px}.hero p{max-width:650px;margin:20px auto;color:#cbd5e1;line-height:1.8}.divider{width:220px;height:2px;background:linear-gradient(to right,transparent,var(--green),transparent);margin:25px auto}.form-group{margin-bottom:15px}input,select{width:100%;padding:18px;background:#081224;border:1px solid rgba(255,255,255,.08);border-radius:14px;color:white;font-size:15px;outline:none}input:focus,select:focus{border-color:var(--green)}button{width:100%;padding:18px;background:linear-gradient(135deg,#34d399,#22c55e);border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;color:#04120a;margin-top:8px}button:disabled{opacity:.6}.success{margin-top:15px;color:#22c55e;text-align:center;font-weight:600}.error{margin-top:15px;color:#ef4444;text-align:center;font-weight:600}.nextSteps{display:none;margin-top:20px;padding:18px;background:#052e16;border:1px solid #22c55e;border-radius:14px;line-height:1.8}.section-title{text-align:center;font-size:34px;font-weight:700;margin-top:40px;margin-bottom:20px;color:var(--gold)}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:20px;border-radius:16px;text-align:center}.feature .icon{font-size:32px;margin-bottom:10px}.footer{margin-top:40px;padding-top:25px;border-top:1px solid rgba(255,255,255,.08);text-align:center}.footer a{color:#22c55e;text-decoration:none;margin:0 12px}code{color:#fbbf24;word-break:break-all}@media(max-width:768px){.card{padding:28px}.hero h1{font-size:34px}.features{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container"><div class="card">
<div class="logo">🏨</div>
<div class="hero"><h1>GuestHub Partner Network</h1><h2>Africa's Smart Hospitality Platform</h2><p>Join hotels, resorts, apartments, safari camps building the future of guest experiences.</p><div class="divider"></div></div>

<form id="form" onsubmit="signup(event)">
<div class="form-group"><input id="hotel_name" placeholder="Hotel / Property Name" required></div>
<div class="form-group"><input id="manager_name" placeholder="Manager Full Name" required></div>
<div class="form-group"><select id="location" required><option value="">Select Location</option><option>Nairobi</option><option>Mombasa</option><option>Kisumu</option><option>Eldoret</option><option>Nakuru</option><option>Diani</option><option>Watamu</option><option>Naivasha</option><option>Maasai Mara</option><option>Zanzibar</option><option>Kampala</option></select></div>
<div class="form-group"><select id="hotel_type" required><option value="">Property Type</option><option>Luxury Hotel</option><option>Resort</option><option>Beach Resort</option><option>Safari Lodge</option><option>Serviced Apartment</option><option>Boutique Hotel</option><option>Airbnb Operator</option></select></div>
<div class="form-group"><input type="number" id="rooms" placeholder="Number of Rooms" required></div>
<div class="form-group"><input type="url" id="website" placeholder="Website (Optional)"></div>
<div class="form-group"><input type="email" id="email" placeholder="Manager Email" required></div>
<div class="form-group"><input type="tel" id="phone" placeholder="Phone Number" required></div>
<div class="form-group"><input type="password" id="password" placeholder="Create Password (min 8 chars)" required minlength="8"></div>
<button type="submit" id="btn">🚀 Submit Partnership Application</button>
</form>

<div class="success" id="msg"></div><div class="error" id="err"></div><div class="nextSteps" id="nextSteps"></div>
<div class="footer"><a href="/">Home</a> | <a href="/admin.html">Admin Login</a><p>© 2026 GuestHub • Transforming Hospitality Across Africa</p></div>
</div></div>

<script>
async function signup(e){
 e.preventDefault();
 const btn=document.getElementById("btn"), msg=document.getElementById("msg"), err=document.getElementById("err"), next=document.getElementById("nextSteps");
 msg.textContent=""; err.textContent=""; next.style.display="none";
 btn.disabled=true; btn.textContent="⏳ Submitting to GuestHub...";
 try{
  const res = await fetch("/api/hotels/signup", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      hotel_name: document.getElementById("hotel_name").value.trim(),
      manager_name: document.getElementById("manager_name").value.trim(),
      location: document.getElementById("location").value,
      city: document.getElementById("location").value,
      hotel_type: document.getElementById("hotel_type").value,
      rooms: document.getElementById("rooms").value,
      website: document.getElementById("website").value.trim(),
      email: document.getElementById("email").value.trim().toLowerCase(),
      phone: document.getElementById("phone").value.trim(),
      password: document.getElementById("password").value
    })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || data.message || "Signup failed");
  msg.textContent = "✅ Application Submitted Successfully";
  next.style.display="block";
  next.innerHTML = `<h3>🎉 Welcome to GuestHub</h3><p><strong>Hotel ID:</strong> ${data.hotel_id}</p><p>Status: <b style="color:#fbbf24">PENDING APPROVAL</b></p><p>Our team will review within 24hrs. You will appear in Admin Dashboard for approval.</p><p><strong>Guest URL after approval:</strong><br><code>/guest.html?hotel=${data.hotel_id}&room=101</code></p>`;
  e.target.reset();
 }catch(ex){
  err.textContent = "❌ " + ex.message;
 }finally{
  btn.disabled=false; btn.textContent="🚀 Submit Partnership Application";
 }
}
</script>
</body>
</html>
