<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join GuestHub - Hotel Application</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0a; color:#fff; font-family:'Poppins',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
.signup-box{background:#1a1a1a; padding:35px; border-radius:15px; width:100%; max-width:480px; border:2px solid #B8860B;}
h1{color:#DAA520; text-align:center; margin-bottom:10px; font-family:'Playfair Display';}
p.sub{text-align:center; color:#aaa; font-size:13px; margin-bottom:25px;}
input, select{width:100%; padding:14px; margin:10px 0; background:#333; border:1px solid #555; border-radius:8px; color:#fff; box-sizing:border-box; font-size:15px;}
input:focus, select:focus{border-color:#B8860B; outline:none;}
button{width:100%; padding:14px; background:#00FF7F; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:15px; font-size:16px;}
button:hover{background:#00C851;}
button:disabled{background:#555; cursor:not-allowed;}
.success{color:#00FF7F; text-align:center; margin-top:15px; font-weight:bold;}
.error{color:#FF4444; text-align:center; margin-top:15px; font-weight:bold;}
</style>
</head>
<body>

<div class="signup-box">
  <h1>🏨 Join GuestHub8.5</h1>
  <p class="sub">Fill the form. We will review and get back to you within 24hrs.</p>
  <form onsubmit="signup(event)">
    <input type="text" id="hotel_name" placeholder="Hotel Name" required>
    <select id="location" required>
      <option value="">Select Location</option>
      <option>Mombasa</option>
      <option>Nairobi</option>
      <option>Kisumu</option>
      <option>Diani</option>
      <option>Nakuru</option>
    </select>
    <select id="hotel_type" required>
      <option value="">Hotel Type</option>
      <option>5 Star</option>
      <option>Beach</option>
      <option>Safari</option>
      <option>City</option>
    </select>
    <input type="email" id="email" placeholder="Manager Email" required>
    <input type="tel" id="phone" placeholder="Phone Number e.g 07xx xxx xxx" required>
    <input type="password" id="password" placeholder="Create Password" minlength="6" required>
    <button type="submit" id="btn">Submit Application</button>
  </form>
  <p class="success" id="msg"></p>
  <p class="error" id="err"></p>
  <p style="text-align:center; margin-top:15px;"><a href="/" style="color:#B8860B;">← Back to Home</a></p>
</div>

<script>
async function signup(e){
  e.preventDefault();
  const msgEl = document.getElementById('msg');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('btn');
  msgEl.innerText = '';
  errEl.innerText = '';
  btn.innerText = 'Sending...';
  btn.disabled = true;

  const payload = {
    hotel_name: document.getElementById('hotel_name').value.trim(),
    location: document.getElementById('location').value,
    hotel_type: document.getElementById('hotel_type').value,
    email: document.getElementById('email').value.trim().toLowerCase(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value,
    hotel_id: document.getElementById('hotel_name').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'')
  };

  try {
    const res = await fetch('/api/hotels/signup', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Signup failed');

    msgEl.innerText = 'Application sent! We will email you after approval ✅';
    e.target.reset();
  } catch(error){
    console.error(error);
    errEl.innerText = 'Error: ' + error.message;
  } finally {
    btn.innerText = 'Submit Application';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
