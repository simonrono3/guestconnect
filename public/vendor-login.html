<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>Vendor Login — GuestHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --lime:#C6FF00; --gold:#FFC61A; --bg:#060709;
    --line:rgba(255,255,255,.08); --muted:#8B95A5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,sans-serif;
    background:var(--bg);color:#fff;
    display:grid;place-items:center;padding:18px;
    -webkit-font-smoothing:antialiased;
  }
  .font-boss{font-family:Anton,sans-serif;letter-spacing:.01em}

  .glass{
    background:rgba(18,19,24,.88);
    backdrop-filter:blur(20px);
    border:1px solid var(--line);
    border-radius:20px;
  }

  .input{
    width:100%;
    background:#0A0A0A;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:13px 14px;
    color:#fff;font-size:14px;
    outline:none;
    transition:border-color .2s,box-shadow .2s;
    font-family:inherit;
  }
  .input:focus{
    border-color:var(--lime);
    box-shadow:0 0 0 3px rgba(198,255,0,.14);
  }
  .input::placeholder{color:#5b6473}

  .label{
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-top:14px;display:block;
  }

  .btn-primary{
    width:100%;
    height:52px;
    border:0;border-radius:999px;
    background:linear-gradient(90deg,#C6FF00,#A6E22E);
    color:#000;font-weight:900;font-size:14.5px;
    cursor:pointer;
    transition:filter .15s,transform .1s;
    font-family:inherit;
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.06)}
  .btn-primary:active:not(:disabled){transform:scale(.99)}
  .btn-primary:disabled{opacity:.6;cursor:wait}

  .btn-ghost{
    width:100%;height:44px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.04);
    color:#fff;font-weight:800;font-size:12.5px;
    cursor:pointer;transition:background .15s;
    font-family:inherit;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.08)}

  .notice{
    display:none;
    margin:14px 0;
    padding:12px 14px;
    border-radius:12px;
    font-size:12.5px;line-height:1.55;
    border:1px solid transparent;
  }
  .notice.success{
    display:block;
    background:rgba(198,255,0,.10);
    border-color:rgba(198,255,0,.35);
    color:#E8FFB0;
  }
  .notice.error{
    display:block;
    background:rgba(255,90,95,.10);
    border-color:rgba(255,90,95,.35);
    color:#FFD0D0;
  }
  .notice.pending{
    display:block;
    background:rgba(255,198,26,.10);
    border-color:rgba(255,198,26,.35);
    color:#FFE7A8;
  }

  .badge{
    padding:4px 10px;border-radius:999px;
    font-size:9.5px;font-weight:800;letter-spacing:.06em;
    background:rgba(255,255,255,.08);
    border:1px solid var(--line);
    color:#fff;
  }
  .badge.ok{background:var(--lime);color:#000;border-color:var(--lime)}
  .badge.warn{background:rgba(255,198,26,.15);color:var(--gold);border-color:rgba(255,198,26,.3)}

  .divider{height:1px;background:var(--line);margin:18px 0}

  .hint{
    font-size:11px;color:#8B95A5;
    text-align:center;line-height:1.6;
  }
  .hint a{color:var(--lime);text-decoration:none;font-weight:800}
  .hint a:hover{text-decoration:underline}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>

<div class="glass" style="width:100%;max-width:420px;padding:24px">

  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="font-boss text-[20px] text-[#FFD400]">GUESTHUB</span>
      <span class="text-[10px] tracking-widest text-white/40 font-bold">VENDOR LOGIN</span>
    </div>
    <span id="apiBadge" class="badge">…</span>
  </div>

  <h1 class="font-boss text-[28px] leading-[1.05] m-0 uppercase">
    Welcome <span class="text-[#C6FF00]">back</span>
  </h1>
  <p class="text-[12.5px] text-white/55 mt-2 mb-1 leading-relaxed">
    Sign in to see new jobs, manage services and update your Paybill / Till.
    Guests pay <strong class="text-white">direct to your M-Pesa</strong>.
  </p>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <form id="loginForm" novalidate>

    <label class="label" for="email">Email</label>
    <input id="email" name="email" type="email" class="input" required
           autocomplete="email" inputmode="email" placeholder="you@gmail.com">

    <label class="label" for="password">Password</label>
    <input id="password" name="password" type="password" class="input" required
           autocomplete="current-password" placeholder="Your password">

    <button type="submit" class="btn-primary mt-5" id="btn">
      🔓 Sign in
    </button>

  </form>

  <div class="divider"></div>

  <div class="hint">
    New vendor? <a href="/vendor-signup.html">Create an account →</a><br>
    <span style="display:block;margin-top:6px;color:#5b6473">
      Approval usually takes under 24 hours.
    </span>
  </div>

</div>

<script>
(() => {
  'use strict';

  const API = '/api';
  const $ = id => document.getElementById(id);
  const notice = $('notice');

  // ============================================================
  // NOTICE
  // ============================================================
  function show(msg, type = 'error') {
    notice.className = 'notice ' + type;
    notice.textContent = msg;
  }
  function clearNotice() {
    notice.className = 'notice';
    notice.textContent = '';
  }

  // ============================================================
  // HEALTH CHECK (retry for cold starts)
  // ============================================================
  async function checkHealth(attempt = 1) {
    const badge = $('apiBadge');
    try {
      const res = await fetch(`${API}/health`, { cache: 'no-store' });
      if (!res.ok) throw new Error('bad');
      const json = await res.json();
      badge.textContent = (json.os || 'GuestHub') + ' • LIVE';
      badge.className = 'badge ok';
    } catch {
      if (attempt < 6) {
        badge.textContent = `WAKING… (${attempt})`;
        badge.className = 'badge warn';
        setTimeout(() => checkHealth(attempt + 1), 1200 * attempt);
      } else {
        badge.textContent = 'OFFLINE';
        badge.className = 'badge warn';
      }
    }
  }

  // ============================================================
  // ALREADY LOGGED IN? (token present → straight to dashboard)
  // ============================================================
  (function redirectIfLoggedIn() {
    const token = localStorage.getItem('vendor_token');
    if (!token) return;

    // Verify the token is still valid before redirecting
    fetch(`${API}/vendor/me`, {
      headers: { Authorization: 'Bearer ' + token }
    })
      .then(r => {
        if (r.ok) {
          location.replace('/vendor-dashboard.html');
        } else {
          // Stale token — clean up
          localStorage.removeItem('vendor_token');
        }
      })
      .catch(() => { /* offline — let the user sign in manually */ });
  })();

  // ============================================================
  // LOGIN
  // ============================================================
  async function handleLogin(e) {
    e.preventDefault();
    clearNotice();

    const btn = $('btn');
    const email = $('email').value.trim().toLowerCase();
    const password = $('password').value;

    // ---- Client-side validation (mirrors server rules) ----
    if (!email) {
      return show('Please enter your email.');
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return show('That email doesn\'t look right.');
    }
    if (!password) {
      return show('Please enter your password.');
    }

    // ---- Send ----
    btn.disabled = true;
    btn.textContent = '⏳ Signing in…';

    try {
      const res = await fetch(`${API}/vendors/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const json = await res.json().catch(() => ({}));

      // ---- Handle each server response explicitly ----
      if (res.status === 401) {
        throw new Error(json.error || 'Wrong email or password.');
      }
      if (res.status === 404) {
        throw new Error(
          'No vendor found with that email. ' +
          'Did you sign up with a different address?'
        );
      }
      if (res.status === 403) {
        // Server returns "Vendor not approved. Status: pending" — show nicely
        const raw = json.error || 'Vendor not approved yet.';
        const statusMatch = raw.match(/Status:\s*(\w+)/i);
        const status = statusMatch ? statusMatch[1].toLowerCase() : 'pending';

        if (status === 'pending') {
          show(
            `⏳ Your application is still pending admin approval. ` +
            `We'll email you the moment it's approved — usually within 24 hours. ` +
            `Check back soon, or contact support if it's been longer.`,
            'pending'
          );
        } else if (status === 'rejected') {
          show(
            `❌ Your vendor application was not approved. ` +
            `If you think this is a mistake, please contact support.`,
            'error'
          );
        } else if (status === 'blocked') {
          show(
            `🚫 This account has been blocked. Contact support if you think this is a mistake.`,
            'error'
          );
        } else {
          show(raw, 'pending');
        }
        btn.disabled = false;
        btn.textContent = '🔓 Sign in';
        return;
      }
      if (!res.ok || json.ok === false) {
        throw new Error(json.error || `Login failed (${res.status})`);
      }

      // ---- Success ----
      const { token, vendor } = json;
      if (!token) throw new Error('Server did not return a session token.');

      // Store ONLY what the dashboard actually reads
      localStorage.setItem('vendor_token', token);

      show(
        `✅ Welcome back, ${vendor?.vendor_name || vendor?.full_name || 'vendor'}!`,
        'success'
      );
      btn.textContent = '✅ Redirecting…';

      setTimeout(() => {
        location.href = '/vendor-dashboard.html';
      }, 700);

    } catch (err) {
      show(err.message || 'Login failed. Please try again.');
      btn.disabled = false;
      btn.textContent = '🔓 Sign in';
    }
  }

  // ============================================================
  // WIRE UP
  // ============================================================
  $('loginForm').addEventListener('submit', handleLogin);

  // Enter key on email should jump to password
  $('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      $('password').focus();
    }
  });

  // Auto-fill email if user just came back from signup
  const lastEmail = localStorage.getItem('vendor_last_email');
  if (lastEmail) {
    $('email').value = lastEmail;
    $('password').focus();
    localStorage.removeItem('vendor_last_email');
  }

  checkHealth();
})();
</script>

</body>
</html>
