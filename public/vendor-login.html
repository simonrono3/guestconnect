<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Login V34.1 — Full Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#c6ff00;--bg:#080808;--card:#141414;--border:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px}
h1{font-family:Space Grotesk;font-size:28px;margin:0 0 6px}
.sub{color:#888;font-size:13px;margin-bottom:16px;line-height:1.4}
label{font-size:10px;font-weight:900;color:#777;letter-spacing:.1em;text-transform:uppercase;margin-top:14px;display:block}
input{width:100%;margin-top:6px;padding:14px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;color:#fff;font-size:14px}
input:focus{outline:none;border-color:var(--lime)}
.btn{width:100%;background:var(--lime);color:#000;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer}
.btn-dark{width:100%;background:#1a1a1a;color:#fff;padding:13px;border:1px solid #333;border-radius:14px;font-weight:800;font-size:13px;margin-top:10px;cursor:pointer}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.links a{color:var(--lime);text-decoration:none;font-weight:800}
.notice{display:none;margin-bottom:12px;padding:12px;border-radius:12px;font-size:13px}
.notice.error{display:block;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3);color:#ffdfe0}
.notice.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#d9ffe5}
</style>
</head>
<body>
<div class="box">
  <h1>VENDOR LOGIN V34.1</h1>
  <div class="sub">🌍 Full Flow: Signup → Admin Approves → GM Adds → Guest Sees<br>Till: <b style="color:var(--lime)">123456</b> — 15% hotel</div>
  <div id="notice" class="notice"></div>
  <form id="loginForm">
    <label>Email</label><input id="email" type="email" required placeholder="you@gmail.com">
    <label>Password</label><input id="password" type="password" required placeholder="12345678" value="12345678">
    <button class="btn" id="btn" type="submit">🔓 Sign In — Full Flow</button>
    <button type="button" class="btn-dark" id="resetBtn">🔑 Reset to 12345678</button>
  </form>
  <div class="links"><a id="forgot">Forgot?</a><a href="/vendor-signup.html">Join →</a></div>
</div>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const notice=$('notice');
  function show(m,t='error'){notice.className='notice '+t;notice.textContent=m;notice.style.display='block';}
  async function handleLogin(e){
    e.preventDefault();
    const btn=$('btn'); btn.disabled=true; btn.textContent='⏳ Checking...';
    try{
      const email=$('email').value.toLowerCase().trim();
      const password=$('password').value;
      const r=await fetch('/api/vendors/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const j=await r.json();
      if(!r.ok) throw new Error(j.error||'Login failed');
      if(j.pending){ show('⏳ PENDING — Admin bado haja-approve '+email+' — Nenda admin.html → Vendors → Approve','success'); btn.disabled=false; btn.textContent='🔓 Sign In'; return; }
      const v=j.vendor;
      localStorage.setItem('vendor_token', j.token);
      localStorage.setItem('vendor_email', email);
      localStorage.setItem('vendor', JSON.stringify(v));
      localStorage.setItem('vendor_id', v.id);
      show('✅ Welcome '+(v.vendor_name||v.full_name)+'!','success');
      setTimeout(()=>location.href='/vendor-dashboard.html',600);
    }catch(err){ show('Login failed: '+err.message); $('btn').disabled=false; $('btn').textContent='🔓 Sign In — Full Flow'; }
  }
  async function handleReset(e){
    if(e) e.preventDefault();
    const email=$('email').value.trim(); if(!email){ show('Weka email kwanza!'); return; }
    const btn=$('resetBtn'); btn.disabled=true; btn.textContent='⏳ Resetting...';
    try{
      const r=await fetch('/api/vendors/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:'12345678'})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error);
      show('✅ Password sasa ni 12345678 — Login sai','success'); $('password').value='12345678';
    }catch(err){ show('Reset failed: '+err.message); }
    finally{ btn.disabled=false; btn.textContent='🔑 Reset to 12345678'; }
  }
  $('loginForm').addEventListener('submit',handleLogin);
  $('resetBtn').addEventListener('click',handleReset);
  $('forgot').addEventListener('click',handleReset);
})();
</script>
</body>
</html>
