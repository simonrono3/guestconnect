<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Login - GuestHub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#c6ff00;--bg:#080808;--card:#141414;--border:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px}
.logo{font-family:Space Grotesk;font-weight:800;font-size:22px;text-align:center;margin-bottom:6px}.logo span{color:var(--lime)}
.sub{color:#888;font-size:12px;text-align:center;margin-bottom:18px;font-weight:700}
label{font-size:10px;font-weight:900;color:#777;letter-spacing:.1em;text-transform:uppercase;margin-top:12px;display:block}
input{width:100%;margin-top:6px;padding:14px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;color:#fff;font-size:14px}
input:focus{border-color:var(--lime);outline:none}
.btn{width:100%;background:var(--lime);color:#000;padding:15px;border:none;border-radius:12px;font-weight:900;font-size:15px;margin-top:16px;cursor:pointer}
.btn2{width:100%;background:#1f1f1f;color:#fff;padding:13px;border:1px solid #333;border-radius:12px;font-weight:800;font-size:13px;margin-top:10px;cursor:pointer}
.alert{padding:10px;border-radius:10px;font-size:12px;font-weight:700;margin-top:12px;display:none}
.alert.ok{background:#0a2a14;border:1px solid #14532d;color:#22c55e}
.alert.err{background:#2a0a0a;border:1px solid #7f1d1d;color:#ff6b6b}
</style>
</head>
<body>
<div class="box">
<div class="logo">GuestHub <span>Vendor</span></div>
<div class="sub">Login to get jobs from 5-star hotels</div>

<div id="msg" class="alert"></div>

<label>Email</label>
<input id="email" type="email" placeholder="kevin@gmail.com" required>

<label>Password</label>
<input id="password" type="password" placeholder="Your password" required>

<button class="btn" id="loginBtn" onclick="login()">🔓 Login → Dashboard</button>
<button class="btn2" onclick="location.href='/vendor-signup.html'">Don't have account? Join & Earn Ksh 80k</button>
<button class="btn2" style="border:none;background:transparent;color:#666" onclick="location.href='/'">← Back to Home</button>

<div style="margin-top:14px;text-align:center;color:#555;font-size:11px">
Demo: Use email you signed up with<br>
Status PENDING = can login but no jobs yet<br>
Status APPROVED = jobs flowing
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supa = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function show(t,ok){
 const m=document.getElementById('msg'); m.style.display='block'; m.innerText=t;
 m.className='alert '+(ok?'ok':'err');
}

async function login(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('password').value.trim();
 if(!email||!pass) return show('Enter email + password','');
 const btn=document.getElementById('loginBtn'); btn.innerText='⏳ Checking...'; btn.disabled=true;
 try{
  const {data,error} = await supa.from('vendors').select('*').eq('email',email).single();
  if(error || !data) throw new Error('Vendor not found. Sign up first.');
  if(data.password !== pass) throw new Error('Wrong password mkuu.');

  // Save session
  localStorage.setItem('vendor_email', data.email);
  localStorage.setItem('vendor_name', data.full_name);
  localStorage.setItem('vendor_city', data.city);
  localStorage.setItem('vendor_services', JSON.stringify(data.services||[]));
  localStorage.setItem('vendor_status', data.status);
  localStorage.setItem('vendor_id', data.id);

  show('✅ Welcome '+data.full_name+'! Status: '+data.status.toUpperCase()+' → Loading dashboard...',true);

  setTimeout(()=>location.href='/vendor-dashboard.html',800);

 }catch(err){
  show('❌ '+err.message,'');
  btn.innerText='🔓 Login → Dashboard'; btn.disabled=false;
 }
}

// Auto fill if just signed up
window.onload=()=>{
 const e=localStorage.getItem('vendor_email');
 if(e) document.getElementById('email').value=e;
}
</script>
</body>
</html>
