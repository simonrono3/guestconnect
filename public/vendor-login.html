<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Login - GuestHub WORLD - PERMANENT 15.4</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#c6ff00;--bg:#080808;--card:#141414;--border:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px}
h1{font-family:Space Grotesk;font-size:28px;margin:0 0 6px}
.sub{color:#888;font-size:13px;margin-bottom:16px;line-height:1.4}
label{font-size:10px;font-weight:900;color:#777;letter-spacing:.1em;text-transform:uppercase;margin-top:14px;display:block}
input{width:100%;margin-top:6px;padding:14px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;color:#fff;font-size:14px}
input:focus{outline:none;border-color:var(--lime)}
.btn{width:100%;background:var(--lime);color:#000;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer}
.btn:disabled{opacity:.6}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.links a{color:var(--lime);text-decoration:none;font-weight:800}
.notice{display:none;margin-bottom:12px;padding:12px;border-radius:12px;font-size:13px}
.notice.error{display:block;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3);color:#ffdfe0}
.notice.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#d9ffe5}
</style>
</head>
<body>
<div class="box">
  <h1>VENDOR LOGIN</h1>
  <div class="sub">🌍 WORLD • Use same email & password from signup<br>Till: <b style="color:var(--lime)">123456</b> - 15% commission</div>
  <div id="notice" class="notice"></div>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required placeholder="ronoo3@gmail.com">
    <label>Password</label>
    <input id="password" type="password" required placeholder="12345678">
    <button class="btn" id="btn" type="submit">🔓 Sign In - WORLD</button>
  </form>
  <div class="links">
    <a href="#" id="forgot">Forgot Password?</a>
    <a href="/vendor-signup.html">Join WORLD →</a>
  </div>
  <div style="margin-top:16px;background:#0a0a0a;border:1px dashed #333;border-radius:12px;padding:10px;font-size:11px;color:#777">
    <b style="color:#fff">Flow:</b> 1. Signup → 2. GM Approves in VENDORS tab → 3. Login with same password → Dashboard
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const notice=$('notice');
  function show(m,t='error'){notice.className='notice '+t;notice.textContent=m;notice.style.display='block';}
  
  async function handleLogin(e){
    e.preventDefault();
    const btn=$('btn');
    btn.disabled=true; btn.textContent='⏳ Checking...';
    try{
      const email=$('email').value.toLowerCase().trim();
      const password=$('password').value;
      const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      
      const {data,error}=await supa.auth.signInWithPassword({email,password});
      if(error){
        show('Login failed: '+error.message+'\n\nIf you signed up BEFORE fix (owner_id NULL), click Forgot Password? with '+email+' to set password 12345678');
        btn.disabled=false; btn.textContent='🔓 Sign In - WORLD';
        return;
      }
      
      // Check vendor status
      const {data:vendor, error:vErr}=await supa.from('vendors').select('status,full_name,email').eq('owner_id',data.user.id).single();
      
      if(vErr){
        // Try by email fallback (for old vendors without owner_id)
        const {data:byEmail}=await supa.from('vendors').select('status,full_name').eq('email',email).single();
        if(byEmail && byEmail.status==='pending'){
          show('Hi '+byEmail.full_name+' - Your account is PENDING GM approval. Nenda GM Dashboard → VENDORS → Approve '+email,'success');
          await supa.auth.signOut();
          btn.disabled=false; btn.textContent='🔓 Sign In - WORLD';
          return;
        }
      }

      if(vendor && vendor.status==='pending'){
        show('Hi '+vendor.full_name+' - Your account is still PENDING GM approval. GM will approve soon in VENDORS tab.','success');
        await supa.auth.signOut();
        btn.disabled=false; btn.textContent='🔓 Sign In - WORLD';
        return;
      }

      if(vendor && vendor.status==='rejected'){
        show('Sorry '+vendor.full_name+' - Account rejected. Contact GM.');
        await supa.auth.signOut();
        btn.disabled=false; btn.textContent='🔓 Sign In - WORLD';
        return;
      }

      show('✅ Welcome '+ (vendor?.full_name || email) +'! Redirecting to dashboard...','success');
      setTimeout(()=>location.href='/vendor-dashboard.html',800);
      
    }catch(err){
      show('Error: '+err.message);
      $('btn').disabled=false; $('btn').textContent='🔓 Sign In - WORLD';
    }
  }

  $('loginForm').addEventListener('submit',handleLogin);

  $('forgot').addEventListener('click',async (e)=>{
    e.preventDefault();
    const email=$('email').value.trim();
    if(!email){ show('Weka email yako kwanza juu!'); return; }
    const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo: location.origin+'/vendor-login.html'});
    if(error) show('Reset failed: '+error.message);
    else show('✅ Reset link sent to '+email+' - Check Gmail & set new password 12345678','success');
  });
})();
</script>
</body>
</html>
