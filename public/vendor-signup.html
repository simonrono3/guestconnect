<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuestHub Vendor WORLD V33 — FIXED</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--lime:#C6FF00;--gold:#FFC61A;--bg:#060709;--card:#121318}
*{box-sizing:border-box}body{font-family:Inter,sans-serif;background:var(--bg);color:#fff;padding-bottom:40px}
.font-boss{font-family:Anton,sans-serif}
.glass{background:rgba(18,19,24,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
.input{width:100%;background:#0A0A0A;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 14px;color:#fff;font-size:13px;outline:none}
.input:focus{border-color:var(--lime)}
.label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8B95A5;margin-top:14px;display:block}
.opt{border:1px solid #2A2A2A;background:#0A0A0A;border-radius:14px;padding:11px 12px;cursor:pointer;position:relative}
.opt.on{border-color:var(--lime);background:rgba(198,255,0,.12)}
.opt b{font-size:12px;display:block;padding-right:20px}.opt small{font-size:10px;color:#888;display:block;margin-top:2px}
.opt.check{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;border:1px solid #444;display:grid;place-items:center;font-size:10px}
.opt.on.check{background:var(--lime);color:#000;border-color:var(--lime)}
.paychip{padding:8px 12px;border-radius:999px;background:#0A0A0A;border:1px solid #2A2A2A;font-size:11px;font-weight:800;cursor:pointer}
.paychip.on{background:var(--lime);color:#000;border-color:var(--lime)}
.prog{height:5px;background:#1A1A1A;border-radius:999px;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--lime);width:15%;transition:.4s}
.notice{display:none;margin:12px 0;padding:12px;border-radius:12px;font-size:12px}.notice.success{display:block;background:rgba(198,255,0,.12);border:1px solid rgba(198,255,0,.3);color:#E8FFB0}.notice.error{display:block;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3);color:#FFD0D0}
</style>
</head>
<body>

<div class="min-h-screen lg:grid lg:grid-cols-[1.15fr_0.85fr]">
<div class="px-6 md:px-10 lg:px-14 py-7">
  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-3"><div class="font-boss text-[22px] text-[#FFD400]">GUESTHUB</div><span class="text-[10px] tracking-widest text-white/40 font-bold">VENDOR WORLD V33 FIXED</span><span id="apiBadge" class="ml-2 px-2.5 py-1 rounded-full bg-white/10 border border-white/10 text-[9px]">CONNECTING...</span></div>
    <a href="/" class="text-[11px] font-bold bg-white/10 px-4 py-2 rounded-full border border-white/10">← Home</a>
  </div>
  <h1 class="font-boss text-[38px] md:text-[48px] leading-[0.9] uppercase">EARN WITH<br><span class="text-[#FFC61A]">GUESTHUB WORLD</span></h1>
  <div class="prog"><i id="pbar"></i></div>
  <div id="notice" class="notice"></div>

  <form id="f" novalidate class="max-w-[680px]">
    <div class="glass rounded-2xl p-5 mt-4">
      <h3 class="font-boss text-[14px] text-[#C6FF00]">👤 BASIC INFO — DIANI HUB</h3>
      <label class="label">Full Name *</label><input id="full_name" class="input" required placeholder="Kevin Kipchumba">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div><label class="label">Phone *</label><input id="phone" class="input" required placeholder="0722..."></div>
        <div><label class="label">ID Number *</label><input id="id_number" class="input" required></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div><label class="label">Email *</label><input id="email" type="email" class="input" required placeholder="you@gmail.com"></div>
        <div><label class="label">Password min 8 *</label><input id="password" type="password" class="input" required placeholder="12345678" value="12345678"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div><label class="label">Country</label><select id="country" class="input"><option>Kenya</option><option>Tanzania</option><option>Uganda</option></select></div>
        <div><label class="label">Base City</label><select id="city" class="input"><option>Diani</option><option>Wasini Island</option><option>Mombasa</option><option>Nairobi</option></select></div>
      </div>
      <div><label class="label">Your Hub Location *</label><select id="location_hub" class="input" required><option value="Diani Beach" selected>Diani Beach (Main Hub)</option><option value="Wasini Island">Wasini Island</option><option value="SGR Mombasa Terminus">SGR Mombasa Terminus</option><option value="Moi Airport">Moi Airport</option></select></div>
    </div>

    <div class="glass rounded-2xl p-5 mt-4">
      <h3 class="font-boss text-[14px] text-[#FFC61A]">🏨 CHOOSE HOTELS *</h3>
      <div id="hotelList" class="mt-3 grid grid-cols-2 gap-2 max-h-[160px] overflow-auto p-3 rounded-xl bg-[#0A0A0A] border border-white/10 text-[11px]">Loading hotels...</div>
    </div>

    <div class="glass rounded-2xl p-5 mt-4"><h3 class="font-boss text-[14px] text-[#C6FF00]">🚕 TRANSPORT + TOURS</h3><div class="grid grid-cols-2 gap-2 mt-3" id="g1"></div></div>
    <div class="glass rounded-2xl p-5 mt-4"><h3 class="font-boss text-[14px] text-[#C6FF00]">🌍 WASINI + SAFARI</h3><div class="grid grid-cols-2 gap-2 mt-3" id="g2"></div></div>

    <div class="glass rounded-2xl p-5 mt-4">
      <h3 class="font-boss text-[14px]">⚙️ Service Details <span id="selCount" class="text-white/40 text-[11px]">0 selected</span></h3>
      <label class="label">Base Price (Guest sees)</label><input id="price" type="number" class="input" value="2500">
      <label class="label">Bio</label><textarea id="bio" class="input" placeholder="5yrs Diani expert"></textarea>
      <label class="label">M-Pesa Number *</label><input id="mpesa" class="input" required placeholder="0722...">
      <label class="label" style="text-transform:none;color:#ccc;display:flex;gap:8px"><input id="terms" type="checkbox" required style="width:auto"><span style="font-size:11px">I agree 85% me, 15% hotel via Till 123456</span></label>
      <button class="w-full h-[54px] rounded-full bg-gradient-to-r from-[#C6FF00] to-[#A6E22E] text-black font-black text-[15px] mt-4" type="submit" id="btn">🚀 Submit — Live in Guest App</button>
    </div>
  </form>
</div>

<div class="hidden lg:block bg-[#0A0A0A] border-l border-white/10 p-8">
  <div class="sticky top-8">
    <div class="bg-[#121318] border border-white/10 rounded-[20px] p-5"><div class="text-[10px] font-bold tracking-widest text-white/40">GUEST IN ROOM 101 SEES THIS</div><div id="guestPreview" class="mt-4 space-y-2"><div class="text-center py-10 text-[12px] text-white/30">Select services left</div></div></div>
  </div>
</div>
</div>

<script>
const API='/api'; const $=id=>document.getElementById(id);
const S={g1:[{id:'airport_taxi',t:'Airport Taxi',d:'Moi/Uka'},{id:'sgr_taxi',t:'SGR Transfer',d:'Miritini→Diani'},{id:'town_taxi',t:'Town Taxi',d:'Diani/Ukunda'},{id:'wasini_boat',t:'Wasini Boat',d:'Shimoni→Wasini'}],g2:[{id:'wasini_dolphin',t:'Wasini Dolphin Tour',d:'Full day'},{id:'shimba_hills',t:'Shimba Hills Safari',d:'Half day'},{id:'massage',t:'Massage',d:'In-room'},{id:'photography',t:'Photography',d:'Diani shots'}]};
let sel=[], allHotels=[];
function renderCats(){ Object.keys(S).forEach(g=>{const box=$(g); box.innerHTML=''; S[g].forEach(o=>{const div=document.createElement('div'); div.className='opt'; div.innerHTML=`<div class="check">✓</div><b>${o.t}</b><small>${o.d}</small>`; div.addEventListener('click',()=>toggle(o.id,div)); box.appendChild(div);});});}
function toggle(id,div){ if(sel.includes(id)){ sel=sel.filter(s=>s!==id); div.classList.remove('on'); }else{ sel.push(id); div.classList.add('on'); } $('selCount').textContent=sel.length+' selected'; $('pbar').style.width=Math.min(20+sel.length*15,100)+'%'; updatePreview(); }
function updatePreview(){ const vendor=$('full_name').value||'Your Biz'; const hub=$('location_hub').value||'Diani'; const price=$('price').value||2500; let html=`<div class="text-[10px] text-[#C6FF00] font-bold mb-2">${vendor} • ${hub}</div>`; if(!sel.length) html+=`<div class="text-[11px] text-white/30 text-center py-6">Select services</div>`; else sel.forEach(id=>{ const f=[...S.g1,...S.g2].find(x=>x.id===id); html+=`<div class="flex gap-3 p-3 rounded-xl bg-[#0A0A0A] border border-white/10"><div class="flex-1"><div class="font-bold text-[12px]">${f.t}</div><div class="text-[11px] font-black text-[#C6FF00]">KSh ${price}</div></div><div class="text-[10px] bg-white text-black px-2 py-1 rounded-full h-fit font-bold">+ Add</div></div>`; }); $('guestPreview').innerHTML=html; }
async function loadHotels(){ try{ const r=await fetch(API+'/data'); const j=await r.json(); const hotels=j.hotels||[]; allHotels=hotels; if(hotels.length) $('hotelList').innerHTML=hotels.slice(0,20).map(h=>`<label class="flex items-center gap-2"><input type="checkbox" value="${h.hotel_id}" ${h.hotel_id==='BAOBAB'?'checked':''}> ${h.name||h.hotel_name}</label>`).join('')+`<label class="flex items-center gap-2 font-bold text-[#C6FF00]"><input type="checkbox" value="ALL" checked> ALL (Scale)</label>`; }catch{ $('hotelList').innerHTML=`<label><input type="checkbox" value="BAOBAB" checked> Baobab</label><label><input type="checkbox" value="ALL" checked> ALL</label>`; } }
async function checkHealth(){ try{ const r=await fetch(API+'/health'); const j=await r.json(); $('apiBadge').textContent=j.os+' • LIVE'; $('apiBadge').className='ml-2 px-2.5 py-1 rounded-full bg-[#C6FF00] text-black text-[10px] font-bold'; }catch{ $('apiBadge').textContent='WAKING...'; } }
checkHealth(); renderCats(); loadHotels();

async function handleSignup(e){
  e.preventDefault();
  const btn=$('btn'); const notice=$('notice');
  const show=(m,t='success')=>{ notice.className='notice '+t; notice.textContent=m; window.scrollTo({top:0,behavior:'smooth'}); };
  if(sel.length===0) return show('Select at least 1 service!','error');
  if(!$('terms').checked) return show('Kubali Terms','error');
  if($('password').value.length<8) return show('Password min 8','error');
  btn.disabled=true; btn.textContent='⏳ Creating...';

  try{
    const selectedHotels=[...document.querySelectorAll('#hotelList input:checked')].map(i=>i.value);
    if(!selectedHotels.length) throw new Error('Chagua at least 1 hotel');

    const payload={
      full_name: $('full_name').value.trim(),
      vendor_name: $('full_name').value.trim(),
      email: $('email').value.toLowerCase().trim(),
      password: $('password').value, // <— HII NDIO FIX KUBWA
      phone: $('phone').value.replace(/\D/g,''),
      id_number: $('id_number').value.trim(),
      country: $('country').value,
      city: $('city').value,
      location: $('location_hub').value,
      location_hub: $('location_hub').value,
      hotel_ids: selectedHotels,
      hotels: selectedHotels,
      category: sel[0]||'general',
      services: sel,
      price: Number($('price').value||2500),
      bio: $('bio').value.trim(),
      mpesa: $('mpesa').value.replace(/\D/g,''),
      payout_method: 'mpesa'
    };

    // === CALL BACKEND ONLY — HII ndio ina-save na password_hash ===
    const r=await fetch('/api/vendors/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Signup failed');

    show(`✅ SUCCESS ${payload.full_name}! Email ${payload.email} created — Now LIVE in ${selectedHotels.join(', ')} — GM will approve in admin.html → Vendors → Approve`,'success');
    btn.textContent='✅ Live — Go login';
    setTimeout(()=>location.href='/vendor-login.html',1800);

  }catch(err){
    show('Failed: '+err.message,'error');
    btn.disabled=false; btn.textContent='🚀 Submit — Live in Guest App';
  }
}
$('f').addEventListener('submit',handleSignup);
['full_name','location_hub','price'].forEach(id=>{ $(id).addEventListener('input',updatePreview); });
</script>
</body>
</html>
