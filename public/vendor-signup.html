<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Signup V34.1 — Full Flow OS</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/config.js"></script>
<style>
:root{--lime:#C6FF00;--gold:#FFC61A;--bg:#060709}
body{font-family:Inter,sans-serif;background:var(--bg);color:#fff}
.font-boss{font-family:Anton,sans-serif}
.glass{background:rgba(18,19,24,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
.input{width:100%;background:#0A0A0A;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 14px;color:#fff;font-size:13px;outline:none}
.input:focus{border-color:var(--lime)}
.opt{border:1px solid #2A2A2A;background:#0A0A0A;border-radius:14px;padding:11px 12px;cursor:pointer;position:relative}
.opt.on{border-color:var(--lime);background:rgba(198,255,0,.12)}
.paychip{padding:8px 12px;border-radius:999px;background:#0A0A0A;border:1px solid #2A2A2A;font-size:11px;font-weight:800;cursor:pointer}
.paychip.on{background:var(--lime);color:#000;border-color:var(--lime)}
.notice{display:none;margin:12px 0;padding:12px;border-radius:12px;font-size:12px}.notice.success{display:block;background:rgba(198,255,0,.12);border:1px solid rgba(198,255,0,.3);color:#E8FFB0}.notice.error{display:block;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3);color:#FFD0D0}
</style>
</head>
<body>
<div class="min-h-screen lg:grid lg:grid-cols-[1.15fr_0.85fr]">
<div class="px-6 md:px-10 py-7">
  <div class="flex justify-between items-center mb-6"><div class="font-boss text-[22px] text-[#FFD400]">GUESTHUB</div><a href="/" class="text-[11px] font-bold bg-white/10 px-4 py-2 rounded-full">← Home</a></div>
  <h1 class="font-boss text-[38px] leading-[0.9] uppercase">EARN WITH<br><span class="text-[#FFC61A]">GUESTHUB V34.1</span></h1>
  <p class="text-[12px] text-white/50 mt-2">Full Flow: You Signup → Admin Approves → GM Adds to Hotel → Guest Sees You Live</p>
  <div id="notice" class="notice"></div>
  <form id="f" class="max-w-[680px] mt-4">
    <div class="glass rounded-2xl p-5">
      <h3 class="font-boss text-[14px] text-[#C6FF00]">👤 BASIC INFO</h3>
      <label class="text-[10px] font-bold text-white/50">Full Name *</label><input id="full_name" class="input" required placeholder="Kenyon / Diani Taxi">
      <div class="grid grid-cols-2 gap-3 mt-2">
        <div><label class="text-[10px] font-bold text-white/50">Phone *</label><input id="phone" class="input" required placeholder="0700..."></div>
        <div><label class="text-[10px] font-bold text-white/50">ID *</label><input id="id_number" class="input" required placeholder="12345678"></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-2">
        <div><label class="text-[10px] font-bold text-white/50">Email *</label><input id="email" type="email" class="input" required placeholder="you@gmail.com"></div>
        <div><label class="text-[10px] font-bold text-white/50">Password 8+ *</label><input id="password" type="password" class="input" required value="12345678"></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-2">
        <div><label class="text-[10px] font-bold text-white/50">City</label><select id="city" class="input"><option>Diani</option><option>Wasini</option><option>Mombasa</option><option>Nairobi</option></select></div>
        <div><label class="text-[10px] font-bold text-white/50">Hub Location *</label><select id="location_hub" class="input"><option>Diani Beach</option><option>Wasini Island</option><option>SGR Mombasa</option><option>Moi Airport</option></select></div>
      </div>
    </div>

    <div class="glass rounded-2xl p-5 mt-4">
      <h3 class="font-boss text-[14px] text-[#FFC61A]">🏨 CHOOSE HOTELS</h3>
      <div id="hotelList" class="mt-3 grid grid-cols-2 gap-2 max-h-[160px] overflow-auto p-3 rounded-xl bg-[#0A0A0A] border border-white/10 text-[11px]">Loading...</div>
    </div>

    <div class="glass rounded-2xl p-5 mt-4"><h3 class="font-boss text-[14px] text-[#C6FF00]">🚕 SERVICES — SELECT AT LEAST 1</h3>
      <div class="grid grid-cols-2 gap-2 mt-3" id="servicesBox"></div>
      <div class="mt-3"><label class="text-[10px] font-bold text-white/50">Your Price (Guest sees)</label><input id="price" type="number" class="input" value="2500"></div>
    </div>

    <div class="glass rounded-2xl p-5 mt-4">
      <h3 class="font-boss text-[14px]">💸 PAYOUT</h3>
      <div class="flex gap-2 mt-2"><div class="paychip on" data-val="mpesa">M-PESA</div><div class="paychip" data-val="bank">Bank</div></div>
      <input type="hidden" id="payout_method" value="mpesa">
      <label class="text-[10px] font-bold text-white/50 mt-2 block">M-Pesa Number *</label><input id="mpesa" class="input" required placeholder="0700...">
      <label class="text-[10px] flex gap-2 mt-3"><input id="terms" type="checkbox" required><span>Agree 15% via Till 123456</span></label>
      <button class="w-full h-[54px] rounded-full bg-[#C6FF00] text-black font-black text-[15px] mt-4" type="submit" id="btn">🚀 Submit — Pending GM Approval</button>
    </div>
  </form>
</div>

<div class="hidden lg:block bg-[#0A0A0A] border-l border-white/10 p-8">
  <div class="sticky top-8">
    <div class="text-[11px] font-bold tracking-widest text-white/40">LIVE PREVIEW — GUEST ROOM 101 SEES</div>
    <div id="guestPreview" class="mt-4 space-y-2 bg-[#121318] border border-white/10 rounded-[20px] p-5 min-h-[200px]"></div>
    <a href="/guest.html?hotel=BAOBAB&room=101" class="mt-4 block text-center h-10 rounded-full bg-white text-black font-bold text-[12px] leading-10">→ View Guest App</a>
  </div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const SERVICES=[{id:'airport_taxi',t:'Airport Taxi'},{id:'sgr_taxi',t:'SGR Transfer'},{id:'wasini_dolphin',t:'Wasini Dolphin Tour'},{id:'massage',t:'Massage'},{id:'photography',t:'Photography'},{id:'laundry',t:'Laundry'},{id:'private_chef',t:'Private Chef'},{id:'car_hire',t:'Car Hire'}];
let sel=[];
function renderServices(){const box=$('servicesBox');SERVICES.forEach(s=>{const div=document.createElement('div');div.className='opt';div.innerHTML=`<b>${s.t}</b>`;div.onclick=()=>{if(sel.includes(s.id)){sel=sel.filter(x=>x!==s.id);div.classList.remove('on')}else{sel.push(s.id);div.classList.add('on')}updatePreview()};box.appendChild(div);})}
function updatePreview(){const name=$('full_name').value||'Your Business';const hub=$('location_hub').value;const price=$('price').value;let html=`<div class="text-[10px] text-[#C6FF00] font-bold">${name.toUpperCase()} • ${hub}</div>`;if(!sel.length)html+='<div class="text-[11px] text-white/30 py-6 text-center">Select services</div>';else sel.forEach(id=>{const f=SERVICES.find(x=>x.id===id);html+=`<div class="flex gap-3 p-3 rounded-xl bg-[#0A0A0A] border border-white/10 mt-2"><div class="w-10 h-10 rounded-xl bg-[#1A1C1F] grid place-items-center">✨</div><div><div class="font-bold text-[12px]">${f.t}</div><div class="text-[11px] font-black text-[#C6FF00]">KSh ${price}</div></div></div>`});$('guestPreview').innerHTML=html;}
async function loadHotels(){try{const r=await fetch('/api/data');const j=await r.json();const hotels=j.hotels||[];$('hotelList').innerHTML=hotels.slice(0,20).map(h=>`<label class="flex items-center gap-2"><input type="checkbox" value="${h.hotel_id||h.id}" ${h.hotel_id==='BAOBAB'?'checked':''}> ${h.hotel_name||h.name}</label>`).join('')+`<label class="flex gap-2 font-bold text-[#C6FF00]"><input type="checkbox" value="ALL" checked> ALL Hotels (Recommended)</label>`}catch{$('hotelList').innerHTML=`<label><input type="checkbox" value="BAOBAB" checked> Baobab</label><label><input type="checkbox" value="ALL" checked> ALL</label>`}document.querySelectorAll('#hotelList input').forEach(i=>i.addEventListener('change',updatePreview))}
renderServices();loadHotels();['full_name','location_hub','price'].forEach(id=>$(id).addEventListener('input',updatePreview));
document.querySelectorAll('.paychip').forEach(c=>c.addEventListener('click',function(){document.querySelectorAll('.paychip').forEach(x=>x.classList.remove('on'));this.classList.add('on');$('payout_method').value=this.dataset.val}));
$('f').addEventListener('submit',async(e)=>{
 e.preventDefault();const btn=$('btn');const notice=$('notice');btn.disabled=true;btn.textContent='⏳ Creating...';
 try{
  if(sel.length===0)throw new Error('Select at least 1 service');
  if(!$('terms').checked)throw new Error('Agree terms');
  const hotels=[...document.querySelectorAll('#hotelList input:checked')].map(i=>i.value);if(!hotels.length)throw new Error('Choose hotel');
  const payload={full_name:$('full_name').value.trim(),vendor_name:$('full_name').value.trim(),email:$('email').value.toLowerCase().trim(),password:$('password').value,phone:$('phone').value.replace(/\D/g,''),id_number:$('id_number').value,city:$('city').value,location:$('location_hub').value,location_hub:$('location_hub').value,hotel_ids:hotels,hotels,category:sel[0],services:sel,price:Number($('price').value||2500),bio:'Hub:'+$('location_hub').value,mpesa:$('mpesa').value.replace(/\D/g,''),payout_method:$('payout_method').value};
  const r=await fetch('/api/vendors/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error);
  notice.className='notice success';notice.style.display='block';notice.textContent=`✅ SUCCESS ${payload.full_name}! Pending GM approval. Now go login.`;
  btn.textContent='✅ Redirecting to Login...';setTimeout(()=>location.href='/vendor-login.html',2000);
 }catch(err){notice.className='notice error';notice.style.display='block';notice.textContent='Failed: '+err.message;btn.disabled=false;btn.textContent='🚀 Submit — Pending GM Approval';}
});
</script>
</body>
</html>
