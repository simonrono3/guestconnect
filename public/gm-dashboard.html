<!DOCTYPE html><html><head>
<title>GM Dashboard | GUESTHUB</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{background:#1A1A1A;color:#fff;font-family:'Inter';padding:30px}
h1{font-family:'Playfair Display';color:#FFD700;font-size:36px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:30px 0}
.stat{background:rgba(45,36,24,0.8);border:1px solid #FF6B35;padding:24px;border-radius:20px}
.stat h3{opacity:0.7;font-size:14px} .stat h2{color:#FFD700;font-size:32px;font-family:'Playfair Display'}
.green{color:#0F9D58}
.card{background:rgba(45,36,24,0.8);border:1px solid #FF6B35;padding:24px;border-radius:20px;margin:20px 0}
input,select{width:100%;padding:16px;background:#1A1A1A;border:1px solid #444;border-radius:12px;color:#fff;margin:8px 0;font-size:16px}
.btn{background:linear-gradient(135deg,#FF6B35,#0F9D58);color:#fff;border:none;padding:18px;width:100%;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}
.qr-box{text-align:center;padding:20px}
.qr-box img{background:#fff;padding:10px;border-radius:16px}
</style>
</head><body>
<script>
const urlParams = new URLSearchParams(window.location.search);
const hotelId = urlParams.get('hotelId') || localStorage.getItem('gm_hotelId') || 'demo';
if(hotelId === 'demo'){ alert('⚠️ Please login first'); window.location.href = '/hotel-login.html'; }
</script>

<h1>🏨 GM CONTROL CENTER</h1>
<div class="grid">
  <div class="stat"><h3>Food Revenue</h3><h2 class="green" id="food">KES 0</h2><small>100% Yours</small></div>
  <div class="stat"><h3>Vendor Commission</h3><h2 id="vendor">KES 0</h2><small>15% Our Share</small></div>
  <div class="stat"><h3>Orders Today</h3><h2 id="orders">0</h2></div>
  <div class="stat"><h3>Subscription</h3><h2 id="sub">KES 15,000</h2><small>/month</small></div>
</div>

<div class="card">
<h2 style="font-family:'Playfair Display'">➕ Add Menu / Service / Tour / Taxi</h2>
<form id="addForm">
<input name="name" placeholder="Item Name - e.g Nyama Choma" required>
<input name="price" type="number" placeholder="Price KES" required>
<input name="desc" placeholder="Description">
<input name="img" placeholder="Image URL">
<input name="dept_whatsapp" placeholder="Dept WhatsApp Group ID 2547...">
<select name="type">
  <option value="food">food - Room Service - 0% fee</option>
  <option value="service">service - Spa, Laundry - 0% fee</option>
  <option value="tour">tour - Safari, Activities - 15% fee</option>
  <option value="taxi">taxi - Airport, City - 15% fee</option>
</select>
<button class="btn">ADD ITEM</button>
</form></div>

<div class="card qr-box">
<h2 style="color:#0F9D58">📱 Your Hotel QR Code</h2>
<p>Print this and put it in every room. Guests scan to order.</p>
<div id="qrcode"></div>
<p style="font-size:12px;word-break:break-all" id="qrLink"></p>
<button class="btn" onclick="window.print()">🖨️ Print QR</button>
</div>

<h2>Recent Orders</h2><div id="ordersList"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const guestLink = `${window.location.origin}/guest.html?hotelId=${hotelId}`;
document.getElementById('qrLink').innerText = guestLink;
new QRCode(document.getElementById("qrcode"), {text: guestLink, width:200, height:200});

fetch('/api/gm/dashboard/'+hotelId).then(r=>r.json()).then(d=>{
  document.getElementById('food').innerText='KES '+d.foodRevenue.toLocaleString();
  document.getElementById('vendor').innerText='KES '+d.vendorRevenue.toLocaleString();
  document.getElementById('orders').innerText=d.orders.length;
  document.getElementById('ordersList').innerHTML = d.orders.slice(0,5).map(o=>
    `<div class="card">${o.guest_name} - ${o.hotel_items?.name} - KES ${o.hotel_items?.price} - <b>${o.status}</b></div>`
  ).join('');
});

document.getElementById('addForm').onsubmit=e=>{
  e.preventDefault();
  const formData = Object.fromEntries(new FormData(e.target));
  formData.hotel_id=hotelId;
  fetch('/api/gm/add-item',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)})
  .then(()=>{alert('✅ Item Added!'); location.reload();});
}
</script></body></html>
