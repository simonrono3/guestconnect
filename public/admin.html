<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin 10.1 - Unified Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--lime:#c6ff00;--gold:#fbbf24;--bg:#050505;--card:#111;--border:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;padding-bottom:30px}
header{position:sticky;top:0;z-index:50;background:#080808;border-bottom:2px solid var(--gold);padding:14px;display:flex;justify-content:space-between;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-family:Space Grotesk}.stat small{color:#888;font-size:9px;font-weight:900}
.stat.money{border-color:var(--lime);background:linear-gradient(135deg,#111,#1a1f00)}
.tabs{display:flex;gap:8px;padding:0 12px 12px;overflow:auto;position:sticky;top:56px;background:var(--bg);z-index:40}
.tab{white-space:nowrap;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:#fff;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:var(--lime);color:#000}
.section{padding:0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;padding:12px;margin-bottom:8px}
.btn{padding:9px 14px;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-size:11px}.btn-a{background:var(--lime);color:#000}.btn-g{background:var(--gold);color:#000}.btn-d{background:#1f1f1f;color:#fff;border:1px solid #333}
.input{width:100%;padding:12px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;margin-top:6px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.PENDING{background:#3a1f00;color:#ff9f1c}.APPROVED{background:#0a2a14;color:#22c55e}.BLOCKED{background:#3a0a0a;color:#ff4444}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header><div style="font-family:Space Grotesk;font-weight:800">👑 ADMIN 10.1 UNIFIED <span style="color:var(--lime)">• Supabase Native</span></div><div style="display:flex;gap:6px"><button class="btn btn-d" onclick="location.reload()">🔄</button><button class="btn btn-d" onclick="localStorage.clear();location.href='/hotel-login.html'">Logout</button></div></header>

<div class="statgrid">
<div class="stat money"><b id="s_comm">Ksh 0</b><small>💰 YOUR 15% COMM</small></div>
<div class="stat"><b id="s_hotels">0</b><small>🏨 HOTELS</small></div>
<div class="stat"><b id="s_pending">0</b><small>🚚 PENDING VENDORS</small></div>
<div class="stat"><b id="s_orders">0</b><small>🔔 NEW ORDERS</small></div>
<div class="stat"><b id="s_items">0</b><small>🍽️ MENU ITEMS</small></div>
<div class="stat"><b id="s_gmv">Ksh 0</b><small>💵 TOTAL GMV</small></div>
</div>

<div class="tabs">
<button class="tab active" onclick="tab('hotels',this)">🏨 Hotels</button>
<button class="tab" onclick="tab('vendors',this)">🚚 Vendors (<span id="c_v">0</span>)</button>
<button class="tab" onclick="tab('menu',this)">🍽️ Menu Builder</button>
<button class="tab" onclick="tab('dept',this)">🛎️ WA Departments</button>
<button class="tab" onclick="tab('orders',this)">🔔 Live Orders</button>
<button class="tab" onclick="tab('cash',this)">💸 Cash</button>
</div>

<div id="view-hotels" class="section"></div>
<div id="view-vendors" class="section" style="display:none"></div>
<div id="view-menu" class="section" style="display:none"></div>
<div id="view-dept" class="section" style="display:none"></div>
<div id="view-orders" class="section" style="display:none"></div>
<div id="view-cash" class="section" style="display:none"></div>

<script src="config.js"></script>
<script>
const supa = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let HOTELS=[], ITEMS=[];

async function init(){ loadHotels(); loadVendors(); loadOrders(); }

async function loadHotels(){
 const {data} = await supa.from('hotels').select('*').order('created_at',{ascending:false}).limit(100);
 HOTELS=data||[]; document.getElementById('s_hotels').innerText=HOTELS.length;
 const box=document.getElementById('view-hotels');
 box.innerHTML=`<div class=card><b>🏨 Hotels (${HOTELS.length})</b> - Impersonate to edit QR/Menu<br><input class=input id=hSearch placeholder="Search hotel, city, email" oninput="renderHotels()"></div><div id=hList></div>`;
 renderHotels();
 // fill menu selects
 const sel=document.getElementById('menuHotelSel'); if(sel){ sel.innerHTML=''; HOTELS.forEach(h=>sel.innerHTML+=`<option value="${h.id}">${h.name||h.hotel_name} - ${h.city}</option>`); }
}

function renderHotels(){
 const q=(document.getElementById('hSearch')?.value||'').toLowerCase();
 const list=HOTELS.filter(h=>`${h.name||''} ${h.city||''} ${h.email||''}`.toLowerCase().includes(q));
 document.getElementById('hList').innerHTML=list.map(h=>`
  <div class=row><div><b style=color:var(--gold)>${h.name||h.hotel_name}</b> <span class=badge APPROVED>${h.city||''}</span><br><small style=color:#888>ID: ${h.id} • ${h.email} • WA: ${h.whatsapp_front||'-'}<br>Link: /guest.html?hotel=${h.id}&room=101</small></div>
  <div style=display:flex;flex-direction:column;gap:6px><button class=btn btn-a onclick="impersonate('${h.email}')">Login as GM</button><button class=btn btn-d onclick="copyLink('${h.id}')">Copy QR Link</button><button class=btn btn-d onclick="deleteHotel('${h.id}')">Del</button></div></div>`).join('');
}

async function loadVendors(){
 const {data:pend} = await supa.from('vendors').select('*').eq('status','pending').order('created_at',{ascending:false});
 const {data:all} = await supa.from('vendors').select('*').order('created_at',{ascending:false}).limit(50);
 document.getElementById('s_pending').innerText=pend?.length||0; document.getElementById('c_v').innerText=pend?.length||0;
 const box=document.getElementById('view-vendors');
 box.innerHTML=`<div class=card style=border-color:var(--gold)><b>🚨 Pending (${pend?.length||0})</b></div>`+(pend||[]).map(v=>`
  <div class=row style=border-left:4px solid var(--gold)><div><b>${v.full_name}</b><br><small style=color:#888>${v.phone} • ${v.city} • ${(v.services||[]).join(', ')} • ${v.price}</small></div>
  <div style=display:flex;flex-direction:column;gap:6px><button class=btn btn-a onclick="approveV('${v.id}')">✅ Approve</button><button class=btn btn-d onclick="rejectV('${v.id}')">Reject</button></div></div>`).join('')+
 `<div class=card style=margin-top:12px><b>All Vendors</b></div>`+(all||[]).map(v=>`<div class=row><div><b>${v.full_name}</b> ${v.status}<br><small>${v.city}</small></div><button class=btn btn-d onclick="approveV('${v.id}')">Approve</button></div>`).join('');
}

async function loadMenuTab(){
 const box=document.getElementById('view-menu');
 box.innerHTML=`
 <div class=card style=border-color:var(--gold)><b>🍽️ Add Menu - Works with hotel_services table (text hotel_id)</b><br><small style=color:#888>Guest sees this instantly on QR scan</small><br><br>
 <select id=menuHotelSel class=input></select>
 <div class=grid2 style=margin-top:8px><select id=mCat class=input><option value=food>🍽️ Food</option><option value=taxi>🚕 Taxi</option><option value=tour>🌍 Tours</option><option value=spa>🧖 Spa</option><option value=media>📸 Media</option></select><input id=mPrice type=number class=input placeholder="Price 650"></div>
 <input id=mName class=input placeholder="Name e.g. Pilau Beef">
 <input id=mDesc class=input placeholder="Desc e.g. Hot in 15min to room">
 <button class=btn btn-g style=width:100%;margin-top:8px onclick="addMenu()">+ Add to Guest Dashboard</button>
 </div><div id=itemsList></div>`;
 loadHotels(); loadItems();
}

async function loadItems(){
 const {data} = await supa.from('hotel_services').select('*').order('created_at',{ascending:false}).limit(100);
 ITEMS=data||[]; document.getElementById('s_items').innerText=ITEMS.length;
 const box=document.getElementById('itemsList'); if(!box) return;
 box.innerHTML=ITEMS.map(i=>`<div class=row><div><b>${i.title}</b> - Ksh ${i.price} <br><small style=color:#888>${i.category} • Hotel: ${i.hotel_id?.slice(0,8)} • ${i.description||''}</small></div><button class=btn btn-d onclick="delItem('${i.id}')">🗑️</button></div>`).join('');
}

async function addMenu(){
 const hotel_id=document.getElementById('menuHotelSel').value; const title=document.getElementById('mName').value; const price=parseInt(document.getElementById('mPrice').value); const category=document.getElementById('mCat').value; const description=document.getElementById('mDesc').value;
 if(!hotel_id||!title||!price) return alert('Fill hotel, name, price');
 const {error}=await supa.from('hotel_services').insert([{hotel_id,title,price,category,description,active:true}]);
 if(error) return alert(error.message); alert('✅ Added! Guest QR now shows it'); loadItems();
}
async function delItem(id){ if(!confirm('Delete?')) return; await supa.from('hotel_services').delete().eq('id',id); loadItems(); }

async function loadOrders(){
 const {data} = await supa.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
 document.getElementById('s_orders').innerText=data?.filter(o=>o.status=='new').length||0;
 let gmv=0; data?.forEach(o=>gmv+=o.amount||0); document.getElementById('s_gmv').innerText='Ksh '+gmv.toLocaleString(); document.getElementById('s_comm').innerText='Ksh '+Math.floor(gmv*0.15).toLocaleString();
 const box=document.getElementById('view-orders'); if(!box) return;
 box.innerHTML=`<div class=card><b>🔔 Last 100 Orders - GMV Ksh ${gmv.toLocaleString()}</b></div>`+ (data||[]).map(o=>`<div class=row><div><b>Room ${o.room} • ${o.service_title||o.service}</b><br><small style=color:#888>${o.guest_name} • Ksh ${o.amount} • ${o.status} • Hotel ${o.hotel_id?.slice(0,8)}</small></div><small style=color:var(--lime)>Your 15%: ${Math.floor((o.amount||0)*0.15)}</small></div>`).join('');
}

async function loadDeptTab(){
 document.getElementById('view-dept').innerHTML=`
 <div class=card><b>🛎️ WA Departments (goes to hotels.whatsapp_*)</b><br><small style=color:#888>Set per hotel, Guest order routes to these</small><br><br>
 <select id=deptHotelSel class=input onchange="loadDeptVals()"></select>
 <div class=grid2 style=margin-top:10px>
 <div><label>🍽️ Kitchen</label><input id=wa_k class=input></div>
 <div><label>🧹 Housekeeping</label><input id=wa_h class=input></div>
 <div><label>🧺 Laundry</label><input id=wa_l class=input></div>
 <div><label>🧖 Spa</label><input id=wa_s class=input></div>
 <div><label>🚕 Taxi</label><input id=wa_t class=input></div>
 <div><label>🛎️ Front</label><input id=wa_f class=input></div>
 </div>
 <button class=btn btn-a style=width:100%;margin-top:10px onclick="saveDept()">💾 Save WA</button></div>`;
 const sel=document.getElementById('deptHotelSel'); sel.innerHTML=''; HOTELS.forEach(h=>sel.innerHTML+=`<option value="${h.id}">${h.name||h.hotel_name} - ${h.city}</option>`);
}
async function loadDeptVals(){
 const id=document.getElementById('deptHotelSel').value; const h=HOTELS.find(x=>x.id==id); if(!h) return;
 document.getElementById('wa_k').value=h.whatsapp_kitchen||''; document.getElementById('wa_h').value=h.whatsapp_house||''; document.getElementById('wa_f').value=h.whatsapp_front||'';
}
async function saveDept(){
 const id=document.getElementById('deptHotelSel').value;
 const payload={whatsapp_kitchen:document.getElementById('wa_k').value, whatsapp_house:document.getElementById('wa_h').value, whatsapp_front:document.getElementById('wa_f').value};
 const {error}=await supa.from('hotels').update(payload).eq('id',id); if(error) alert(error.message); else alert('✅ WA saved for hotel');
}

function tab(name,el){
 document.querySelectorAll('[id^=view-]').forEach(e=>e.style.display='none');
 document.getElementById('view-'+name).style.display='block';
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');
 if(name=='menu') loadMenuTab();
 if(name=='dept') loadDeptTab();
 if(name=='orders') loadOrders();
 if(name=='cash'){ document.getElementById('view-cash').innerHTML=document.getElementById('view-orders').innerHTML; document.getElementById('view-cash').style.display='block'; document.getElementById('view-orders').style.display='none'; }
}
async function approveV(id){ await supa.from('vendors').update({status:'approved'}).eq('id',id); loadVendors(); }
async function rejectV(id){ await supa.from('vendors').update({status:'rejected'}).eq('id',id); loadVendors(); }
function impersonate(email){ localStorage.setItem('hotel_email',email); location.href='/hotel-dashboard.html'; }
function copyLink(id){ const link=location.origin+'/guest.html?hotel='+id+'&room=101'; navigator.clipboard.writeText(link); alert('Copied: '+link); }
async function deleteHotel(id){ if(!confirm('Delete hotel?')) return; await supa.from('hotels').delete().eq('id',id); loadHotels(); }

init();
</script>
</body>
</html>
