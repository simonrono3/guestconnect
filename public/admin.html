<!DOCTYPE html><html><head><title>Admin | GUESTHUB</title>
<style>body{background:#1A1A1A;color:#fff;font-family:'Inter';padding:30px} .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px} .stat{background:rgba(45,36,24,0.8);border:1px solid #FF6B35;padding:24px;border-radius:20px} .stat h2{color:#FFD700;font-size:32px}</style>
</head><body><h1>📊 ADMIN DASHBOARD</h1><div class="grid">
<div class="stat"><h3>MRR</h3><h2 id="mrr">KES 0</h2></div>
<div class="stat"><h3>Commission</h3><h2 id="comm">KES 0</h2></div>
<div class="stat"><h3>Total Revenue</h3><h2 id="total">KES 0</h2></div>
<div class="stat"><h3>Total Hotels</h3><h2 id="hotels">0</h2></div>
</div>
<script>
fetch('/api/admin/stats').then(r=>r.json()).then(d=>{
  document.getElementById('mrr').innerText='KES '+d.mrr.toLocaleString();
  document.getElementById('comm').innerText='KES '+d.commission.toLocaleString();
  document.getElementById('total').innerText='KES '+d.total.toLocaleString();
  document.getElementById('hotels').innerText=d.hotels;
});
</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script> <!-- Weka hii kwanza -->
<script>
    // Code yako yote ya supabase inaenda hapa chini
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
</script>



</body></html>
