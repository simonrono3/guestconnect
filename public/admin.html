<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — GuestHub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--lime:#c6ff00;--gold:#fbbf24;--green:#22c55e;--red:#ef4444;--bg:#050505;--card:#101010;--border:#242424}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;padding-bottom:60px}
.header{position:sticky;top:0;z-index:100;background:rgba(5,5,5,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(251,191,36,.4);padding:12px}
.header-inner{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.brand{font-family:Space Grotesk;font-weight:800;font-size:16px}
.brand span{color:var(--lime)}
.btn{border:0;border-radius:11px;padding:10px 14px;font-size:11px;font-weight:900;cursor:pointer}
.btn-primary{background:var(--lime);color:#000}
.btn-gold{background:var(--gold);color:#000}
.btn-dark{background:#171717;border:1px solid #303030;color:#fff}
.btn-red{background:#351010;border:1px solid #672020;color:#ff7777}
.btn-sm{padding:7px 10px;font-size:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 12px;max-width:1400px;margin:auto}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px}
.stat b{display:block;font-family:Space Grotesk;font-size:22px}
.stat small{color:#777;font-size:9px;font-weight:900;letter-spacing:.1em}
.tabs{position:sticky;top:60px;z-index:80;background:rgba(5,5,5,.96);padding:10px 12px;border-bottom:1px solid #161616}
.tabs-inner{max-width:1400px;margin:auto;display:flex;gap:7px;overflow-x:auto}
.tab{white-space:nowrap;border:1px solid var(--border);background:#101010;color:#ddd;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:900;cursor:pointer}
.tab.active{background:var(--lime);color:#000}
.view{padding:14px 12px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0a0a0a;border:1px solid #1b1b1b;border-radius:14px;padding:12px;margin-bottom:8px;flex-wrap:wrap}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900}
.badge-green{background:#0a2914;color:#4ade80}
.badge-yellow{background:#352200;color:#fbbf24}
.badge-red{background:#320d0d;color:#f87171}
.hidden{display:none!important}
.toast{position:fixed;right:14px;bottom:20px;z-index:500;background:#161616;border:1px solid #333;border-radius:13px;padding:12px 15px;font-size:11px;font-weight:800;transform:translateY(120px);opacity:0;transition:.25s;max-width:340px;word-break:break-word}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:#2b0d0d;border-color:#672020;color:#ffb4b4}
.toast.success{background:#0a2b16;border-color:#1e5c33;color:#b6ffcb}
.empty{color:#777;text-align:center;padding:40px;font-size:13px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  <div class="brand">GUESTHUB <span>ADMIN</span></div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-dark btn-sm" onclick="refreshAll()">🔄 Refresh</button>
    <button class="btn btn-red btn-sm" onclick="logout()">Logout</button>
  </div>
</div></header>

<main>
<section class="stats">
  <div class="stat"><b id="s_hotels">0</b><small>HOTELS</small></div>
  <div class="stat"><b id="s_pending_h">0</b><small>PENDING HOTELS</small></div>
  <div class="stat"><b id="s_vendors">0</b><small>VENDORS</small></div>
  <div class="stat"><b id="s_pending_v">0</b><small>PENDING VENDORS</small></div>
</section>

<div class="tabs"><div class="tabs-inner">
  <button class="tab active" data-tab="hotels">🏨 Hotels <span id="c_h"></span></button>
  <button class="tab" data-tab="vendors">🚚 Vendors <span id="c_v"></span></button>
  <button class="tab" data-tab="orders">🔔 Orders</button>
</div></div>

<section id="view-hotels" class="view"></section>
<section id="view-vendors" class="view hidden"></section>
<section id="view-orders" class="view hidden"></section>
</main>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => 'Ksh ' + Number(v || 0).toLocaleString();

let HOTELS = [], VENDORS = [], ORDERS = [];
let currentTab = 'hotels';

function adminHeaders(extra = {}){
  const t = localStorage.getItem('admin_token') || '';
  return { 'Authorization': 'Bearer ' + t, ...extra };
}

async function safeFetch(url, opts = {}){
  const r = await fetch(url, { ...opts, headers: adminHeaders(opts.headers || {}) });
  if (r.status === 401) { logout(); throw new Error('Session expired'); }
  if (r.status === 429) throw new Error('Too many requests — slow down');
  return r;
}

// ⭐ NEW: Parses response, throws on failure so we can catch it
async function apiCall(url, opts = {}){
  const r = await safeFetch(url, opts);
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok || data.ok === false) {
    throw new Error(data.error || ('HTTP ' + r.status));
  }
  return data;
}

function toast(msg, type = 'success'){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => el.className = 'toast', 4000);
}

function logout(){
  localStorage.removeItem('admin_token');
  window.location.href = '/admin-login.html';
}

async function refreshAll(){
  try {
    await Promise.all([loadHotels(), loadVendors(), loadOrders()]);
    renderCurrent();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderCurrent();
  });
});

async function loadHotels(){
  const j = await apiCall('/api/admin/hotels');
  HOTELS = j.hotels || [];
  const pend = HOTELS.filter(h => String(h.status).toUpperCase() === 'PENDING').length;
  $('s_hotels').innerText = HOTELS.length;
  $('s_pending_h').innerText = pend;
  $('c_h').innerText = pend ? `(${pend})` : '';
}

function renderHotels(){
  const box = $('view-hotels');
  if (!HOTELS.length) {
    box.innerHTML = '<div class="card empty">No hotels registered yet.</div>';
    return;
  }
  const pending = HOTELS.filter(h => String(h.status).toUpperCase() === 'PENDING');
  const approved = HOTELS.filter(h => String(h.status).toUpperCase() !== 'PENDING');

  box.innerHTML =
    `<div class="card"><b>⏳ Pending (${pending.length})</b></div>` +
    (pending.length ? pending.map(h => {
      // ⭐ Use UUID if available, else hotel_id (both are safe — backend handles both)
      const key = h.id || h.hotel_id;
      return `
      <div class="row">
        <div>
          <b>${esc(h.hotel_name || h.name)} — <code style="color:var(--lime)">${esc(h.hotel_id)}</code></b><br>
          <small style="color:#777">${esc(h.city || '')} • ${esc(h.email || '')} • ${esc(h.phone || '')}</small>
        </div>
        <div style="display:flex;gap:5px">
          <button class="btn btn-primary btn-sm" onclick="approveHotel('${esc(key)}', this)">✅ Approve</button>
          <button class="btn btn-red btn-sm" onclick="deleteHotel('${esc(key)}', this)">Del</button>
        </div>
      </div>`;
    }).join('') : '<div class="card empty" style="padding:16px">None pending.</div>') +
    `<div class="card"><b>✅ Approved (${approved.length})</b></div>` +
    (approved.length ? approved.map(h => {
      const key = h.id || h.hotel_id;
      return `
      <div class="row">
        <div>
          <b>${esc(h.hotel_name || h.name)} — <code style="color:var(--lime)">${esc(h.hotel_id)}</code></b><br>
          <small style="color:#777">${esc(h.city || '')}</small>
        </div>
        <div style="display:flex;gap:5px">
          <button class="btn btn-gold btn-sm" onclick="window.open('/gm-dashboard.html?hotel=${esc(h.hotel_id)}','_blank')">GM Dash</button>
          <button class="btn btn-red btn-sm" onclick="deleteHotel('${esc(key)}', this)">Del</button>
        </div>
      </div>`;
    }).join('') : '<div class="card empty" style="padding:16px">None approved.</div>');
}

// ⭐ FIXED: Approve hotel — shows errors, disables button
async function approveHotel(id, btnEl){
  if (!id) return toast('No hotel ID', 'error');
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳...'; }
  try {
    const url = '/api/admin/hotels/' + encodeURIComponent(id) + '/approve';
    console.log('▶️ POST', url);
    const j = await apiCall(url, { method: 'POST' });
    console.log('✅ Approve response:', j);
    toast('✅ Hotel approved: ' + (j.hotel?.hotel_id || id), 'success');
    await loadHotels();
    renderCurrent();
  } catch (e) {
    console.error('❌ Approve failed:', e);
    toast('❌ Approve failed: ' + e.message, 'error');
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '✅ Approve'; }
  }
}

async function deleteHotel(id, btnEl){
  if (!id) return toast('No hotel ID', 'error');
  if (!confirm('Delete hotel ' + id + '?')) return;
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳...'; }
  try {
    const url = '/api/admin/hotels/' + encodeURIComponent(id);
    const j = await apiCall(url, { method: 'DELETE' });
    toast('Deleted', 'success');
    await loadHotels();
    renderCurrent();
  } catch (e) {
    console.error('❌ Delete failed:', e);
    toast('❌ Delete failed: ' + e.message, 'error');
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Del'; }
  }
}

async function loadVendors(){
  const j = await apiCall('/api/admin/vendors');
  VENDORS = j.vendors || [];
  const pend = VENDORS.filter(v => String(v.status).toLowerCase() === 'pending').length;
  $('s_vendors').innerText = VENDORS.length;
  $('s_pending_v').innerText = pend;
  $('c_v').innerText = pend ? `(${pend})` : '';
}

function renderVendors(){
  const box = $('view-vendors');
  if (!VENDORS.length) {
    box.innerHTML = '<div class="card empty">No vendors yet.</div>';
    return;
  }
  box.innerHTML = VENDORS.map(v => {
    const st = String(v.status).toLowerCase();
    const cls = st === 'approved' ? 'badge-green' : st === 'rejected' ? 'badge-red' : 'badge-yellow';
    return `<div class="row">
      <div>
        <b>${esc(v.vendor_name)}</b> <span class="badge ${cls}">${esc(v.status)}</span><br>
        <small style="color:#777">${esc(v.phone || '')} • ${esc(v.email || '')}</small><br>
        <small style="color:#777">${esc(v.city || '')} • ${(v.services || []).join(', ')} • ${money(v.price)}</small>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="updateVendor('${esc(v.id)}','approved', this)">Approve</button>
        <button class="btn btn-dark btn-sm" onclick="updateVendor('${esc(v.id)}','rejected', this)">Reject</button>
        <button class="btn btn-red btn-sm" onclick="deleteVendor('${esc(v.id)}', this)">Del</button>
      </div>
    </div>`;
  }).join('');
}

async function updateVendor(id, status, btnEl){
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳...'; }
  try {
    await apiCall('/api/admin/vendors/' + encodeURIComponent(id) + '/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    toast('Vendor ' + status, 'success');
    await loadVendors();
    renderCurrent();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = status === 'approved' ? 'Approve' : 'Reject'; }
  }
}

async function deleteVendor(id, btnEl){
  if (!confirm('Delete this vendor?')) return;
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳...'; }
  try {
    await apiCall('/api/admin/vendors/' + encodeURIComponent(id), { method: 'DELETE' });
    toast('Deleted', 'success');
    await loadVendors();
    renderCurrent();
  } catch (e) {
    toast('❌ ' + e.message, 'error');
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Del'; }
  }
}

async function loadOrders(){
  const j = await apiCall('/api/admin/orders');
  ORDERS = j.orders || [];
}

function renderOrders(){
  const box = $('view-orders');
  if (!ORDERS.length) {
    box.innerHTML = '<div class="card empty">No orders yet.</div>';
    return;
  }
  box.innerHTML = `<div class="card"><b>🔔 Last ${ORDERS.length} orders</b></div>` +
    ORDERS.map(o => `
      <div class="row">
        <div>
          <b>${esc(o.hotel_id)} • Room ${esc(o.room_number)} • ${esc(o.guest_name)}</b><br>
          <small style="color:#777">${esc(o.service_title)} • ${money(o.amount)} • ${esc(o.status)}</small><br>
          <small style="color:#555">${esc(o.guest_phone)} • ${new Date(o.created_at).toLocaleString()}</small>
        </div>
      </div>`).join('');
}

function renderCurrent(){
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  $('view-' + currentTab).classList.remove('hidden');
  if (currentTab === 'hotels') renderHotels();
  if (currentTab === 'vendors') renderVendors();
  if (currentTab === 'orders') renderOrders();
}

// Boot
if (!localStorage.getItem('admin_token')) {
  window.location.href = '/admin-login.html';
} else {
  refreshAll();
}
</script>
</body>
</html>
