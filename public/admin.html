<script>
"use strict";
const API_BASE = window.SERVER_URL || window.API_URL || location.origin;
const ADMIN_TOKEN_KEY = "admin_token";
const getAdminToken = () => localStorage.getItem(ADMIN_TOKEN_KEY) || localStorage.getItem("adminToken") || "";

let HOTELS = []; let VENDORS = []; let ITEMS = []; let ORDERS = [];
let currentTab = "hotels";
let hotelFilter = 'all'; // all, pending, approved
let selectedHotels = new Set();

function getHeaders(){ return { 'Content-Type':'application/json', 'Authorization': `Bearer ${getAdminToken()}` }; }

// --- LOAD HOTELS VIA API (PERMANENT FIX) ---
async function loadHotels(silent=false){
  const box = document.getElementById("view-hotels");
  if(!silent && currentTab==="hotels") loading(box);
  
  try{
    // Jaribu API ya pro kwanza
    let url = `${API_BASE}/api/admin/hotels/all?page=1&limit=500&status=${hotelFilter==='all'?'':hotelFilter}`;
    let res = await fetch(url, { headers: getHeaders() });
    let json = await res.json();
    
    if(json.ok){
      HOTELS = json.hotels || json.data || [];
    } else {
      // Fallback kwa supa kama API haipo
      const {data, error} = await supa.from("hotels").select("*").order("created_at",{ascending:false}).limit(500);
      if(error) throw error;
      HOTELS = data || [];
      if(hotelFilter!=='all') HOTELS = HOTELS.filter(h=> String(h.status).toLowerCase()===hotelFilter);
    }
  }catch(e){
    console.error("Load hotels error", e);
    // Fallback ya mwisho
    const {data} = await supa.from("hotels").select("*").order("created_at",{ascending:false}).limit(500);
    HOTELS = data || [];
  }
  
  document.getElementById("s_hotels").innerText = HOTELS.length;
  renderHotels();
}

// --- RENDER NA FILTERS ---
function renderHotels(){
  const box = document.getElementById("view-hotels");
  if(currentTab!=="hotels") return;
  const q = (document.getElementById("hotelSearch")?.value || "").toLowerCase().trim();
  const filtered = HOTELS.filter(h=>{
    const text = `${h.name||""} ${h.hotel_name||""} ${h.city||""} ${h.email||""}`.toLowerCase();
    return text.includes(q);
  });

  const pendingCount = HOTELS.filter(h=> String(h.status).toLowerCase()==='pending').length;

  box.innerHTML=`
    <div class="card">
      <div class="card-title">🏨 Hotel Network — ${HOTELS.length} total • ${pendingCount} pending approval</div>
      <div class="card-sub">Professional approval system for 200 hotels.</div>
      <div class="toolbar" style="margin-top:12px;">
        <div style="display:flex; gap:6px;">
          <button class="btn ${hotelFilter==='all'?'btn-primary':'btn-dark'} btn-sm" onclick="hotelFilter='all'; loadHotels()">All</button>
          <button class="btn ${hotelFilter==='pending'?'btn-gold':'btn-dark'} btn-sm" onclick="hotelFilter='pending'; loadHotels()">⏳ Pending (${pendingCount})</button>
          <button class="btn ${hotelFilter==='approved'?'btn-primary':'btn-dark'} btn-sm" onclick="hotelFilter='approved'; loadHotels()">✅ Approved</button>
        </div>
        <input id="hotelSearch" class="input" placeholder="🔎 Search 200 hotels..." value="${esc(q)}" oninput="renderHotels()" style="flex:1; min-width:180px;">
        <button class="btn btn-gold" onclick="bulkApprove()" ${selectedHotels.size?'':'disabled'}>✅ Approve Selected (${selectedHotels.size})</button>
      </div>
    </div>
    ${filtered.length? filtered.map(h=>hotelCard(h)).join("") : empty("No hotels match. Run SQL: ALTER TABLE hotels DISABLE ROW LEVEL SECURITY; if still hidden.")}
  `;
}

function hotelCard(h){
  const name = h.name || h.hotel_name || "Unnamed Hotel";
  const city = h.city || "Location not set";
  const email = h.email || "-";
  const status = String(h.status || "pending").toLowerCase();
  const isPending = status==='pending';
  return `
    <div class="row" style="${isPending?'border-left:4px solid var(--gold); background:rgba(251,191,36,0.06)':''}">
      <div class="row-main">
        <div class="row-title">
          <input type="checkbox" ${selectedHotels.has(h.id)?'checked':''} onchange="toggleSelect('${h.id}')" style="margin-right:8px;">
          🏨 ${esc(name)} <span class="badge ${status==="blocked"?"badge-red":status==="approved"?"badge-green":"badge-yellow"}">${esc(status.toUpperCase())}</span>
        </div>
        <div class="row-sub">
          📍 ${esc(city)}<br>✉️ ${esc(email)}<br>📱 Front Desk: ${esc(h.whatsapp_front || "-")}<br>🔑 ID: ${esc(shortId(h.id))} • ${esc(h.plan||'Upendo')}
        </div>
      </div>
      <div class="row-actions">
        ${isPending? `<button class="btn btn-primary btn-sm" onclick="approveHotelAction('${h.id}')">✅ Approve</button>` : ''}
        <button class="btn ${status==='blocked'?'btn-primary':'btn-blue'} btn-sm" onclick="toggleBlockHotel('${h.id}','${status}')">${status==='blocked'?'✅ Unblock':'🚫 Block'}</button>
        <button class="btn btn-blue btn-sm" onclick="showHotelQR('${h.id}')">🔳 QR</button>
        <button class="btn btn-dark btn-sm" onclick="openEditHotel('${h.id}')">✏️ Edit</button>
        <button class="btn btn-red btn-sm" onclick="deleteHotel('${h.id}')">🗑️ Delete</button>
      </div>
    </div>`;
}

// --- APPROVE / BLOCK / DELETE - VIA API (FIXED) ---
async function approveHotelAction(id){
  try{
    let res = await fetch(`${API_BASE}/api/hotels/${id}/approve`, { method:'POST', headers: getHeaders() });
    let d = await res.json();
    if(!d.ok){
      // fallback direct
      const {error} = await supa.from("hotels").update({status:"approved"}).eq("id",id);
      if(error) throw error;
    }
    toast("✅ Hotel Approved!"); selectedHotels.delete(id); await loadHotels();
  }catch(e){ toast(e.message,"error"); }
}

async function toggleBlockHotel(id,status){
  const newStatus = status==='blocked'?'approved':'blocked';
  if(!confirm(`${newStatus} this hotel?`)) return;
  try{
    let res = await fetch(`${API_BASE}/api/admin/hotels/${id}/${newStatus}`, { method:'POST', headers: getHeaders() });
    let d = await res.json().catch(()=>({ok:true}));
    if(!d.ok){
      const {error} = await supa.from("hotels").update({status:newStatus}).eq("id",id);
      if(error) throw error;
    }
    toast(`Hotel ${newStatus}`); await loadHotels();
  }catch(e){ toast(e.message,"error"); }
}

async function deleteHotel(id){
  if(!confirm("Delete this hotel PERMANENTLY? This will delete its services and orders too.")) return;
  try{
    // 1. Try API delete (professional)
    let res = await fetch(`${API_BASE}/api/admin/hotels/${id}`, { method:'DELETE', headers: getHeaders() });
    let json = await res.json().catch(()=>({}));
    
    // 2. If API fails, try direct supabase (requires RLS disabled)
    if(!res.ok){
      const {error: err1} = await supa.from("hotel_services").delete().eq("hotel_id", id);
      const {error: err2} = await supa.from("orders").delete().eq("hotel_id", id);
      const {error} = await supa.from("hotels").delete().eq("id", id);
      if(error) throw error;
    }
    toast("Hotel deleted successfully");
    HOTELS = HOTELS.filter(h=> String(h.id)!==String(id));
    renderHotels();
  }catch(e){
    console.error(e);
    toast("Delete failed: "+e.message+" — Run SQL: ALTER TABLE hotels DISABLE ROW LEVEL SECURITY;", "error");
  }
}

async function bulkApprove(){
  if(!selectedHotels.size) return toast("Select hotels first","error");
  try{
    let res = await fetch(`${API_BASE}/api/admin/hotels/bulk-approve`, { method:'POST', headers: getHeaders(), body: JSON.stringify({ids:[...selectedHotels]}) });
    let d = await res.json().catch(()=>({ok:false}));
    if(!d.ok){
      // fallback
      const {error} = await supa.from("hotels").update({status:"approved"}).in("id", [...selectedHotels]);
      if(error) throw error;
    }
    toast(`✅ ${selectedHotels.size} hotels approved`);
    selectedHotels.clear();
    await loadHotels();
  }catch(e){ toast(e.message,"error"); }
}

function toggleSelect(id){ if(selectedHotels.has(id)) selectedHotels.delete(id); else selectedHotels.add(id); renderHotels(); }
</script>
