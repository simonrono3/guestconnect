<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>GuestHub Admin</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:15px}
.card{background:#1e1e1e;padding:15px;margin:12px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.badge{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.pending{background:#3a2a00;color:#ffb700}
.approved{background:#0a3a1a;color:#00ff88}
.btn{padding:8px 14px;border:none;border-radius:8px;margin:3px;cursor:pointer;font-weight:bold}
.approve{background:#22c55e;color:#000} .block{background:#b91c1c;color:#fff} .del{background:#7f1d1d;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:#1e1e1e;padding:15px;border-radius:12px}
</style></head><body>
<h1 style="color:#fbbf24">🏨 GuestHub8.5 - SUPER ADMIN</h1>
<div class="stats">
<div class="stat">Total Hotels<br><b id="total" style="font-size:28px">0</b></div>
<div class="stat">Pending<br><b id="pending" style="font-size:28px;color:#fbbf24">0</b></div>
</div>
<div id="list">Loading hotels...</div>
<script>
async function load(){
  const res = await fetch('/api/hotels');
  const hotels = await res.json();
  document.getElementById('total').innerText = hotels.length;
  document.getElementById('pending').innerText = hotels.filter(h=>h.status!=='APPROVED').length;
  document.getElementById('list').innerHTML = hotels.map(h=>`
    <div class="card">
      <div>
        <b style="color:#fbbf24;font-size:18px">${h.hotel_name||h.name}</b> <span class="badge ${h.status==='APPROVED'?'approved':'pending'}">${h.status}</span><br>
        <small>${h.location||''} | ${h.hotel_type||''} | ${h.email}</small>
      </div>
      <div>
        ${h.status!=='APPROVED'? `<button class="btn approve" onclick="approveHotel('${h.hotel_id||h.id}')">Approve</button>`:''}
        <button class="btn block" onclick="blockHotel('${h.hotel_id||h.id}')">Block</button>
        <button class="btn del" onclick="deleteHotel('${h.hotel_id||h.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}
async function approveHotel(id){
  const r = await fetch(`/api/hotels/${id}/approve`,{method:'POST'});
  const data = await r.json();
  if(r.ok){ alert(id+' APPROVED!'); load(); } else alert('Error: '+data.error);
}
async function blockHotel(id){
  if(!confirm('Block '+id+'?')) return;
  await fetch(`/api/hotels/${id}/block`,{method:'POST'}); load();
}
async function deleteHotel(id){
  if(!confirm('Delete '+id+' forever?')) return;
  await fetch(`/api/hotels/${id}`,{method:'DELETE'}); load();
}
load();
</script></body></html>
