<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuestHub Hotel Dashboard 10.0</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>

<style>

:root{
--lime:#c6ff00;
--gold:#fbbf24;
--bg:#060606;
--card:#141414;
--border:#262626;
--green:#22c55e;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
color:white;
font-family:Inter,sans-serif;
padding-bottom:100px;
}

header{
position:sticky;
top:0;
z-index:100;
background:#080808;
border-bottom:1px solid #222;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-family:Space Grotesk;
font-weight:800;
font-size:22px;
}

.logo span{
color:var(--lime);
}

.hotelTag{
font-size:12px;
color:#999;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:14px;
}

.stat{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:16px;
text-align:center;
}

.stat b{
font-size:24px;
display:block;
font-family:Space Grotesk;
}

.stat small{
color:#888;
font-size:11px;
font-weight:700;
}

.tabs{
display:flex;
overflow:auto;
gap:8px;
padding:0 14px 14px;
}

.tab{
white-space:nowrap;
padding:10px 16px;
border-radius:999px;
border:none;
font-weight:800;
cursor:pointer;
background:#1a1a1a;
color:white;
}

.tab.active{
background:var(--lime);
color:black;
}

.section{
padding:14px;
display:none;
}

.section.active{
display:block;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:14px;
margin-bottom:12px;
}

.btn{
padding:12px;
border:none;
border-radius:12px;
font-weight:800;
cursor:pointer;
}

.btn-green{
background:var(--lime);
color:black;
}

.btn-dark{
background:#222;
color:white;
}

.btn-gold{
background:var(--gold);
color:black;
}

input,select{
width:100%;
padding:12px;
margin-top:6px;
background:#0a0a0a;
border:1px solid #333;
border-radius:12px;
color:white;
}

.order{
background:#0a0a0a;
border:1px solid #222;
border-radius:14px;
padding:12px;
margin-top:10px;
}

.vendor{
background:#0a0a0a;
border:1px solid #222;
border-radius:14px;
padding:12px;
margin-top:10px;
}

.qrbox{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:15px;
}

</style>
</head>

<body>

<header>

<div class="logo">
GuestHub <span>HotelOS</span>
</div>

<div class="hotelTag" id="hotelName">
Loading...
</div>

</header>

<div class="stats">

<div class="stat">
<b id="todayRevenue">0</b>
<small>TODAY REVENUE</small>
</div>

<div class="stat">
<b id="monthRevenue">0</b>
<small>MONTH REVENUE</small>
</div>

<div class="stat">
<b id="totalOrders">0</b>
<small>ORDERS</small>
</div>

<div class="stat">
<b id="activeVendors">0</b>
<small>ACTIVE VENDORS</small>
</div>

</div>

<div class="tabs">

<button class="tab active"
onclick="openTab('orders',this)">
🔔 Orders
</button>

<button class="tab"
onclick="openTab('vendors',this)">
🚚 Vendors
</button>

<button class="tab"
onclick="openTab('services',this)">
🍽 Services
</button>

<button class="tab"
onclick="openTab('revenue',this)">
💰 Revenue
</button>

<button class="tab"
onclick="openTab('qr',this)">
📱 QR Codes
</button>

</div>

<!-- ORDERS -->

<div id="orders" class="section active">

<div class="card">

<b>Guest Orders</b>

<div id="ordersList">
Loading orders...
</div>

</div>

</div>

<!-- VENDORS -->

<div id="vendors" class="section">

<div class="card">

<b>Vendor Tracking</b>

<div id="vendorsList"></div>

</div>

</div>

<!-- SERVICES -->

<div id="services" class="section">

<div class="card">

<b>Add Hotel Service</b>

<input id="serviceTitle"
placeholder="Service name">

<input id="servicePrice"
type="number"
placeholder="Price">

<select id="serviceCategory">

<option value="food">Food</option>
<option value="spa">Spa</option>
<option value="taxi">Taxi</option>
<option value="tour">Tour</option>

</select>

<button
class="btn btn-green"
style="width:100%;margin-top:10px"
onclick="addService()">

+ Add Service

</button>

</div>

<div id="serviceList"></div>

</div>

<!-- REVENUE -->

<div id="revenue" class="section">

<div class="card">

<h3>Total Revenue</h3>

<br>

<h1 id="revenueTotal">
Ksh 0
</h1>

<br>

<p>
GuestHub Commission (15%)
</p>

<h2 id="commissionTotal">
Ksh 0
</h2>

</div>

</div>

<!-- QR -->

<div id="qr" class="section">

<div class="card">

<b>Generate Room QR Codes</b>

<br><br>

<input
id="startRoom"
value="101"
placeholder="Start Room">

<input
id="endRoom"
value="110"
placeholder="End Room">

<button
class="btn btn-gold"
style="width:100%;margin-top:10px"
onclick="generateQRs()">

Generate QRs

</button>

<div class="qrbox"
id="qrContainer">

</div>

</div>

</div>
