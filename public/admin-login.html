<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}
.box{background:#141414;padding:30px;border-radius:16px;width:90%;max-width:380px;border:1px solid #222}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
.btn{width:100%;padding:12px;background:#fbbf24;border:none;border-radius:8px;font-weight:800}</style></head>
<body><div class="box"><h2 style="color:#fbbf24">🔐 Super Admin</h2>
<input id="p" type="password" placeholder="Admin Password">
<button class="btn" onclick="login()">Login</button><p id="msg" style="color:red"></p></div>
<script>
async function login(){
 const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});
 const d=await r.json();
 if(d.ok){localStorage.setItem('admin_token',d.token); location.href='/admin.html';}
 else document.getElementById('msg').innerText='Wrong password';
}
</script></body></html>
