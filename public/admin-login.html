<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — GuestHub</title>
<style>
body{background:#050505;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Inter,system-ui,sans-serif;padding:16px}
.box{background:#101010;padding:30px;border-radius:16px;width:100%;max-width:400px;border:1px solid #242424}
h2{margin:0 0 6px;color:#fbbf24;font-size:22px}
.sub{color:#888;font-size:12px;margin-bottom:22px}
label{font-size:11px;color:#888;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#080808;color:#fff;font-size:14px;box-sizing:border-box}
input:focus{outline:none;border-color:#fbbf24}
.btn{width:100%;padding:14px;background:#fbbf24;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;color:#000;margin-top:16px}
.btn:disabled{opacity:.6;cursor:not-allowed}
#msg{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;font-weight:700;display:none;text-align:center}
#msg.err{display:block;background:#2a0d0d;color:#ff7b7b;border:1px solid #7f1d1d}
#msg.ok{display:block;background:#0d2a15;color:#4ade80;border:1px solid #166534}
.back{color:#666;font-size:11px;text-align:center;margin-top:18px;display:block;text-decoration:none}
.back:hover{color:#fbbf24}
</style>
</head>
<body>
<div class="box">
  <h2>🔐 Super Admin</h2>
  <div class="sub">GuestHub platform control</div>

  <label>Admin Password</label>
  <input id="p" type="password" placeholder="••••••••" autocomplete="current-password" autofocus>

  <button class="btn" id="btn" type="button">Login</button>
  <p id="msg"></p>
  <a href="/" class="back">← Back to GuestHub</a>
</div>

<script>
(() => {
  'use strict';
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const input = document.getElementById('p');

  function show(text, type){
    msg.className = type || 'err';
    msg.textContent = text;
  }

  async function login(){
    const password = input.value;
    if (!password) return show('Enter admin password');

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    msg.className = '';
    msg.textContent = '';

    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      if (r.status === 429) throw new Error('Too many attempts — wait 15 minutes');
      if (r.status >= 500) throw new Error('Server error — try again in 30 seconds');

      let d;
      try { d = await r.json(); } catch { throw new Error('Invalid server response'); }

      if (!d.ok || !d.token) throw new Error(d.error || 'Wrong password');

      localStorage.setItem('admin_token', d.token);
      show('Welcome — redirecting...', 'ok');
      setTimeout(() => { window.location.href = '/admin.html'; }, 400);
    } catch (err) {
      show(err.message || 'Login failed');
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  }

  btn.addEventListener('click', login);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
})();
</script>
</body>
</html>
