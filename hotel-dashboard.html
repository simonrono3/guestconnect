<!DOCTYPE html><html><head>
<title>GM Dashboard | GUESTSHUB</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{background:#1A1A1A;color:#fff;font-family:'Inter';padding:30px}
h1{font-family:'Playfair Display';color:#FFD700;font-size:36px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:30px 0}
.stat{background:rgba(45,36,24,0.8);border:1px solid #FF6B35;padding:24px;border-radius:20px}
.stat h3{opacity:0.7;font-size:14px;margin:0} .stat h2{color:#FFD700;font-size:32px;font-family:'Playfair Display';margin:10px 0}
.green{color:#0F9D58}
.card{background:rgba(45,36,24,0.8);border:1px solid #FF6B35;padding:24px;border-radius:20px;margin:20px 0}
input,select{width:100%;padding:14px;background:#1A1A1A;border:1px solid #444;border-radius:12px;color:#fff;margin:8px 0}
.btn{background:linear-gradient(135deg,#FF6B35,#0F9D58);color:#fff;border:none;padding:16px;width:100%;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head><body>
<h1>🏨 GM CONTROL CENTER</h1>
<div class="grid">
  <div class="stat"><h3>Food Revenue</h3><h2 class="green" id="food">KES 0</h2><small>100% Yours</small></div>
  <div class="stat"><h3>Vendor Share</h3><h2 id="vendor">KES 0</h2><small>15% Commission</small></div>
  <div class="stat"><h3>Orders Today</h3><h2 id="orders">0</h2></div>
  <div class="stat"><h3>Subscription</h3><h2>KES 15,000</h2><small>/month</small></div>
</div>

<div class="card">
<h2 style="font-family:'Playfair Display'">➕ Add Menu / Service / Tour</h2>
<form id="addForm">
<input name="name" placeholder="Item Name - e.g Nyama Choma" required>
<input name="price" type="number" placeholder="Price KES" required>
<input name="desc" placeholder="Description">
<input name="img" placeholder="Image URL">
<input name="dept_whatsapp" placeholder="Dept WhatsApp Group ID">
<select name="type"><option value="food">food - 0% fee</option><option value="service">service - 0% fee</option><option value="tour">tour - 15% fee</option></select>
<button class="btn">ADD ITEM</button>
</form></div>
<script>
const hotelId='prideinn';
fetch('/api/gm/dashboard/'+hotelId).then(r=>r.json()).then(d=>{
  document.getElementById('food').innerText='KES '+d.foodRevenue.toLocaleString();
  document.getElementById('vendor').innerText='KES '+d.vendorRevenue.toLocaleString();
  document.getElementById('orders').innerText=d.orders.length;
});
document.getElementById('addForm').onsubmit=e=>{
  e.preventDefault();
  const formData = Object.fromEntries(new FormData(e.target));
  formData.hotel_id=hotelId;
  fetch('/api/gm/add-item',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)})
  .then(()=>alert('✅ Item Added!'));
}
</script></body></html>
