<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Dashboard</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0} .card{background:#111827}</style></head><body class="p-4"><div class="max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-[#38bdf8] mb-4">Hotel Dashboard</h1><div class="flex gap-2 mb-4"><button onclick="tab(1)" class="bg-[#38bdf8] text-black px-4 py-2 rounded-2xl">Overview</button><button onclick="tab(2)" class="bg-[#1f2937] px-4 py-2 rounded-2xl">Requests</button><button onclick="tab(3)" class="bg-[#1f2937] px-4 py-2 rounded-2xl">Services</button></div><div id="t1"></div><div id="t2" class="hidden"></div><div id="t3" class="hidden"></div></div><script>const hotelId=new URLSearchParams(window.location.search).get('hotelId')||'savannah';function tab(n){for(let i=1;i<=3;i++)document.getElementById('t'+i).classList.add('hidden');document.getElementById('t'+n).classList.remove('hidden')}function load(){fetch('/api/data').then(r=>r.json()).then(data=>{const myBookings=data.bookings.filter(b=>b.hotelId===hotelId);const earning=myBookings.reduce((a,b)=>a+b.hotelEarning,0);document.getElementById('t1').innerHTML=`<div class="grid grid-cols-2 gap-4"><div class="card p-4 rounded-3xl"><div>Earnings</div><div class="text-3xl font-bold text-[#22c55e]">KES ${earning.toLocaleString()}</div></div><div class="card p-4 rounded-3xl"><div>Bookings</div><div class="text-3xl font-bold">${myBookings.length}</div></div></div><div class="card p-4 rounded-3xl mt-4"><div class="font-bold">QR Link</div><div class="text-xs break-all bg-[#0a0f1e] p-2 rounded-xl">https://${window.location.host}/?hotelId=${hotelId}&room=101</div></div>`;document.getElementById('t2').innerHTML=data.requests.filter(r=>r.hotelId===hotelId).map(r=>`<div class="card p-3 rounded-2xl mb-2">${r.service} - Room ${r.room}</div>`).join('')||'No requests';document.getElementById('t3').innerHTML=`<button onclick="addService()" class="bg-[#22c55e] text-black p-2 rounded-2xl mb-3">+ Add Service</button>`+data.services.filter(s=>s.hotelId===hotelId).map(s=>`<div class="card p-3 rounded-2xl mb-2">${s.name} - KES ${s.price}</div>`).join('');});}function addService(){const name=prompt('Name');if(!name)return;const price=prompt('Price');const cat=prompt('Category','Tours');fetch('/api/hotel/add-service',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`hotelId=${hotelId}&name=${encodeURIComponent(name)}&price=${price}&category=${cat}&desc=Added&img=https://picsum.photos/300/150?${Date.now()}&vendorId=${hotelId}`}).then(()=>load())}tab(1);load();</script></body></html>
