<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUESTCONNECT Hotel Dashboard</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{background:#0a0f1e;color:#e2e8f0}.card{background:#111827}</style></head>
<body class="p-4"><div class="max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-[#38bdf8] mb-4">🏨 GUESTCONNECT Hotel Control Center</h1>
<div class="flex gap-2 mb-4 overflow-x-auto"><button onclick="tab(1)" class="tab bg-[#38bdf8] text-black px-4 py-2 rounded-2xl">Overview</button><button onclick="tab(2)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Requests</button><button onclick="tab(3)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Pre-Checkins</button><button onclick="tab(4)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Revenue</button></div>
<div id="t1"></div><div id="t2" class="hidden"></div><div id="t3" class="hidden"></div><div id="t4" class="hidden"></div></div>
<script>
const hotelId = new URLSearchParams(window.location.search).get('hotelId')||'leopardbeach';
function tab(n){document.querySelectorAll('.tab').forEach(b=>b.className='tab bg-[#1f2937] px-4 py-2 rounded-2xl');document.querySelectorAll('.tab')[n-1].className='tab bg-[#38bdf8] text-black px-4 py-2 rounded-2xl';for(let i=1;i<=4;i++)document.getElementById('t'+i).classList.add('hidden');document.getElementById('t'+n).classList.remove('hidden')}
fetch('/api/data').then(r=>r.json()).then(data=>{
  const myBookings = data.bookings.filter(b=>b.hotelId===hotelId); const earning = myBookings.reduce((a,b)=>a+b.hotelEarning,0);
  document.getElementById('t1').innerHTML=`<div class="grid grid-cols-2 gap-4"><div class="card p-4 rounded-3xl"><div>Your 50% Share via GUESTCONNECT</div><div class="text-3xl font-bold text-[#22c55e]">KES ${earning.toLocaleString()}</div></div><div class="card p-4 rounded-3xl"><div>Bookings</div><div class="text-3xl font-bold">${myBookings.length}</div></div></div><div class="card p-4 rounded-3xl mt-4"><canvas id="chart"></canvas></div><div class="card p-4 rounded-3xl mt-4 text-sm"><b>GUESTCONNECT QR Link:</b><br><span class="text-xs break-all">${location.origin}/guest.html?hotelId=${hotelId}&room=101</span><br>Print this QR for each room</div>`;
  document.getElementById('t2').innerHTML=data.requests.filter(r=>r.hotelId===hotelId).map(r=>`<div class="card p-3 rounded-2xl mb-2">${r.service} - Room ${r.room}</div>`).join('')||'No requests';
  document.getElementById('t3').innerHTML=data.precheckins.filter(p=>p.hotelId===hotelId).map(p=>`<div class="card p-3 rounded-2xl mb-2">${p.name} - Arriving ${p.arrival}</div>`).join('')||'No pre-checkins';
  document.getElementById('t4').innerHTML=`<div class="card p-4 rounded-3xl"><div class="text-2xl font-bold text-[#22c55e]">Total Earnings: KES ${earning.toLocaleString()}</div><div class="text-sm text-gray-400">GUESTCONNECT Model: 10% commission on activities, split 50/50 with hotel</div></div>`;
  if(document.getElementById('chart')) new Chart(document.getElementById('chart'),{type:'bar',data:{labels:['Earnings'],datasets:[{label:'KES',data:[earning],backgroundColor:'#22c55e'}]}});
});
tab(1);
</script></body></html>
