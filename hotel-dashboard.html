<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Dashboard - My Hotel Report</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px}
.card{background:#1a1a1a;padding:15px;border-radius:12px;text-align:center;border:1px solid #333}
button{padding:10px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<h1 style="color:#00ff88;">GM Dashboard</h1>
<p>Hotel: <b id="hotelName" style="color:#00ff88;"></b></p>

<!-- ===== MY HOTEL REPORT ===== -->
<div id="reportSection" style="margin:20px 0; border:1px solid #00ff88; border-radius:15px; padding:20px; background:#111;">
  <h2 style="color:#00ff88;">📊 My Hotel Report</h2>
  
  <div style="display:flex; gap:10px; margin:15px 0; flex-wrap:wrap;">
    <input type="date" id="fromDate" style="padding:8px; border-radius:6px;">
    <input type="date" id="toDate" style="padding:8px; border-radius:6px;">
    <button onclick="loadReport()" style="background:#00ff88;">🔄 Load Report</button>
    <button onclick="downloadReport()" style="background:#fff;">📥 Download PDF</button>
  </div>

  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:15px 0;">
    <div class="card"><h2 id="totalBookings">0</h2><small>Bookings</small></div>
    <div class="card"><h2 id="totalGuests">0</h2><small>Guests</small></div>
    <div class="card"><h2 id="totalRevenue" style="color:#00ff88;">KES 0</h2><small>Revenue</small></div>
  </div>

  <table id="reportTable" style="width:100%; border-collapse:collapse; margin-top:10px;">
    <thead><tr style="color:#00ff88; border-bottom:1px solid #333;"><th>Date</th><th>Guest</th><th>Service</th><th>Amount</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const MY_HOTEL = localStorage.getItem('hotel_id') || 'diani_beach_resort';
document.getElementById('hotelName').innerText = MY_HOTEL.toUpperCase().replace(/_/g,' ');

// Load report from YOUR API - MY HOTEL ONLY
async function loadReport(){
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  
  // Call your server API
  let url = `/api/report/${MY_HOTEL}`;
  if(from && to) url += `?from=${from}&to=${to}`;

  const res = await fetch(url);
  const data = await res.json();

  document.getElementById('totalBookings').innerText = data.total_bookings;
  document.getElementById('totalGuests').innerText = data.total_guests;
  document.getElementById('totalRevenue').innerText = 'KES ' + data.total_revenue;

  const tbody = document.querySelector('#reportTable tbody');
  tbody.innerHTML = data.bookings.map(b=>`
    <tr style="border-bottom:1px solid #222;">
      <td>${new Date(b.created_at).toLocaleDateString()}</td>
      <td>${b.guest_name || b.name}</td>
      <td>${b.service || b.request_type || '-'}</td>
      <td>${b.amount || 0}</td>
    </tr>
  `).join('');
}

function downloadReport(){
  window.print(); // GM can save as PDF
}

loadReport();
</script>

</body>
</html>
