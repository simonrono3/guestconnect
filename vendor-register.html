<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join as Vendor</title>
<style>body{background:#0a0a0a;color:white;font-family:monospace;padding:22px}input,select{width:100%;padding:14px;margin:8px 0;background:#151515;border:1px solid #333;color:white;border-radius:10px}button{background:#00ff88;color:#000;padding:16px;border:none;border-radius:100px;width:100%;font-weight:900;margin-top:15px}</style></head><body>
<h2 style="color:#00ff88">GUESTSHUB™ Vendor Application</h2><p style="color:#888">Get bookings from 100+ hotels. 15% commission.</p>
<form id="f">
<input name="company_name" placeholder="Company: Pollman's Tours Diani" required>
<input name="contact_name" placeholder="Contact Person" required>
<input name="phone" placeholder="Phone: 2547XXXXXXXX" required>
<input name="email" placeholder="Email" required>
<select name="category"><option>TOURS</option><option>SAFARI</option><option>SPA</option><option>TAXI</option><option>DINE</option><option>SHOP</option></select>
<input name="license_number" placeholder="Tourism License No (optional)">
<button>Submit Application →</button>
</form><p id="msg" style="color:#00ff88;margin-top:15px"></p>
<script>
f.onsubmit=async e=>{e.preventDefault(); const b=Object.fromEntries(new FormData(f)); b.status='pending'; const r=await fetch('/api/gsh/vendor/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); const d=await r.json(); msg.innerText = d.success? '✅ Application Sent! You will be approved in 24Hrs. Check email.' : '❌ '+d.error; f.reset();}
</script></body></html>
