<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUESTCONNECT Hotel Signup</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0}</style></head>
<body class="p-4"><div class="max-w-md mx-auto bg-[#111827] p-6 rounded-3xl"><h1 class="text-2xl font-bold text-[#38bdf8] mb-4">🏨 Join GUESTCONNECT - 0% Room Commission</h1><p class="text-sm text-gray-400 mb-4">We only earn when you earn. 10% on in-stay activities, split 50/50.</p>
<form id="form" class="space-y-3"><input name="name" placeholder="Hotel Name" class="w-full p-3 rounded-2xl bg-[#1f2937]" required><input name="hotelId" placeholder="Hotel ID e.g. leopardbeach" class="w-full p-3 rounded-2xl bg-[#1f2937]" required><input name="address" placeholder="Address e.g. Diani Beach Rd" class="w-full p-3 rounded-2xl bg-[#1f2937]"><input name="phone" placeholder="Phone" class="w-full p-3 rounded-2xl bg-[#1f2937]"><input name="email" placeholder="Email" class="w-full p-3 rounded-2xl bg-[#1f2937]"><input name="password" type="password" placeholder="Password" class="w-full p-3 rounded-2xl bg-[#1f2937]"><textarea name="description" placeholder="About Hotel" class="w-full p-3 rounded-2xl bg-[#1f2937]"></textarea><input name="logo" placeholder="Logo URL" class="w-full p-3 rounded-2xl bg-[#1f2937]"><button class="w-full bg-[#22c55e] text-black p-3 rounded-2xl font-bold">Join GUESTCONNECT</button></form></div>
<script>document.getElementById('form').onsubmit=e=>{e.preventDefault();fetch('/api/hotel/register',{method:'POST',body:new URLSearchParams(new FormData(e.target))}).then(()=>alert('✅ GUESTCONNECT Application Submitted! We call you in 24hrs'))}</script></body></html>
