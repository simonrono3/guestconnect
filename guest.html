
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUESTHUB</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1/qrcode.min.js"></script><style>body{background:#0a0f1e;color:#e2e8f0;font-family:Inter}.card{background:#111827}.btn{transition:0.2s}.btn:active{scale:0.95}</style></head>
<body class="p-3"><div id="app" class="max-w-md mx-auto">
<div class="card p-4 rounded-3xl shadow-2xl mb-3 text-center"><img id="hotelLogo" class="w-20 h-20 rounded-full mx-auto mb-2 border-4 border-[#38bdf8]"><h1 id="hotelName" class="text-2xl font-bold text-[#38bdf8]"></h1><p id="hotelAddress" class="text-sm text-gray-400"></p><div id="qrcode" class="flex justify-center my-3"></div><p class="text-xs">Room <span id="roomNo"></span> • Powered by GUESTHUB</p></div>
<div class="card p-4 rounded-3xl mb-3"><h2 class="font-bold mb-3 text-lg">⚡ Instant Help</h2><div class="grid grid-cols-3 gap-2" id="instantServices"></div></div>
<div class="card p-4 rounded-3xl"><h2 class="font-bold mb-3 text-lg">🌍 Discover Diani</h2><div class="flex gap-2 mb-3 overflow-x-auto" id="filters"></div><div id="services" class="space-y-3"></div><div id="aiTip" class="mt-3 p-2 bg-[#1f2937] rounded-xl text-xs text-[#38bdf8]"></div></div>
</div><script>
const params = new URLSearchParams(window.location.search); const hotelId = params.get('hotelId')||'leopardbeach'; const room = params.get('room')||'101';
document.getElementById('roomNo').innerText=room; new QRCode(document.getElementById("qrcode"), {text:window.location.href,width:80,height:80});
fetch('/api/data').then(r=>r.json()).then(data=>{render(data)});
function render(data){
  const hotel = data.hotels.find(h=>h.id===hotelId); if(!hotel) return;
  document.getElementById('hotelLogo').src = hotel.logo; document.getElementById('hotelName').innerText=hotel.name; document.getElementById('hotelAddress').innerText=hotel.address;
  const inst = ['Room Service','Beach Towel','Taxi','Dhow Booking','Spa','Security'];
  document.getElementById('instantServices').innerHTML = inst.map(s=>`<button onclick="request('${s}')" class="btn bg-[#38bdf8] text-black p-2 rounded-2xl text-xs font-bold">${s}</button>`).join('');
  const categories = ['All','Tours','Taxi','Wellness','Food'];
  document.getElementById('filters').innerHTML = categories.map(c=>`<button onclick="filter('${c}')" class="btn px-3 py-1 rounded-full text-xs bg-[#1f2937]">${c}</button>`).join('');
  const hotelServices = data.services.filter(s=>s.hotel_id===hotelId && s.status==='Approved');
  document.getElementById('services').innerHTML = hotelServices.map(s=>{const vendor = data.vendors.find(v=>v.id===s.vendor_id);return `<div class="bg-[#1f2937] p-3 rounded-2xl"><img src="${s.img}" class="w-full h-28 object-cover rounded-xl mb-2"><div class="flex justify-between"><div class="font-bold">${s.name}</div><div class="text-xs bg-[#22c55e] text-black px-2 rounded-full">${vendor?.type||'Service'}</div></div><div class="text-xs text-gray-400">${vendor?.name||'Hotel'} ⭐${vendor?.rating||'5.0'}</div><div class="text-sm mt-1">${s.desc}</div><div class="text-lg font-bold text-[#22c55e]">KES ${Number(s.price).toLocaleString()}</div>${s.category==='Taxi'?`<a href="tel:${s.phone}" class="btn w-full bg-[#f97316] text-black mt-2 p-2 rounded-xl font-bold block text-center">📞 Call Now - ${s.eta}</a>`:`<button onclick="book('${s.id}','${s.name}',${s.price})" class="btn w-full bg-[#22c55e] text-black mt-2 p-2 rounded-xl font-bold">Book with M-Pesa</button>`}</div>`}).join('');
}
function request(service){ fetch('/api/request',{method:'POST',body:`room=${room}&hotelId=${hotelId}&service=${service}`}); alert('✅ '+service+' is on the way!') }
function book(id,name,price){ fetch('/api/book',{method:'POST',body:`room=${room}&hotelId=${hotelId}&serviceId=${id}&serviceName=${name}&price=${price}`}).then(r=>r.json()).then(d=>{alert('✅ Booked '+name+'!'); document.getElementById('aiTip').innerText=d.aiTip}) }
function filter(c){fetch('/api/data').then(r=>r.json()).then(d=>render(d))}
</script></body></html>
