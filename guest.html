<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest OS</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{font-family:sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:white;margin:0;padding:18px}.container{max-width:500px;margin:0 auto}.card{background:#1e293b;padding:20px;border-radius:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}h1{color:#00ff88;text-align:center}h3{color:#00ff88;border-bottom:2px solid #334155;padding-bottom:10px}#qrcode{background:white;padding:12px;border-radius:12px;display:inline-block}.btn{display:block;width:100%;background:#00ff88;color:#000;padding:14px;margin:10px 0;border-radius:12px;font-weight:700;border:none;cursor:pointer}.btn-orange{background:#f97316;color:white}.success{color:#4ade80;text-align:center}</style></head><body><div class="container"><div class="card" style="text-align:center"><h1>🏨 GUESTSHUB OS</h1><p id="roomInfo">Welcome Guest</p><div id="qrcode"></div><p><b>Scan QR or use buttons</b></p></div><div class="card"><h3>🏨 Hotel Services</h3><button class="btn" onclick="send('Room Service')">Room Service 🍽️</button><button class="btn" onclick="send('Housekeeping')">Housekeeping 🧹</button><button class="btn" onclick="send('Maintenance')">Maintenance 🔧</button><button class="btn" onclick="send('Extra Items')">Extra Items 🛏️</button></div><div class="card"><h3>🌍 Local Partners - You Earn 15%</h3><div id="tours"></div><button class="btn btn-orange" onclick="send('Taxi Booking')">Book Taxi 📱</button><button class="btn btn-orange" onclick="send('Safari Booking')">Tours & Safaris 🦁</button></div><p id="status" class="success"></p></div><script>
const params=new URLSearchParams(window.location.search); const room=params.get('room')||'203'; const hotel='GUESTSHUB Hotel';
document.getElementById('roomInfo').innerText=`Room ${room} - ${hotel}`; new QRCode(document.getElementById("qrcode"), `GSH_ROOM_${room}_HOTEL_1`);
async function send(service){ await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room, hotel, service, guest_phone:'254700'+room})}); status.innerText=`✅ ${service} sent! Staff notified!`; setTimeout(()=>status.innerText='',3000); }
async function loadTours(){ const r=await fetch('/api/gsh/listings'); const d=await r.json(); tours.innerHTML=d.map(l=>`<div style="background:#0f172a;padding:10px;border-radius:10px;margin:6px 0"><b>${l.name}</b><br><small>${l.department} • ${l.hotels?.name||''} • KES ${l.price}</small><br><button class="btn btn-orange" style="padding:8px;margin-top:6px" onclick="book(${l.id},${l.vendor_id},${l.price})">Book - KES ${l.price}</button></div>`).join(''); }
async function book(listing_id,vendor_id,price){ await fetch('/api/gsh/booking/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_id,vendor_id,hotel_id:1,room_number:room,guest_phone:'2547'+room,booking_date:new Date().toISOString().split('T')[0],pax:2,total:price,status:'pending'})}); alert('✅ Booking Confirmed! 15% commission for hotel!'); }
loadTours();
</script></body></html>
