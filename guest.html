<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUESTHUB</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1/qrcode.min.js"></script><style>body{background:#0a0f1e;color:#e2e8f0} .card{background:#111827}</style></head><body class="p-3"><div class="max-w-md mx-auto"><div class="card p-4 rounded-3xl mb-3 text-center"><img id="hotelLogo" class="w-20 h-20 rounded-full mx-auto mb-2 border-4 border-[#38bdf8]"><h1 id="hotelName" class="text-2xl font-bold text-[#38bdf8]"></h1><p id="hotelAddress" class="text-sm text-gray-400"></p><div id="qrcode" class="flex justify-center my-3"></div><p class="text-xs">Room <span id="roomNo"></span></p></div><div class="card p-4 rounded-3xl mb-3"><h2 class="font-bold mb-3">Instant Help</h2><div class="grid grid-cols-3 gap-2" id="instantServices"></div></div><div class="card p-4 rounded-3xl"><h2 class="font-bold mb-3">Discover & Book</h2><div class="flex gap-2 mb-3 overflow-x-auto" id="filters"></div><div id="services" class="space-y-3"></div></div><div class="text-center mt-4 text-xs"><a href="/hotel-signup.html" class="text-[#38bdf8]">Join as Hotel</a> | <a href="/vendor-signup.html" class="text-[#38bdf8]">Join as Vendor</a> | <a href="/admin.html" class="text-[#8b5cf6]">Admin</a></div></div><script>const params=new URLSearchParams(window.location.search);const hotelId=params.get('hotelId')||'savannah';const room=params.get('room')||'101';document.getElementById('roomNo').innerText=room;new QRCode(document.getElementById("qrcode"),{text:window.location.href,width:80,height:80});function render(filter='All'){fetch('/api/data').then(r=>r.json()).then(data=>{const hotel=data.hotels.find(h=>h.id===hotelId);if(hotel){document.getElementById('hotelLogo').src=hotel.logo;document.getElementById('hotelName').innerText=hotel.name;document.getElementById('hotelAddress').innerText=hotel.address;}const hotelServices=data.services.filter(s=>s.hotelId===hotelId&&s.status==='Approved'&&(filter==='All'||s.category===filter));document.getElementById('services').innerHTML=hotelServices.map(s=>{const vendor=data.vendors.find(v=>v.id===s.vendorId)||{name:'Hotel',rating:5};return `<div class="bg-[#1f2937] p-3 rounded-2xl"><img src="${s.img}" class="w-full h-28 object-cover rounded-xl mb-2"><div class="font-bold">${s.name}</div><div class="text-xs text-gray-400">${vendor.name} - ${vendor.rating} stars</div><div class="text-xs text-gray-400 mb-1">${s.desc}</div><div class="text-lg font-bold text-[#22c55e]">KES ${s.price.toLocaleString()}</div>${s.category==='Taxi'?`<a href="tel:${s.phone}" class="w-full bg-[#f97316] text-black mt-2 p-2 rounded-xl font-bold block text-center">Call Now</a>`:`<button onclick="book(${s.id},'${s.name}',${s.price})" class="w-full bg-[#22c55e] text-black mt-2 p-2 rounded-xl font-bold">Book Now</button>`}</div>`}).join('')||'No services';});}fetch('/api/data').then(r=>r.json()).then(data=>{const inst=['Room Service','Housekeeping','Maintenance','Wake Up','Taxi','Reception'];document.getElementById('instantServices').innerHTML=inst.map(s=>`<button onclick="requestService('${s}')" class="bg-[#38bdf8] text-black p-2 rounded-2xl text-xs font-bold">${s}</button>`).join('');const cats=['All','Tours','Taxi','Wellness','Food'];document.getElementById('filters').innerHTML=cats.map(c=>`<button onclick="render('${c}')" class="px-3 py-1 rounded-full text-xs ${c==='All'?'bg-[#38bdf8] text-black':'bg-[#1f2937]'}">${c}</button>`).join('');render('All');});function requestService(service){fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`room=${room}&hotelId=${hotelId}&service=${service}`});alert('Request sent: '+service)}function book(id,name,price){fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`room=${room}&hotelId=${hotelId}&serviceId=${id}&serviceName=${encodeURIComponent(name)}&price=${price}`});alert('Booked '+name)}</script></body></html>
