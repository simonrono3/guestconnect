<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0}.card{background:#111827}</style></head>
<body class="p-4"><div class="max-w-6xl mx-auto"><h1 class="text-2xl font-bold text-[#8b5cf6] mb-4">👑 GUESTHUB ADMIN</h1>
<div class="flex gap-2 mb-4"><button onclick="tab(1)" class="tab bg-[#8b5cf6] text-black px-4 py-2 rounded-2xl">Hotels</button><button onclick="tab(2)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Vendors</button><button onclick="tab(3)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Finance</button><button onclick="tab(4)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Subscriptions</button></div>
<div id="t1"></div><div id="t2" class="hidden"></div><div id="t3" class="hidden"></div><div id="t4" class="hidden"></div></div>
<script>
function tab(n){document.querySelectorAll('.tab').forEach(b=>b.className='tab bg-[#1f2937] px-4 py-2 rounded-2xl');document.querySelectorAll('.tab')[n-1].className='tab bg-[#8b5cf6] text-black px-4 py-2 rounded-2xl';for(let i=1;i<=4;i++)document.getElementById('t'+i).classList.add('hidden');document.getElementById('t'+n).classList.remove('hidden')}
fetch('/api/data').then(r=>r.json()).then(data=>{
  document.getElementById('t1').innerHTML=data.hotels.map(h=>`<div class="card p-3 rounded-2xl mb-2 flex justify-between"><div>${h.name} - ${h.subscription}</div>${h.status==='Pending'?`<button onclick="approveHotel('${h.id}')" class="bg-[#22c55e] text-black px-3 rounded-xl">Approve</button>`:''}</div>`).join('');
  document.getElementById('t2').innerHTML=data.vendors.map(v=>`<div class="card p-3 rounded-2xl mb-2 flex justify-between"><div>${v.name} - ${v.type}</div>${v.status==='Pending'?`<button onclick="approveVendor('${v.id}')" class="bg-[#22c55e] text-black px-3 rounded-xl">Approve</button>`:''}</div>`).join('');
  const total = data.bookings.reduce((a,b)=>a+Number(b.our_cut||0),0); document.getElementById('t3').innerHTML=`<div class="card p-4 rounded-3xl"><div class="text-3xl font-bold text-[#22c55e]">KES ${total.toLocaleString()}</div><div>Our 50% Commission</div></div>`;
  document.getElementById('t4').innerHTML=data.hotels.map(h=>`<div class="card p-3 rounded-2xl mb-2">${h.name} - ${h.subscription} - KSh ${h.subscription==='Professional'?19500:6500}/month</div>`).join('');
});
function approveHotel(id){fetch('/api/admin/approve-hotel',{method:'POST',body:`id=${id}`}).then(()=>location.reload())}
function approveVendor(id){fetch('/api/admin/approve-vendor',{method:'POST',body:`id=${id}`}).then(()=>location.reload())}
tab(1);
</script></body></html>
