<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - GuestConnect</title>
<style>body{background:#0b1220;color:#fff;font-family:sans-serif;padding:20px}.card{background:#1e293b;border-radius:16px;padding:20px;margin:10px 0}input{width:90%;padding:12px;border-radius:8px;border:none;margin:5px 0}button{padding:12px 20px;border-radius:8px;border:none;background:#38bdf8;font-weight:bold}</style>
</head>
<body>
<div id="login" style="text-align:center;margin-top:100px">
<h2>GuestConnect Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Password"><br>
<button onclick="check()">Login</button>
<p id="err" style="color:red"></p>
</div>

<div id="panel" style="display:none">
<h1>Welcome Simon - Admin Panel</h1>
<div class="card"><h3>Add Hotel</h3><input placeholder="Hotel Name" id="hname"><input placeholder="Manager Phone" id="hphone"><button onclick="alert('Hotel Added: '+document.getElementById('hname').value)">Add Hotel</button></div>
<div class="card"><h3>Add Vendor</h3><input placeholder="Vendor Name e.g. Dolphin Tour"><input placeholder="Price e.g. 6500"><button onclick="alert('Vendor Added')">Add Vendor</button></div>
<div class="card"><h3>Today Bookings</h3><p>No bookings yet - share QR code!</p><a href="index.html" target="_blank"><button>View Guest Site</button></a> <a href="hotel-dashboard.html" target="_blank"><button>View Hotel Dashboard</button></a></div>
</div>

<script>
function check(){
if(document.getElementById('pass').value==='Simon2024!'){
document.getElementById('login').style.display='none';
document.getElementById('panel').style.display='block';
}else{document.getElementById('err').innerText='Wrong Password!';}
}
</script>
</body>
</html>
