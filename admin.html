<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUESTCONNECT Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0}.card{background:#111827}</style></head>
<body class="p-4"><div class="max-w-6xl mx-auto"><h1 class="text-2xl font-bold text-[#8b5cf6] mb-4">👑 GUESTCONNECT ADMIN</h1>
<div class="flex gap-2 mb-4 overflow-x-auto"><button onclick="tab(1)" class="tab bg-[#8b5cf6] text-black px-4 py-2 rounded-2xl">Hotels</button><button onclick="tab(2)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Vendors</button><button onclick="tab(3)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Finance</button><button onclick="tab(4)" class="tab bg-[#1f2937] px-4 py-2 rounded-2xl">Live Feed</button></div>
<div id="t1"></div><div id="t2" class="hidden"></div><div id="t3" class="hidden"></div><div id="t4" class="hidden"></div></div>
<script>
function tab(n){document.querySelectorAll('.tab').forEach(b=>b.className='tab bg-[#1f2937] px-4 py-2 rounded-2xl');document.querySelectorAll('.tab')[n-1].className='tab bg-[#8b5cf6] text-black px-4 py-2 rounded-2xl';for(let i=1;i<=4;i++)document.getElementById('t'+i).classList.add('hidden');document.getElementById('t'+n).classList.remove('hidden')}
fetch('/api/data').then(r=>r.json()).then(data=>{
  document.getElementById('t1').innerHTML=data.hotels.map(h=>`<div class="card p-3 rounded-2xl mb-2 flex justify-between items-center"><div><b>${h.name}</b> - ${h.hotelId} - ${h.subscription} - ${h.status}</div>${h.status==='Pending'?`<button onclick="approveHotel('${h.id}')" class="bg-[#22c55e] text-black px-3 py-1 rounded-xl">Approve</button>`:''}</div>`).join('');
  document.getElementById('t2').innerHTML=data.vendors.map(v=>`<div class="card p-3 rounded-2xl mb-2 flex justify-between"><div>${v.name} - ${v.type} - ${v.status}</div>${v.status==='Pending'?`<button onclick="approveVendor('${v.id}')" class="bg-[#22c55e] text-black px-3 rounded-xl">Approve</button>`:''}</div>`).join('');
  const total = data.bookings.reduce((a,b)=>a+b.ourCut,0); const hotelTotal = data.bookings.reduce((a,b)=>a+b.hotelEarning,0); document.getElementById('t3').innerHTML=`<div class="grid grid-cols-2 gap-4"><div class="card p-6 rounded-3xl"><div class="text-sm">GUESTCONNECT Earnings</div><div class="text-3xl font-bold text-[#22c55e]">KES ${total.toLocaleString()}</div></div><div class="card p-6 rounded-3xl"><div class="text-sm">Hotels Earned</div><div class="text-3xl font-bold text-[#38bdf8]">KES ${hotelTotal.toLocaleString()}</div></div></div><div class="card p-4 rounded-3xl mt-4 text-xs">Total Bookings: ${data.bookings.length} | Total Requests: ${data.requests.length}</div>`;
  document.getElementById('t4').innerHTML=data.activities.map(a=>`<div class="card p-2 rounded-xl mb-1 text-xs">${a.time} - ${a.entity} ${a.entityId}: ${a.action}</div>`).join('')||'No activity yet on GUESTCONNECT';
});
function approveHotel(id){fetch('/api/admin/approve-hotel',{method:'POST',body:`id=${id}`}).then(()=>location.reload())}
function approveVendor(id){fetch('/api/admin/approve-vendor',{method:'POST',body:`id=${id}`}).then(()=>location.reload())}
tab(1);
</script></body></html>
