<!DOCTYPE html><html><head>
<title>Admin | GUESTSHUB</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{background:#1A1A1A;color:#fff;font-family:'Inter';padding:30px}
h1{font-family:'Playfair Display';color:#FFD700;font-size:36px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}
.stat{background:#2D2418;border:1px solid #FF6B35;padding:24px;border-radius:20px}
.stat h2{color:#FFD700;font-size:32px;font-family:'Playfair Display'}
.row{background:#2D2418;padding:16px;border-radius:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.btn{background:#0F9D58;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head><body>
<h1>👑 GUESTSHUB ADMIN</h1>
<div class="grid">
  <div class="stat"><h3>Hotel MRR</h3><h2 id="mrr">KES 0</h2></div>
  <div class="stat"><h3>Commission</h3><h2 id="comm">KES 0</h2></div>
  <div class="stat"><h3>Total</h3><h2 id="total">KES 0</h2></div>
</div>

<h2>Pending Hotels</h2><div id="hotels"></div>
<h2>Pending Vendors</h2><div id="vendors"></div>

<script>
fetch('/api/admin/stats').then(r=>r.json()).then(d=>{
  document.getElementById('mrr').innerText='KES '+d.mrr.toLocaleString();
  document.getElementById('comm').innerText='KES '+d.commission.toLocaleString();
  document.getElementById('total').innerText='KES '+d.total.toLocaleString();
});
fetch('/api/data').then(r=>r.json()).then(data=>{
  document.getElementById('hotels').innerHTML=data.hotels.filter(h=>h.status==='Pending').map(h=>
    `<div class="row">${h.name} <button class="btn" onclick="approve('hotels','${h.id}')">Approve</button></div>`
  ).join('');
  document.getElementById('vendors').innerHTML=data.vendors.filter(v=>v.status==='Pending').map(v=>
    `<div class="row">${v.name} - ${v.type} <button class="btn" onclick="approve('vendors','${v.id}')">Approve</button></div>`
  ).join('');
});
function approve(type,id){fetch(`/api/admin/approve/${type}/${id}`,{method:'POST'}).then(()=>location.reload())}
</script></body></html>
