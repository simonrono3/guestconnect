<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin OS</title>
<style>body{background:#000;color:#fff;font-family:monospace;padding:20px}.card{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin:12px 0}.btn{background:#00ff88;color:#000;padding:8px 12px;border:none;border-radius:20px;font-weight:700}</style></head><body>
<h2 style="color:#00ff88">GUESTSHUB™ SUPER ADMIN OS</h2><input id="key" placeholder="ADMIN_KEY" value="GUESTSHUB2026" style="padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;width:200px"><button onclick="load()" class="btn">LOAD OS</button>
<div id="stats" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
<div class="card"><h3>Pending Vendors - Approve to Earn 15%</h3><div id="vendors"></div></div>
<script>
async function load(){
  const k=key.value; const s=await (await fetch('/api/admin/stats?key='+k)).json();
  stats.innerHTML=`<div class="card"><h1>${s.hotels||0}</h1>Hotels</div><div class="card"><h1>${s.pending_vendors||0}</h1>Pending</div><div class="card"><h1>${s.bookings||0}</h1>Bookings</div><div class="card"><h1>${s.approved_vendors||0}</h1>Active Vendors</div>`;
  const v=await (await fetch('/api/admin/vendors/pending?key='+k)).json();
  vendors.innerHTML = v.map(x=>`<div style="padding:10px;border-bottom:1px solid #222">${x.company_name} - ${x.category} - ${x.phone} <button class="btn" onclick="approve(${x.id})">APPROVE</button></div>`).join('') || 'No pending';
}
async function approve(id){ await fetch('/api/admin/vendor/approve/'+id+'?key='+key.value,{method:'POST'}); alert('Approved! Vendor can now list & you earn 15%'); load(); }
load();
</script></body></html>
