<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0f1e;color:#e2e8f0} .card{background:#111827}</style></head><body class="p-4"><div id="login" class="max-w-md mx-auto mt-20 bg-[#111827] p-6 rounded-3xl text-center"><h1 class="text-2xl font-bold text-[#8b5cf6] mb-4">GUESTHUB ADMIN</h1><input id="pass" type="password" placeholder="Simon2024!" class="w-full p-3 rounded-2xl bg-[#1f2937] mb-3"><button onclick="check()" class="w-full bg-[#8b5cf6] text-white p-3 rounded-2xl font-bold">Login</button><p id="err" class="text-red-500 text-sm mt-2"></p></div><div id="panel" class="max-w-6xl mx-auto hidden"><h1 class="text-2xl font-bold text-[#8b5cf6] mb-4">GUESTHUB OS v4.2</h1><div class="flex gap-2 mb-4"><button onclick="tab(1)" class="bg-[#8b5cf6] text-black px-4 py-2 rounded-2xl">Hotels</button><button onclick="tab(2)" class="bg-[#1f2937] px-4 py-2 rounded-2xl">Vendors</button><button onclick="tab(3)" class="bg-[#1f2937] px-4 py-2 rounded-2xl">Finance</button><button onclick="tab(4)" class="bg-[#1f2937] px-4 py-2 rounded-2xl">Activity</button></div><div id="t1"></div><div id="t2" class="hidden"></div><div id="t3" class="hidden"></div><div id="t4" class="hidden"></div></div><script>function check(){if(document.getElementById('pass').value==='Simon2024!'){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load();}else document.getElementById('err').innerText='Wrong password';}function tab(n){for(let i=1;i<=4;i++)document.getElementById('t'+i).classList.add('hidden');document.getElementById('t'+n).classList.remove('hidden')}function load(){fetch('/api/data').then(r=>r.json()).then(data=>{document.getElementById('t1').innerHTML=data.hotels.map(h=>`<div class="card p-3 rounded-2xl mb-2 flex justify-between"><div><b>${h.name}</b> - ${h.status}</div>${h.status==='Pending'?`<button onclick="approveHotel('${h.id}')" class="bg-[#22c55e] text-black px-3 rounded-xl">Approve</button>`:'Approved'}</div>`).join('');document.getElementById('t2').innerHTML=data.vendors.map(v=>`<div class="card p-3 rounded-2xl mb-2 flex justify-between"><div><b>${v.name}</b> - ${v.type} - ${v.status}</div>${v.status==='Pending'?`<button onclick="approveVendor('${v.id}')" class="bg-[#22c55e] text-black px-3 rounded-xl">Approve</button>`:'Approved'}</div>`).join('');const total=data.bookings.reduce((a,b)=>a+b.ourCut,0);document.getElementById('t3').innerHTML=`<div class="card p-4 rounded-3xl"><div class="text-3xl font-bold text-[#22c55e]">KES ${total.toLocaleString()}</div><div>Our Earnings</div></div>`;document.getElementById('t4').innerHTML=data.activities.map(a=>`<div class="card p-2 rounded-xl mb-1 text-sm">${a.time} - ${a.entity} ${a.entityId}: ${a.action}</div>`).join('')||'No activity';});}function approveHotel(id){fetch('/api/admin/approve-hotel',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`id=${id}`}).then(()=>load())}function approveVendor(id){fetch('/api/admin/approve-vendor',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`id=${id}`}).then(()=>load())}</script></body></html>
